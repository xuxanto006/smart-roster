<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="color-scheme" content="light dark">
<title>智能排班</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231d1d1f'/><text x='50' y='66' font-size='46' font-family='system-ui' font-weight='700' text-anchor='middle' fill='%23fff'>SR</text></svg>">
<style>
  :root { --bg:#f5f5f7; --text:#1d1d1f; --text-3:#86868b; --accent:#0071e3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --text:#f5f5f7; --text-3:#8e8e93; --accent:#0a84ff; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
      "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-direction: column;
  }
  .logo {
    width: 44px; height: 44px; border-radius: 12px;
    display: grid; place-items: center;
    background: var(--text); color: var(--bg);
    font-size: 15px; font-weight: 700; letter-spacing: .02em;
  }
  .txt { font-size: 13px; color: var(--text-3); }
  .spin {
    width: 16px; height: 16px; margin-top: 4px;
    border: 2px solid var(--accent); border-top-color: transparent;
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .links { margin-top: 10px; font-size: 13px; display: flex; gap: 16px; }
  a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <div class="logo">SR</div>
  <div class="txt">正在进入…</div>
  <div class="spin"></div>
  <div class="links">
    <a href="login.html">登录</a>
    <a href="register.html">注册</a>
  </div>

<script>
/* 站点入口：不再让根路径落到旧单机版页面
   - 有未过期会话 → 经理/只读去工作台，员工去我的班表
   - 没有会话 / 会话过期 → 登录页 */
(function () {
  'use strict';
  var to = 'login.html';
  try {
    var raw = localStorage.getItem('sr.session');
    if (raw) {
      var o = JSON.parse(raw);
      var alive = o && o.access_token && (!o.expires_at || Date.now() < Number(o.expires_at) + 0);
      if (alive) to = o.role === 'employee' ? 'me.html' : 'manager.html';
    }
  } catch (e) { /* 隐私模式下读不到 localStorage，直接去登录页 */ }
  location.replace(to);
})();
</script>
</body>
</html>
