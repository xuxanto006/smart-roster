<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="color-scheme" content="light dark">
<title>智能排班</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231d1d1f'/><text x='50' y='66' font-size='46' font-family='system-ui' font-weight='700' text-anchor='middle' fill='%23fff'>SR</text></svg>">
<style>
  :root { --bg:#f5f5f7; --text:#1d1d1f; --text-3:#86868b; --accent:#0071e3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --text:#f5f5f7; --text-3:#8e8e93; --accent:#0a84ff; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
      "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-direction: column;
  }
  .logo {
    width: 44px; height: 44px; border-radius: 12px;
    display: grid; place-items: center;
    background: var(--text); color: var(--bg);
    font-size: 15px; font-weight: 700; letter-spacing: .02em;
  }
  .txt { font-size: 13px; color: var(--text-3); }
  .spin {
    width: 16px; height: 16px; margin-top: 4px;
    border: 2px solid var(--accent); border-top-color: transparent;
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .links { margin-top: 10px; font-size: 13px; display: flex; gap: 16px; }
  a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <div class="logo">SR</div>
  <div class="txt">正在进入…</div>
  <div class="spin"></div>
  <div class="links">
    <a href="login.html">登录</a>
    <a href="register.html">注册</a>
  </div>

<script src="auth-core.js"></script>
<script>
/* 站点入口：不再让根路径落到旧单机版页面
   - 有可用会话 → 经理/只读去工作台，员工去我的班表
   - 会话过了 1 小时但本机「记住了登录」→ 先用 refresh_token 静默续期，续上了照样直接进
   - 没有会话 / 续期失败 → 登录页 */
(function () {
  'use strict';
  function go(s) {
    var to = 'login.html';
    if (s && s.access_token) to = s.role === 'employee' ? 'me.html' : 'manager.html';
    location.replace(to);
  }
  var raw = null;
  try { raw = (window.SR && SR.session) ? SR.session.raw() : null; } catch (e) { raw = null; }
  if (raw && raw.remember && window.SR && SR.session && SR.session.ensure) {
    SR.session.ensure().then(go, go);   /* 续期失败也会落到登录页（go(false)） */
    return;
  }
  go(window.SR && SR.session ? SR.session.get() : null);
})();
</script>
</body>
</html>
