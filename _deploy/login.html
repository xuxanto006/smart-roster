<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="color-scheme" content="light dark">
<title>登录 · 智能排班</title>
<link rel="stylesheet" href="ui.css">
<style>
  /* 开发快捷登录：只在本机 / ?dev=1 时出现，样式沿用设计系统 */
  .quick { margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--line); }
  .quick-head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12.5px; font-weight: 600; color: var(--text-2); letter-spacing: .02em;
  }
  .quick-acts { display: flex; gap: 8px; margin-top: 10px; }
  .quick-acts .btn { flex: 1; height: 40px; font-size: 14px; }
  .quick-form { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .quick-form .input { height: 40px; }
  .quick-form .select { height: 40px; padding: 0 12px; }
  .quick-form .field > label { font-size: 12px; }
  .quick-head-acts { display: flex; gap: 8px; }
  /* 关键：.quick-form 有 display:flex，会盖掉 UA 的 [hidden]{display:none}，这里补回来 */
  .quick [hidden] { display: none !important; }
  /* 记住这台设备 */
  .rem { display: flex; align-items: center; gap: 9px; margin: 2px 0 14px; cursor: pointer; user-select: none; }
  .rem input {
    appearance: none; -webkit-appearance: none; margin: 0; flex: none;
    width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line);
    background: var(--surface); position: relative; cursor: pointer; transition: all .18s var(--ease);
  }
  .rem input:checked { background: var(--accent); border-color: var(--accent); }
  .rem input:checked::after {
    content: ''; position: absolute; left: 5px; top: 1.5px;
    width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .rem span { font-size: 13px; color: var(--text-2); line-height: 1.4; }
  .rem b { font-weight: 600; color: var(--text); }
  .rem input:focus-visible { box-shadow: 0 0 0 3px var(--accent-soft); }
  /* 一键登录时「逐字填入」的高亮：让用户看清这次用的是哪个账号 */
  .input.typing {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231d1d1f'/><text x='50' y='66' font-size='46' font-family='system-ui' font-weight='700' text-anchor='middle' fill='%23fff'>SR</text></svg>">
</head>
<body>

<main class="page">

  <header class="brand-row">
    <div class="logo" id="mark">SR</div>
    <div>
      <h1>智能排班</h1>
      <p>深圳卓悦中心 · 云端工作台</p>
    </div>
  </header>

  <section class="card auth" id="card">

    <h2 class="h2">登录</h2>
    <p class="sub">使用账号名与密码进入工作台</p>

    <form class="form" id="loginForm" novalidate autocomplete="on" style="margin-top:22px">

      <div class="field" id="fU">
        <label for="u">账号名</label>
        <div class="input-shell">
          <input class="input" id="u" name="username" type="text" autocomplete="username"
                 autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="20"
                 placeholder="例如 zhangwei" required>
        </div>
      </div>

      <div class="field" id="fP">
        <label for="p">密码</label>
        <div class="input-shell">
          <input class="input has-tail" id="p" name="password" type="password"
                 autocomplete="current-password" maxlength="72" placeholder="区分大小写" required>
          <div class="tail">
            <button class="icon-btn" type="button" id="eye" aria-label="显示密码">
              <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="hintbar" id="capHint"></div>

      <p class="hint" style="margin:0 0 8px">人机验证 · 算出下面的结果才能登录；有效期很短，过期点右侧按钮换一题。</p>

      <div class="captcha show" id="cap">
        <div class="cap-qwrap">
          <span class="cap-q" id="capQ">载入中…</span>
          <svg class="ring" viewBox="0 0 30 30" id="capRing">
            <circle class="bg" cx="15" cy="15" r="13"></circle>
            <circle class="fg" cx="15" cy="15" r="13"></circle>
          </svg>
        </div>
        <input class="cap-in" id="capA" inputmode="numeric" maxlength="3" placeholder="答案"
               autocomplete="off" aria-label="计算结果">
        <button class="icon-btn" type="button" id="capNew" aria-label="换一题">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>

      <div class="msg" id="msg" role="alert">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5v.01"/></svg>
        <span id="msgText"></span>
      </div>

      <label class="rem" for="remember">
        <input type="checkbox" id="remember" checked>
        <span><b>记住这台设备</b>：30 天内打开就不用再输一次密码</span>
      </label>

      <button class="btn primary block" id="submit" type="submit">
        <span class="spin"></span><span class="txt">登录</span>
      </button>

    </form>

    <!-- 开发快捷登录：默认隐藏，JS 判定后才显示（不靠 JS 也守着）。
         开发期默认可见；点「不再显示」或地址带 ?dev=0 即隐藏，
         账号密码不写进代码库，只存在本机 localStorage。 -->
    <div class="quick" id="quick" hidden>
      <div class="quick-head">
        <span>开发快捷登录</span>
        <div class="quick-head-acts">
          <button class="btn plain sm" id="quickCfg" type="button">设置账号</button>
          <button class="btn plain sm" id="quickOff" type="button">不再显示</button>
        </div>
      </div>
      <p class="hint" id="quickHint" style="margin:6px 0 0">点一下直接进，不用输账号密码，也不用算验证码。凭据只存在本机浏览器，不写进仓库。</p>
      <div class="quick-acts">
        <button class="btn ghost" id="quickMgr" type="button">管理员身份</button>
        <button class="btn ghost" id="quickEmp" type="button">普通用户身份</button>
      </div>
      <div class="quick-form" id="quickForm" hidden>
        <div class="field">
          <label for="qkId">给哪个身份存账号</label>
          <select class="select" id="qkId">
            <option value="manager">管理员</option>
            <option value="employee">普通用户</option>
          </select>
        </div>
        <div class="field">
          <label for="qkU">账号名</label>
          <div class="input-shell">
            <input class="input" id="qkU" type="text" autocapitalize="off" autocorrect="off"
                   spellcheck="false" maxlength="20" placeholder="例如 superadmin">
          </div>
        </div>
        <div class="field">
          <label for="qkP">密码</label>
          <div class="input-shell">
            <input class="input" id="qkP" type="password" maxlength="72" placeholder="只存本机，不上传">
          </div>
        </div>
        <div class="quick-acts">
          <button class="btn plain" id="qkSave" type="button">保存到本机</button>
          <button class="btn plain" id="qkClear" type="button">清空全部</button>
        </div>
      </div>
    </div>

    <!-- 结果态 -->
    <div class="state" id="state">
      <div class="halo">
        <svg viewBox="0 0 96 96">
          <circle class="c" cx="48" cy="48" r="42"/>
          <path class="p" d="M31 49.5l11.5 11.5L66 36.5"/>
        </svg>
      </div>
      <h2 id="stTitle">登录成功</h2>
      <p id="stDesc"></p>
      <div class="kv" id="stKv"></div>
      <div class="acts" id="stActs"></div>
    </div>

  </section>

  <div class="foot" id="foot">
    <span class="dev">
      <svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2.5"/><path d="M10.5 18.5h3"/></svg>
      <span id="devText">正在识别本机…</span>
    </span>
    <a href="register.html" id="footReg">没有账号？用邀请码注册</a>
  </div>

  <p class="legal" id="legal">
    首次在新设备登录会自动登记该设备；账号停用后本设备也会被禁入。
  </p>

</main>

<script src="auth-core.js"></script>
<script>
(function () {
  'use strict';
  var $ = SR.$;

  var form = $('#loginForm');
  var btn = $('#submit');
  var msgBox = $('#msg');
  var msgText = $('#msgText');
  var fU = $('#fU'), fP = $('#fP');
  var inpU = $('#u'), inpP = $('#p');
  var cap = $('#cap'), capQ = $('#capQ'), capA = $('#capA'), capRing = $('#capRing');
  var hint = $('#capHint');
  var stateBox = $('#state');
  var remBox = $('#remember');

  /* capToken 由服务端签发（captcha 函数），答案不上传，只在登录时随 token 一起回传判卷 */
  var CAP_TTL = 13; /* 算式有效期（秒）：题就在眼前，短窗口也够用，还能把 token 可复用时间压到最低 */
  var S = { fails: 0, capToken: '', capDead: false, stopRing: null, busy: false };

  /* ---------- 初始化 ---------- */
  /* 「记住这台设备」的勾选状态是本机偏好，下次打开沿用上次的选择 */
  (function rememberPref() {
    var v = '';
    try { v = localStorage.getItem('sr.rememberPref') || ''; } catch (e) {}
    if (v === '0') remBox.checked = false;
    else if (v === '1') remBox.checked = true;
    remBox.addEventListener('change', function () {
      try { localStorage.setItem('sr.rememberPref', remBox.checked ? '1' : '0'); } catch (e) {}
    });
  })();

  /* 已经「记住」的这台设备：不再让用户输密码，签票续期后直接进
     想换账号就在地址后面加 ?stay=1（登录页底部也有入口） */
  var AUTO = false;
  (function autoEnter() {
    if (/(^|[?&])stay=1(&|$)/.test(location.search)) return;
    var raw = null;
    try { raw = SR.session.raw(); } catch (e) { raw = null; }
    if (!raw || !raw.remember) return;
    AUTO = true;
    form.style.display = 'none';
    $('#quick').hidden = true;
    setMsg('这台设备已记住登录，正在进入…', 'info');
    SR.session.ensure().then(function (s) {
      if (!s) {
        AUTO = false;
        form.style.display = '';
        $('#quick').hidden = !quickAllowed();
        setMsg('记住的登录已失效，请重新登录一次');
        refreshCaptcha();
        return;
      }
      location.replace(s.role === 'employee' ? 'me.html' : 'manager.html');
    });
  })();

  (function prefill() {
    var sess = SR.session.get();
    var last = (sess && sess.username) || SR.session.lastUser();
    if (last) inpU.value = last;
    if (sess && sess.role && !AUTO) {
      hint.classList.add('show');
      hint.innerHTML = '上次登录身份：<b>' + (sess.display_name || last) + '</b>' +
        (sess.role === 'employee' ? '（员工）' : '（排班经理）') + '，直接输入密码即可继续';
    }
    setTimeout(function () {
      if (AUTO) return;
      (inpU.value ? inpP : inpU).focus();
    }, 300);
  })();

  (function devLabel() {
    var id = SR.deviceId();
    $('#devText').textContent = '本机标识 ' + id.slice(0, 4) + '…' + id.slice(-4) + ' · 已登记';
  })();

  /* ---------- 显示 / 隐藏密码 ---------- */
  $('#eye').addEventListener('click', function () {
    var on = inpP.type === 'password';
    inpP.type = on ? 'text' : 'password';
    this.setAttribute('aria-label', on ? '隐藏密码' : '显示密码');
    this.innerHTML = on
      ? '<svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.2A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1"/><path d="M6.6 6.8A16.7 16.7 0 0 0 2 12s3.6 7 10 7a9.8 9.8 0 0 0 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
    inpP.focus();
  });

  /* ---------- 大写锁定提示 ---------- */
  inpP.addEventListener('keyup', function (e) {
    var on = false;
    try { on = typeof e.getModifierState === 'function' && e.getModifierState('CapsLock'); } catch (err) {}
    if (on) {
      hint.classList.add('show');
      hint.innerHTML = '<b>大写锁定已开启</b>，密码区分大小写';
    } else {
      hint.classList.remove('show');
    }
  });

  /* ---------- 服务端算式（每次登录都要过） ---------- */
  function refreshCaptcha() {
    S.capDead = false;
    S.capToken = '';
    capQ.textContent = '载入中…';
    capA.value = '';
    capRing.classList.remove('low', 'dead');
    SR.api.captcha(CAP_TTL).then(function (res) {
      var d = res.data || {};
      if (!d.ok || !d.token) {
        capQ.textContent = '验证码服务未就绪';
        S.capDead = true;
        setMsg(d.error || '验证码加载失败，请检查网络后重试', 'info');
        return;
      }
      S.capToken = d.token;
      capQ.textContent = d.question;
      if (S.stopRing) S.stopRing();
      S.stopRing = SR.ui.startRing(capRing, d.expires_in || 180, function () {
        S.capDead = true;
        capQ.textContent = '已过期';
        setMsg('验证码已过期，点右侧按钮换一题', 'info');
      });
    }).catch(function () {
      capQ.textContent = '载入失败';
      S.capDead = true;
      setMsg('验证码加载失败，请检查网络后重试');
    });
  }

  $('#capNew').addEventListener('click', function () {
    if (S.stopRing) S.stopRing();
    setMsg('');
    refreshCaptcha();
    capA.focus();
  });

  /* 切回页面时若算式已过期，顺手换一题；不做定时轮询，避免挂机一直打接口 */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && S.capDead && form.style.display !== 'none') {
      refreshCaptcha();
    }
  });

  /* 自动进入中就不必先要一道算式（省一次请求） */
  if (!AUTO) refreshCaptcha();

  /* ---------- 消息 ---------- */
  function setMsg(text, kind) {
    if (!text) { msgBox.classList.remove('show'); return; }
    msgBox.classList.remove('ok', 'info');
    if (kind) msgBox.classList.add(kind);
    msgText.textContent = text;
    msgBox.classList.add('show');
  }

  function badField(field) {
    field.classList.add('is-bad');
    SR.ui.shake(field);
  }

  [inpU, inpP].forEach(function (el) {
    el.addEventListener('input', function () {
      (el === inpU ? fU : fP).classList.remove('is-bad');
      setMsg('');
    });
  });

  /* ---------- 提交 ---------- */
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (S.busy) return;

    var username = inpU.value.trim().toLowerCase();
    var password = inpP.value;

    if (!/^[a-z0-9_]{3,20}$/.test(username)) {
      badField(fU);
      setMsg('账号名只能用英文字母、数字、下划线，长度 3–20 位');
      inpU.focus();
      return;
    }
    if (!password) {
      badField(fP);
      setMsg('请输入密码');
      inpP.focus();
      return;
    }
    var answer = capA.value.trim();
    if (!answer) {
      SR.ui.shake(cap);
      setMsg('请先算出旁边的算式结果');
      capA.focus();
      return;
    }
    if (!S.capToken || S.capDead) {
      setMsg('验证码已失效，已为你换一题', 'info');
      refreshCaptcha();
      return;
    }

    S.busy = true;
    SR.ui.setLoading(btn, true);
    btn.querySelector('.txt').textContent = '正在验证…';
    setMsg('');

    SR.api.login({
      username: username,
      password: password,
      device_id: SR.deviceId(),
      ua: SR.ua(),
      captcha_token: S.capToken,
      captcha_answer: answer
    }).then(function (res) {
      var d = res.data || {};
      SR.ui.setLoading(btn, false);
      btn.querySelector('.txt').textContent = '登录';
      S.busy = false;

      if (d.ok) return onSuccess(res, username);
      onFail(d);
    }).catch(function () {
      SR.ui.setLoading(btn, false);
      btn.querySelector('.txt').textContent = '登录';
      S.busy = false;
      setMsg('网络异常，请稍后重试');
    });
  });

  function onFail(d) {
    var reason = d.reason || d.code || '';
    var message = d.message || d.error || '登录失败';

    switch (reason) {
      case 'PENDING_APPROVAL':
        return showState('warn', '账号待审核', '排班经理通过后即可登录。', [
          ['账号', inpU.value.trim().toLowerCase()],
          ['当前状态', '待审核']
        ], [
          { label: '我已通过审核，重新登录', primary: true, onclick: resetToForm },
          { label: '返回', ghost: true, onclick: resetToForm }
        ]);

      case 'DISABLED':
        return showState('bad', '账号已停用', '停用后账号与已发布班表均不可访问，如需恢复请联系排班经理。', [
          ['账号', inpU.value.trim().toLowerCase()]
        ], [{ label: '返回', ghost: true, onclick: resetToForm }]);

      case 'REJECTED':
        return showState('bad', '申请未通过', message, [
          ['账号', inpU.value.trim().toLowerCase()]
        ], [{ label: '返回', ghost: true, onclick: resetToForm }]);

      case 'DEVICE_BANNED':
        return showState('bad', '此设备已被封禁', '这台设备已被禁止登录，请联系排班经理解封。', [
          ['设备标识', SR.deviceId().slice(0, 6) + '…' + SR.deviceId().slice(-4)]
        ], [{ label: '返回', ghost: true, onclick: resetToForm }]);

      case 'TOO_MANY_FAILS':
        setMsg(message || '密码错误次数太多，请 15 分钟后再试');
        return SR.ui.toast('已触发登录保护', 'bad');

      case 'CAPTCHA_REQUIRED':
      case 'CAPTCHA_FAILED':
        SR.ui.shake(cap);
        setMsg(message || '算式结果不对，请重新计算');
        refreshCaptcha();
        capA.focus();
        return;

      case 'NO_SUCH_USER':
      case 'BAD_CREDENTIALS':
        S.fails += 1;
        setMsg(message || '账号或密码不对');
        badField(fP);
        refreshCaptcha();
        capA.focus();
        return;

      case 'BAD_DEVICE':
        return setMsg('设备标识异常，请刷新页面后重试');

      case 'OFFLINE':
      case 'NETWORK':
      case 'TIMEOUT':
        setMsg(message);
        return SR.ui.toast('网络不可用', 'bad');

      case 'SERVER_MISCONFIG':
        return setMsg('服务未就绪，请联系管理员（缺少服务端密钥）');

      default:
        setMsg(message || '登录失败，请稍后重试');
    }
  }

  function onSuccess(res, username) {
    if (S.stopRing) S.stopRing();
    var keep = !!(remBox && remBox.checked);
    var sess = SR.session.from(res, username, keep);
    SR.session.save(sess);
    SR.session.setLastUser(username);

    var isManager = sess.role === 'manager' || sess.role === 'viewer';
    var roleText = sess.role === 'manager' ? '排班经理'
      : (sess.role === 'viewer' ? '只读查看' : '员工');

    showState('ok', '欢迎回来，' + (sess.display_name || username), '', [
      ['账号', sess.username],
      ['身份', roleText],
      ['本机', SR.deviceId().slice(0, 6) + '…' + SR.deviceId().slice(-4)],
      ['会话有效', Math.round((sess.expires_in || 3600) / 60) + ' 分钟'],
      ['这台设备', keep ? '已记住 · 30 天内免密' : '未记住 · 关掉就需重登']
    ], isManager
      ? [
          { label: '进入排班工作台', primary: true, onclick: function () { location.href = 'manager.html'; } },
          { label: '进入账号中心', ghost: true, onclick: function () { location.href = 'view-account.html'; } }
        ]
      : [
          { label: '查看我的班表', primary: true, onclick: function () { location.href = 'me.html'; } },
          { label: '返回登录页', ghost: true, onclick: resetToForm }
        ], isManager ? '' : '这里只显示经理已经发布的班表，草稿改动不会影响你看到的这一份。');
  }

  /* ---------- 结果态 ---------- */
  function showState(kind, title, desc, kv, actions, extraDesc) {
    form.style.display = 'none';
    $('#foot').style.display = 'none';
    $('#legal').style.display = 'none';
    $('#quick').style.display = 'none';
    stateBox.className = 'state show' + (kind === 'bad' ? ' bad' : (kind === 'warn' ? ' warn' : ''));
    $('#stTitle').textContent = title;
    $('#stDesc').textContent = extraDesc || desc || '';

    var kvBox = $('#stKv');
    kvBox.innerHTML = '';
    if (kv && kv.length) {
      kv.forEach(function (row) {
        var d = document.createElement('div');
        var s = document.createElement('span');
        var b = document.createElement('b');
        s.textContent = row[0];
        b.textContent = row[1];
        d.appendChild(s);
        d.appendChild(b);
        kvBox.appendChild(d);
      });
      kvBox.style.display = '';
    } else {
      kvBox.style.display = 'none';
    }

    var acts = $('#stActs');
    acts.innerHTML = '';
    (actions || []).forEach(function (a) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn block ' + (a.primary ? 'primary' : 'ghost');
      b.textContent = a.label;
      if (a.disabled) b.disabled = true;
      if (a.onclick) b.addEventListener('click', a.onclick);
      acts.appendChild(b);
    });
  }

  function resetToForm() {
    stateBox.className = 'state';
    form.style.display = '';
    $('#foot').style.display = '';
    $('#legal').style.display = '';
    $('#quick').style.display = '';
    setMsg('');
    inpP.value = '';
    capA.value = '';
    refreshCaptcha();
    inpP.focus();
  }

  /* ============================================================
     开发快捷登录（一键登录 · 选身份）
     ------------------------------------------------------------
     设计约束（别改坏这几条）：
       ① **开发期公网也开着**（当前阶段刻意为之）：面板与内置开发账号（DEV_SEED）
          在公网默认同样生效，方便随手点进去看。想收口只有三个开关：
          · `DEV_SEED.on = false`（内置账号立即失效，最彻底）
          · `QUICK.on = false`（整块面板消失）
          · 地址加 `?dev=0`，或点面板上的「不再显示」（只对这台机器生效）
       ② **不绕过服务端**：仍然调 `login` 函数，人机验证也照做——题面本来就下发在
          页面上（算术题），脚本自己解出来，服务端照样校验 token 与答案；
       ③ 登录后核对身份：点「管理员」进来的账号必须是 manager/viewer，否则明确报错，
          避免"点了管理员、进来却是员工"的错觉。
       ④ 手动存的凭据只写进本机 localStorage `sr_quick_cred_v1`，不会回传服务器。
     ⚠ 现在公网上任何拿到地址的人都能一键进 superadmin。真上线前务必先关掉 DEV_SEED。
     首次填充（可选，方便做成书签）：
       login.html?dev=1&mgr=superadmin|密码&emp=zhangsan|密码
       —— 只读一次、写进本机 localStorage，地址栏里会留密码，自己权衡。 */
  var QUICK = {
    on: true,                       /* 想彻底关掉：改 false 并重新部署 */
    key: 'sr_quick_cred_v1',
    flag: 'sr_quick',
    hosts: ['localhost', '127.0.0.1', '0.0.0.0', '[::1]']
  };

  /* 开发期内置账号：公网默认同样生效（当前阶段），关掉只需把 on 改 false。
     ⚠ 这里是明文密码，仓库若是 public 就等于公开。
     `legacy.u` 是「前端已改叫 test、库里还是旧名」时的兜底（密码沿用同一个）：
     改名要靠 007_rename_dev_employee.sql，跑完之后这段不会再触发。
     兜底成功后会在右下角明确提示，绝不偷偷用别的账号进。 */
  var DEV_SEED = {
    on: true,
    manager: { u: 'superadmin', p: 'huawei@123' },
    employee: { u: 'test', p: '12345678', legacy: { u: 'xmt' } }
  };

  /* 目前与 quickAllowed 同语义：默认开 → `?dev=0` 或本机点过「不再显示」才关。
     以后要恢复「只有本机/开发状态才有内置账号」，把下面几行换成
     `if (location.protocol === 'file:') return true;
      if (QUICK.hosts.indexOf(location.hostname) >= 0) return true;
      return /(^|[?&])dev=1(&|$)/.test(location.search);` 即可 */
  function seedAllowed() {
    if (!DEV_SEED.on) return false;
    if (/(^|[?&])dev=0(&|$)/.test(location.search)) return false;
    try { return localStorage.getItem(QUICK.flag) !== '0'; } catch (e) { return true; }
  }

  function quickAllowed() {
    if (!QUICK.on) return false;
    if (location.protocol === 'file:') return true;
    if (QUICK.hosts.indexOf(location.hostname) >= 0) return true;
    if (/(^|[?&])dev=1(&|$)/.test(location.search)) return true;
    if (/(^|[?&])dev=0(&|$)/.test(location.search)) return false;
    /* 开发期默认可见：点过「不再显示」才会写 0；正式上线把上面 QUICK.on 改 false */
    try { return localStorage.getItem(QUICK.flag) !== '0'; } catch (e) { return true; }
  }

  /* 本机真存下来的那份（不掺内置账号，免得把内置密码又写回 localStorage） */
  function quickLoadRaw() {
    try { return JSON.parse(localStorage.getItem(QUICK.key) || '{}') || {}; } catch (e) { return {}; }
  }

  function quickLoad() {
    var all = quickLoadRaw();
    if (seedAllowed()) {
      if (!all.manager || !all.manager.u) all.manager = DEV_SEED.manager;
      if (!all.employee || !all.employee.u) all.employee = DEV_SEED.employee;
    }
    return all;
  }

  function quickStore(all) {
    try { localStorage.setItem(QUICK.key, JSON.stringify(all || {})); } catch (e) {}
    renderQuick();
  }

  /* URL 里带的一次性种子：?dev=1&mgr=账号|密码&emp=账号|密码 */
  (function quickSeed() {
    if (!/(^|[?&])dev=1(&|$)/.test(location.search)) return;
    var q = {};
    location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i > 0) q[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
    });
    var map = { mgr: 'manager', emp: 'employee' }, all = quickLoadRaw(), dirty = false;
    Object.keys(map).forEach(function (k) {
      if (!q[k]) return;
      var parts = String(q[k]).split('|');
      if (parts.length < 2 || !parts[0] || !parts[1]) return;
      all[map[k]] = { u: parts[0].trim().toLowerCase(), p: parts[1] };
      dirty = true;
    });
    if (!dirty) return;
    try { localStorage.setItem(QUICK.key, JSON.stringify(all)); } catch (e) {}
    /* 存完就把地址栏里的密码抹掉，别留在历史记录里 */
    try {
      var clean = location.search.replace(/[?&](mgr|emp)=[^&]*/g, '');
      history.replaceState(null, '', location.pathname + clean + location.hash);
    } catch (e) {}
  })();

  function renderQuick() {
    var all = quickLoad();
    var tag = function (c) { return c && c.u ? ' · ' + c.u : ' · 未设置'; };
    $('#quickMgr').textContent = '管理员身份' + tag(all.manager);
    $('#quickEmp').textContent = '普通用户身份' + tag(all.employee);
    if (seedAllowed()) {
      $('#quickHint').textContent = '开发状态：已内置 ' + DEV_SEED.manager.u + '（管理员）与 ' +
        DEV_SEED.employee.u + '（普通用户），点按钮直接进；登录仍过服务端算式与设备登记。';
    }
  }

  /* 题面形如 "12 + 7 = ?"（服务端只会出这一个格式），本地解出来当答案 */
  function solveQuestion(text) {
    var m = /^\s*(\d{1,3})\s*([+\-])\s*(\d{1,3})\s*=\s*\?/.exec(String(text || ''));
    if (!m) return null;
    var a = Number(m[1]), b = Number(m[3]);
    return m[2] === '+' ? a + b : a - b;
  }

  /* 「前端显示 test、库里校验的仍是旧名」的兜底：
     只有拿的确实是 DEV_SEED 里那份内置凭据（账号密码都对得上）、且服务端明说
     「查无此人 / 密码不对」时才启用；用户自己在本机存的账号一律不替换。
     `?dev=0`、本机点过「不再显示」、DEV_SEED.on=false 时兜底一并失效。 */
  function legacyOf(kind, c) {
    if (!seedAllowed()) return null;
    var seed = DEV_SEED[kind];
    if (!seed || !seed.legacy || !seed.legacy.u) return null;
    if (String(c.u).trim().toLowerCase() !== String(seed.u).trim().toLowerCase()) return null;
    if (c.p !== seed.p) return null;
    return { u: seed.legacy.u, p: seed.legacy.p || seed.p };
  }

  /* 取新题 → 解算式 → 走真实 login 函数（每次调用都用一枚新 token，重试也不例外） */
  function tryLogin(cred) {
    return SR.api.captcha(CAP_TTL).then(function (r1) {
      var d1 = (r1 && r1.data) || {};
      var ans = solveQuestion(d1.question);
      if (!d1.ok || !d1.token || ans === null) throw new Error('captcha unavailable');
      return SR.api.login({
        username: String(cred.u).trim().toLowerCase(),
        password: cred.p,
        device_id: SR.deviceId(),
        ua: SR.ua(),
        captcha_token: d1.token,
        captcha_answer: String(ans)
      });
    });
  }

  /* 一键登录不「瞬间填好」：把账号、密码逐字打进上面那两个输入框，
     用户能看清楚这次用的是谁；打完再发请求，失败了还能直接在表单里改。
     每字 45ms（12 个字符约 0.5 秒），比机器打字还快，但眼睛能跟上。 */
  var TYPE_MS = 45;
  function typeInto(input, text) {
    return new Promise(function (resolve) {
      if (!input) { resolve(); return; }
      var s = String(text == null ? '' : text);
      input.value = '';
      try { input.focus(); } catch (e) {}
      if (input.classList) input.classList.add('typing');
      var i = 0;
      (function step() {
        if (i >= s.length) {
          if (input.classList) input.classList.remove('typing');
          resolve();
          return;
        }
        input.value += s.charAt(i++);
        setTimeout(step, TYPE_MS);
      })();
    });
  }

  /* 手机上一键登录时，表单可能在屏幕外：先滚到输入框，别让「打字」看不见 */
  function revealForm() {
    try {
      var el = $('#u');
      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } catch (e) {}
  }

  var QBUSY = false;
  function quickLogin(kind) {
    if (QBUSY || S.busy) return;
    var all = quickLoad(), c = all[kind];
    if (!c || !c.u || !c.p) {
      $('#quickForm').hidden = false;
      $('#qkId').value = kind;
      setMsg('先给「' + (kind === 'manager' ? '管理员' : '普通用户') + '」存一次账号密码，之后就点一下进', 'info');
      $('#qkU').focus();
      return;
    }
    QBUSY = true;
    $('#quickMgr').disabled = true;
    $('#quickEmp').disabled = true;
    revealForm();

    var used = String(c.u).trim().toLowerCase();
    var alt = legacyOf(kind, c);

    setMsg('正在填入账号…', 'info');
    typeInto($('#u'), used).then(function () {
      setMsg('正在填入密码…', 'info');
      return typeInto($('#p'), c.p);
    }).then(function () {
      setMsg('正在一键登录…', 'info');
      return tryLogin(c);
    }).then(function (res) {
      var d = (res && res.data) || {};
      /* 只有这两种失败才值得换旧名再试一次；停用 / 待审核 / 设备被封 / 失败过多都不许换 */
      if (!alt || d.ok) return res;
      if (d.reason !== 'BAD_CREDENTIALS' && d.reason !== 'NO_SUCH_USER') return res;
      setMsg('「' + c.u + '」还登不上，正在改用旧账号 ' + alt.u + '…', 'info');
      return typeInto($('#u'), String(alt.u).trim().toLowerCase()).then(function () {
        return tryLogin(alt);
      }).then(function (r2) {
        var d2 = (r2 && r2.data) || {};
        if (!d2.ok) {
          d2.message = '「' + c.u + '」和旧账号「' + alt.u + '」都登不上：先在 Supabase 执行 007 迁移，或在后台把 ' + c.u + ' 建好';
          return r2;
        }
        used = String(alt.u).trim().toLowerCase();
        try {
          SR.ui.toast('库里还没有「' + c.u + '」，这次用改名前的 ' + alt.u + ' 登录（跑 007 迁移后就不会再出现）', 'info');
        } catch (e) {}
        return r2;
      });
    }).then(function (res) {
      QBUSY = false;
      $('#quickMgr').disabled = false;
      $('#quickEmp').disabled = false;
      var d = (res && res.data) || {};
      if (!d.ok) return onFail(d);
      var role = (d.profile && d.profile.role) || '';
      var isMgr = role === 'manager' || role === 'viewer';
      if (kind === 'manager' && !isMgr) {
        return onFail({ ok: false, message: '这个账号实际是「员工」身份，请点下面的「普通用户身份」' });
      }
      if (kind === 'employee' && isMgr) {
        return onFail({
          ok: false,
          message: role === 'viewer'
            ? '这个账号是「只读(viewer)」身份，只能进工作台看，进不了员工端；把它的 role 改成 employee 才能测员工端（见 supabase/migrations/008_dev_test_employee.sql）'
            : '这个账号实际是「管理员」身份，请点上面的「管理员身份」'
        });
      }
      onSuccess(res, used);
    }).catch(function () {
      QBUSY = false;
      $('#quickMgr').disabled = false;
      $('#quickEmp').disabled = false;
      setMsg('一键登录没走通（验证码或网络异常），请用上面的账号密码登录');
    });
  }

  if (quickAllowed()) {
    $('#quick').hidden = false;
    renderQuick();

    $('#quickMgr').addEventListener('click', function () { quickLogin('manager'); });
    $('#quickEmp').addEventListener('click', function () { quickLogin('employee'); });

    $('#quickCfg').addEventListener('click', function () {
      var f = $('#quickForm');
      f.hidden = !f.hidden;
      if (!f.hidden) $('#qkU').focus();
    });

    $('#quickOff').addEventListener('click', function () {
      try { localStorage.setItem(QUICK.flag, '0'); } catch (e) {}
      $('#quick').hidden = true;
      SR.ui.toast('已隐藏快捷登录（想再显示：地址后加 ?dev=1）', 'good');
    });

    $('#qkId').addEventListener('change', function () {
      var c = quickLoad()[this.value];
      $('#qkU').value = (c && c.u) || '';
      $('#qkP').value = '';
    });

    $('#qkSave').addEventListener('click', function () {
      var u = $('#qkU').value.trim().toLowerCase(), p = $('#qkP').value;
      if (!/^[a-z0-9_]{3,20}$/.test(u)) return SR.ui.toast('账号名只能是 3–20 位字母/数字/下划线', 'bad');
      if (!p) return SR.ui.toast('密码不能为空', 'bad');
      var all = quickLoad();
      all[$('#qkId').value] = { u: u, p: p };
      quickStore(all);
      $('#qkU').value = '';
      $('#qkP').value = '';
      $('#quickForm').hidden = true;
      SR.ui.toast('已存到本机：' + u, 'good');
    });

    $('#qkClear').addEventListener('click', function () {
      try { localStorage.removeItem(QUICK.key); } catch (e) {}
      renderQuick();
      SR.ui.toast('已清空本机存的账号', 'good');
    });
  }
})();
</script>
</body>
</html>
