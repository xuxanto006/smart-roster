<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="color-scheme" content="light dark">
<title>排班工作台 · 智能排班</title>
<link rel="stylesheet" href="ui.css">
<style>
  /* 经理端专用样式：只在本页生效，不改共享的 ui.css */
  /* 开店 / 闭店标记：塞在格子的左下角，不挤占班次文字 */
  .cell .r {
    position: absolute; left: 3px; bottom: 2px;
    font-size: 10px; line-height: 1; font-weight: 700; padding: 1px 4px;
    border-radius: 5px; letter-spacing: 0; pointer-events: none;
  }
  .cell .r-open { background: rgba(52, 199, 89, .22); color: #1a7f37; }
  .cell .r-close { background: rgba(255, 149, 0, .24); color: #a15200; }
  /* 「开店 / 闭店」模式下，还没标角色的上班格给个淡淡的占位，让人看得见哪里可以点 */
  .cell .r-none { background: rgba(120, 120, 128, .16); color: var(--text-3); }
  /* 请假 / 必上标记：塞左上角（右上角是「未同步」蓝点，左下角是开/闭） */
  .cell .q {
    position: absolute; left: 3px; top: 2px;
    font-size: 9px; line-height: 1; font-weight: 700; padding: 1px 3px;
    border-radius: 4px; letter-spacing: 0;
  }
  .cell .q-leave { background: rgba(255, 59, 48, .16); color: #c0392b; }
  .cell .q-must { background: rgba(0, 122, 255, .16); color: #0a58ca; }
  /* 请假 / 必上录入 */
  .req-panel {
    margin: 12px 0 4px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--surface); overflow: hidden;
  }
  .req-panel > summary {
    cursor: pointer; padding: 11px 14px; font-size: 13px; font-weight: 600;
    color: var(--text-2); list-style: none;
  }
  .req-panel > summary::-webkit-details-marker { display: none; }
  .req-panel > summary::after { content: "展开"; float: right; font-weight: 400; color: var(--text-2); }
  .req-panel[open] > summary::after { content: "收起"; }
  .req-panel .in { padding: 0 14px 14px; }
  .req-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .req-form .select { max-width: 170px; }
  .req-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .req-row {
    display: flex; align-items: center; gap: 8px; font-size: 13px;
    padding: 6px 10px; border-radius: 10px; background: var(--surface-2);
  }
  .req-row .tag { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--line-soft); color: var(--text-2); }
  .req-row .tag.leave { background: rgba(255, 59, 48, .12); color: #c0392b; }
  .req-row .tag.must { background: rgba(0, 122, 255, .12); color: #0a58ca; }
  .req-row .x { margin-left: auto; }

  /* ============ 三种看法：表格 / 总览 / 按天 ============
     把三块内容放在同一个 #viewBox 里，同一时刻只显示一块；
     全屏编辑 = 给这块盒子加 .fs（固定铺满视口），不是浏览器的 Fullscreen API，
     这样 iOS Safari 上也能用。 */
  .viewbox { position: relative; }
  .viewbox > [hidden] { display: none !important; }
  .viewbox .fs-exit { display: none; }
  .viewbox.fs {
    position: fixed; inset: 0; z-index: 60;
    padding: 12px 12px 20px; padding-top: 54px;
    background: var(--surface); overflow: auto;
    display: flex; flex-direction: column;
  }
  .viewbox.fs > .fs-exit { display: inline-flex; position: fixed; top: 12px; right: 14px; z-index: 61; }
  .viewbox.fs #sheetWrap { max-height: none; flex: 1 1 auto; }
  .viewbox.fs .ovview, .viewbox.fs #overviewWrap { flex: 1 1 auto; min-height: 0; overflow: auto; }
  body.fs-open { overflow: hidden; }

  /* 表格：日期表头可点（点开 = 当天所有人） */
  .grid thead th[data-dayhead] { cursor: pointer; }
  .grid thead th[data-dayhead]:active { background: var(--line-soft); }

  /* 总览：一眼看完全店，按部门分组，一屏尽量装下 */
  .ovwrap { border: 1px solid var(--line-soft); border-radius: 14px; background: var(--surface); overflow: auto; }
  table.ov { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 620px; }
  .ov th, .ov td { border-bottom: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft); }
  .ov tr:last-child td { border-bottom: 0; }
  .ov th:last-child, .ov td:last-child { border-right: 0; }
  .ov thead th {
    position: sticky; top: 0; z-index: 2; background: var(--surface-2);
    font-size: 12px; font-weight: 600; color: var(--text-2); padding: 8px 4px; text-align: center;
  }
  .ov thead th .d { display: block; font-weight: 400; color: var(--text-3); font-size: 11px; }
  .ov thead th.we { color: var(--accent); }
  .ov td { padding: 2px 3px; }
  .ov td.who2 { text-align: left; padding: 5px 10px; font-size: 12.5px; white-space: nowrap; }
  .ov tr.grp td {
    background: var(--surface-2); color: var(--text-2);
    font-size: 11.5px; font-weight: 600; text-align: left; padding: 6px 10px;
  }
  .ob {
    display: flex; align-items: center; justify-content: center;
    height: 24px; border-radius: 6px; font-size: 10.5px; font-weight: 700;
    cursor: pointer; user-select: none;
  }
  .ob.s-early { background: var(--shift-early-bg); color: var(--shift-early); box-shadow: inset 0 0 0 1px var(--shift-early); }
  .ob.s-mid { background: var(--shift-mid-bg); color: var(--shift-mid); box-shadow: inset 0 0 0 1px var(--shift-mid); }
  .ob.s-night { background: var(--shift-night-bg); color: var(--shift-night); box-shadow: inset 0 0 0 1px var(--shift-night); }
  .ob.s-rest { background: var(--surface-2); color: var(--text-3); }
  .ob.s-none { border: 1px dashed var(--line); color: var(--text-3); }

  /* 按天：手机上默认这一屏，用「一天的名单」替代左右横滑 */
  .daytabs {
    display: flex; gap: 6px; overflow: auto; padding: 8px;
    border: 1px solid var(--line-soft); border-radius: 14px; background: var(--surface);
    margin-bottom: 10px; -webkit-overflow-scrolling: touch;
  }
  .daytabs button {
    flex: 0 0 auto; border: 0; background: transparent; font: inherit;
    font-size: 12.5px; color: var(--text-2); padding: 6px 10px; border-radius: 9px; cursor: pointer;
    line-height: 1.25;
  }
  .daytabs button.we:not(.on) { color: var(--accent); }
  .daytabs button.on { background: var(--accent); color: #fff; }
  .daytabs button b { display: block; font-weight: 400; font-size: 11px; opacity: .85; }
  .daycards { border: 1px solid var(--line-soft); border-radius: 14px; background: var(--surface); overflow: hidden; }
  .dcard { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line-soft); }
  .dcard:last-child { border-bottom: 0; }
  .dcard .nm, .drow .nm { flex: 1 1 auto; min-width: 0; font-size: 13.5px; }
  .dcard .nm small, .drow .nm small { display: block; color: var(--text-3); font-size: 11px; }
  .dcard .chip { height: 26px; padding: 0 9px; font-size: 12px; }

  /* 班次快捷按钮（按天视图 / 日期浮窗里共用一套） */
  .mini { display: flex; gap: 4px; flex: none; }
  .mini button {
    min-width: 30px; height: 28px; padding: 0 6px; border-radius: 8px;
    border: 1px solid var(--line); background: transparent; font: inherit;
    font-size: 11.5px; color: var(--text-2); cursor: pointer;
  }
  .mini button:disabled { opacity: .45; cursor: not-allowed; }
  .mini button.on { border-color: transparent; color: #fff; background: var(--accent); }
  .mini button.on.s-early { background: var(--shift-early-bg); color: var(--shift-early); }
  .mini button.on.s-mid { background: var(--shift-mid-bg); color: var(--shift-mid); }
  .mini button.on.s-night { background: var(--shift-night-bg); color: var(--shift-night); }
  .mini button.on.s-rest { background: var(--text-3); }
  .mini button.on.s-none { background: var(--surface-2); color: var(--text-2); }

  /* 日期浮窗：一屏能滚完当天所有人 */
  .daydlg { max-width: 520px; max-height: 82vh; display: flex; flex-direction: column; }
  .daylist {
    margin-top: 4px; overflow: auto; border: 1px solid var(--line-soft);
    border-radius: 12px; -webkit-overflow-scrolling: touch;
  }
  .drow { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line-soft); }
  .drow:last-child { border-bottom: 0; }

  /* 手机上表格缩一点，但「按天」才是默认视图 */
  @media (max-width: 720px) {
    #sheetWrap table.grid { min-width: 660px; }
    .cell { min-width: 40px; height: 34px; font-size: 12px; }
    .viewbox.fs { padding: 8px; padding-top: 50px; }
    .daydlg { max-height: 88vh; }
  }
</style>

</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand-inline" href="manager.html">
      <span class="logo sm">SR</span><b>排班工作台</b>
    </a>
    <span class="sep"></span>
    <span class="badge" id="roleBadge">—</span>
    <a class="btn plain sm" href="view-account.html">账号中心</a>
    <button class="btn plain sm" id="logout" type="button">退出</button>
  </div>
</header>

<main class="wrap wb">

  <div class="wb-head">
    <div class="weeknav">
      <button class="btn ghost sm" id="prev" type="button" aria-label="上一周">‹</button>
      <span class="range" id="range">—</span>
      <button class="btn ghost sm" id="next" type="button" aria-label="下一周">›</button>
      <button class="btn plain sm" id="today" type="button">本周</button>
    </div>
    <span class="badge info" id="pubBadge">载入中…</span>
    <span class="sep"></span>
    <span class="save-state" id="saveState">载入中…</span>
    <button class="btn ghost sm" id="reload" type="button">刷新</button>
    <select class="select" id="genEffort" title="生成质量：精细多花几秒换更好的班表">
      <option value="quality">精细</option>
      <option value="fast">快速</option>
    </select>
    <button class="btn plain" id="genBtn" type="button">生成本周</button>
    <button class="btn primary" id="publishBtn" type="button">发布本周</button>
  </div>

  <div class="toolbar">
    <div class="seg" id="domSeg"></div>
    <input class="search" id="q" type="search" placeholder="搜索员工 / 岗位 / 模块" autocomplete="off">
  </div>

  <div class="toolbar">
    <div class="seg" id="viewSeg" title="换一种看法：表格 / 总览 / 按天">
      <button type="button" data-view="sheet" class="on">表格</button>
      <button type="button" data-view="overview">总览</button>
      <button type="button" data-view="day">按天</button>
    </div>
    <button class="btn plain sm" id="fsBtn" type="button">全屏编辑</button>
    <button class="btn plain sm" id="xlsxBtn" type="button" title="把当前月的班表导出成 Excel：版式与门店现用的参考表一致（列宽/行高/字体/合并/冻结全照抄）">导出 Excel</button>
    <span class="hint" id="viewHint" style="margin:0">点日期表头：看当天所有人</span>
  </div>

  <div class="toolbar">
    <span class="hint" style="margin:0">点格子改：</span>
    <div class="seg" id="modeSeg" title="先选「点格子改什么」，再点格子">
      <button type="button" data-mode="slot" class="on">班次</button>
      <button type="button" data-mode="role">开店 / 闭店</button>
    </div>
    <span class="hint" id="modeHint" style="margin:0">点格子切换：早 → 中 → 晚 → 休 → 清空</span>
  </div>

  <details class="req-panel" id="reqPanel">
    <summary>请假 / 必上录入 <span class="badge info" id="reqCount">0</span></summary>
    <div class="in">
      <div class="req-form">
        <select class="select" id="reqName" title="选员工"></select>
        <select class="select" id="reqDay" title="哪一天">
          <option value="">整周</option>
          <option value="0">周一</option>
          <option value="1">周二</option>
          <option value="2">周三</option>
          <option value="3">周四</option>
          <option value="4">周五</option>
          <option value="5">周六</option>
          <option value="6">周日</option>
        </select>
        <select class="select" id="reqType" title="请假 / 必须上班">
          <option value="leave">请假</option>
          <option value="must">必须上班</option>
        </select>
        <button class="btn plain" id="reqAdd" type="button">添加</button>
      </div>
      <div class="req-list" id="reqList"></div>
      <p class="hint">请假 = 这天必须休息（留「整周」就是整周请假）；必须上班 = 这天不能排休息。录完点右上角「生成本周」重排才会生效，格子上会标「请 / 必」。</p>
    </div>
  </details>

  <p class="hint" id="genResult" hidden></p>

  <div class="legend">
    <span><i class="lg-early"></i>早班</span>
    <span><i class="lg-mid"></i>中班</span>
    <span><i class="lg-night"></i>晚班</span>
    <span><i class="lg-rest"></i>休息</span>
    <span class="mute">左下角「开 / 闭」＝开店 / 闭店（切到「开店 / 闭店」模式后点格子可改）；右上角蓝点＝还没同步</span>
  </div>

  <div class="viewbox" id="viewBox">
    <button class="btn ghost sm fs-exit" id="fsExit" type="button">退出全屏</button>
    <div class="sheet-wrap" id="sheetWrap">
      <div class="skeleton">正在载入班表…</div>
    </div>
    <div class="ovview" id="overviewWrap" hidden></div>
    <div class="dayview" id="dayWrap" hidden></div>
  </div>

  <div class="stats" id="stats"></div>

  <p class="hint" id="hint"></p>
</main>

<div class="overlay" id="dayOv">
  <div class="sheet daydlg">
    <h3 id="dayTitle">—</h3>
    <p class="sub" id="dayDesc"></p>
    <div class="daylist" id="dayList"></div>
    <div class="acts">
      <div class="row-btns">
        <button class="btn ghost block" id="dayClose" type="button">关闭</button>
        <button class="btn primary block" id="dayFs" type="button">全屏编辑</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h3 id="dlgTitle">发布本周班表</h3>
    <p class="sub" id="dlgDesc">发布后员工端立刻能看到自己的班表，草稿改动不会外泄。</p>
    <div class="kv" id="dlgKv"></div>
    <div class="field" style="margin-top:16px">
      <label for="dlgNote">发布说明（选填）</label>
      <div class="input-shell">
        <input class="input" id="dlgNote" maxlength="200" placeholder="例如：本周有调休，已和大家确认过">
      </div>
    </div>
    <div class="acts">
      <button class="btn primary block" id="dlgOk" type="button">
        <span class="spin"></span><span class="txt">确认发布</span>
      </button>
      <button class="btn plain block" id="dlgCancel" type="button">取消</button>
    </div>
    <div class="dlg-err" id="dlgErr"></div>
  </div>
</div>

<script src="auth-core.js"></script>
<script src="scheduler.js"></script>
<script src="xlsx-lite.js"></script>
<script>
(function () {
  'use strict';

  var $ = SR.$;
  var session = SR.session.get();
  if (!session || !session.access_token) {
    location.replace('login.html');
    return;
  }

  var TOKEN = session.access_token;
  var ME = {
    username: session.username || '',
    name: session.display_name || session.username || '',
    role: session.role || 'employee'
  };

  if (ME.role !== 'manager' && ME.role !== 'viewer') {
    document.body.innerHTML =
      '<main class="page"><section class="card auth" style="max-width:420px">' +
      '<h2 class="h2">没有访问权限</h2>' +
      '<p class="sub">这个页面只对排班经理开放。员工请到「我的班表」。</p>' +
      '<div class="acts"><a class="btn primary block" href="login.html">返回登录</a></div>' +
      '</section></main>';
    return;
  }

  var DAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  var SLOT_LABEL = { early: '早', mid: '中', night: '晚', rest: '休' };
  var SLOT_CLASS = { '': '', early: 's-early', mid: 's-mid', night: 's-night', rest: 's-rest' };
  var CYCLE = { '': 'early', early: 'mid', mid: 'night', night: 'rest', rest: '' };
  var ROLE_CYCLE = { '': 'open', open: 'close', close: '' };
  var ROLE_LABEL = { open: '开', close: '闭' };
  /* 开店 / 闭店标记：算法会自己算，人工也能改；只显示，不占班次文字 */
  function roleChip(role, slot) {
    if (!slot || slot === 'rest') return '';          /* 休息 / 空格没有开闭店 */
    var r = (role === 'open' || role === 'close') ? role : '';
    /* 在「开店 / 闭店」模式下，没标角色的上班格给个淡占位，告诉经理这里点得动 */
    if (!r && S.mode !== 'role') return '';
    return '<span class="r r-' + (r || 'none') + '">' + (ROLE_LABEL[r] || '开/闭') + '</span>';
  }
  /* 请假 / 必上：格子左上角一个角标，让经理一眼看到「这天有人请假 / 必须上班」 */
  function reqChip(kind) {
    if (kind !== 'leave' && kind !== 'must') return '';
    return '<span class="q q-' + kind + '">' + (kind === 'leave' ? '请' : '必') + '</span>';
  }
  var DOMAINS = [
    ['3c', '3C'], ['hongmeng', '鸿蒙'], ['zunjie', '尊界'],
    ['aftersales', '售后'], ['kufang', '库房'], ['admin', '行政'], ['manager', '管理']
  ];
  var DOMAIN_LABEL = {};
  DOMAINS.forEach(function (d) { DOMAIN_LABEL[d[0]] = d[1]; });

  var S = {
    week: '',
    staff: [],
    grid: {},        /* "姓名|day" -> {slot, role} */
    dirty: {},       /* "姓名|day" -> true */
    timer: null,
    saving: false,
    published: null,
    ack: null,       /* { seen, total, pending: [姓名…] }·这一版员工「已知晓」回执统计 */
    readonly: ME.role !== 'manager',
    domain: '*',
    q: '',
    busy: false,
    mode: 'slot',     /* 点格子的行为：slot = 切班次；role = 标开店/闭店 */
    view: 'sheet',    /* 看法：sheet = 表格；overview = 总览；day = 按天 */
    day: 0,           /* 「按天」视图 / 日期浮窗里选中的那天（0=周一） */
    fs: false,        /* 全屏编辑 */
    reqs: []          /* 本周的请假 / 必上，来自 requests + must_work */
  };

  /* ---------------- 日期 ---------------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseYmd(s) {
    var p = String(s).split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }
  function mondayOf(d) {
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var dow = t.getDay();                 /* 0 = 周日 */
    t.setDate(t.getDate() + (dow === 0 ? -6 : 1 - dow));
    return t;
  }
  function addDays(d, n) {
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    t.setDate(t.getDate() + n);
    return t;
  }
  function rangeText(week) {
    var a = parseYmd(week), b = addDays(a, 6);
    return a.getFullYear() + '/' + pad(a.getMonth() + 1) + '/' + pad(a.getDate()) +
      ' – ' + pad(b.getMonth() + 1) + '/' + pad(b.getDate());
  }

  /* ===== MGRVIEW-BLOCK-START =====
     纯函数（不碰 DOM / 网络），单测直接抽这段到 vm 里跑：
       · mgrDayIdx()  —— 这一周里「今天」是第几天（不在本周就回到周一）
       · miniBtns()   —— 班次快捷按钮（按天视图与日期浮窗共用）
     注意：改动这段必须让 node tools/test_manager_views.mjs 通过。 */
  var MINI_ORDER = [['early', '早'], ['mid', '中'], ['night', '晚'], ['rest', '休'], ['', '清']];

  function mgrDayIdx(weekYmd, now) {
    var p = String(weekYmd || '').split('-').map(Number);
    if (p.length !== 3 || !p[0] || !p[1] || !p[2]) return 0;
    var mon = new Date(p[0], p[1] - 1, p[2]);
    var t = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var d = Math.round((t.getTime() - mon.getTime()) / 86400000);
    return (d >= 0 && d < 7) ? d : 0;
  }

  function miniBtns(cur, disabled) {
    return MINI_ORDER.map(function (x) {
      var on = (cur || '') === x[0];
      return '<button type="button" data-slot="' + x[0] + '" class="' + (x[0] ? 's-' + x[0] : 's-none') +
        (on ? ' on' : '') + '"' + (disabled ? ' disabled' : '') + '>' + x[1] + '</button>';
    }).join('');
  }
  /* ===== MGRVIEW-BLOCK-END ===== */

  /* ===== ROSTEREXPORT-BLOCK-START =====
     导出 Excel 班表的「纯口径」（不碰 DOM / 网络，单测 tools/test_roster_export.mjs）：

       · 导出哪个月：选中那周的**第 4 天（周四）**落在哪个月就是哪个月 ——
         2026-09-28 这一周里有 9/28-9/30 和 10/1-10/4，周四已是 10 月，按 10 月导。
       · 版式：完全照参考表 —— 首列是「含当月 1 号那一周的周一」，往后铺 5 周 × 7 天
         = 35 个日列（E..AM）；不在当月的日子保留样式但整列隐藏。
       · 班次写法：早班 / 中班2 / 晚班2 / 开店 / 闭店 / "/" —— 与参考表
         dataValidation 的词表一致，表里自带的 COUNTIF 统计列才能算得出来。
       · 人员行：按参考表的姓名顺序占位（参考表 7..101 行），对不上号的格子
         整行 hidden="1"，不破坏下面的合并区与公式。 */
  var ROSTER_STORE = '华为智能生活馆（深圳卓悦中心）';
  var ROSTER_DAY_COUNT = 35;               /* 参考表 E..AM = 5 周 × 7 天 */
  var ROSTER_DAY_COL_FIRST = 5;            /* E 列 = 第 5 列 */
  var ROSTER_SLOT_TEXT = { early: '早班', mid: '中班2', night: '晚班2', rest: '/' };

  function rstPad(n) { return (n < 10 ? '0' : '') + n; }
  function rstYmd(d) { return d.getFullYear() + '-' + rstPad(d.getMonth() + 1) + '-' + rstPad(d.getDate()); }
  function rstAdd(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }

  /* Excel 日期序列号（1900 体系，含 1900-02-29 的历史 bug：起点取 1899-12-30） */
  function rostSerial(d) {
    return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(1899, 11, 30)) / 86400000);
  }

  function rostColLetter(n) {
    var s = '';
    while (n > 0) { var m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1 - m) / 26); }
    return s;
  }

  /* week_key（周一）→ 该周所属的月；跨月周按周四所在月算 */
  function rostMonthOfWeek(weekYmd) {
    var p = String(weekYmd || '').split('-').map(Number);
    if (p.length !== 3 || !p[0] || !p[1] || !p[2]) return '';
    var d = new Date(p[0], p[1] - 1, p[2] + 3);
    return d.getFullYear() + '-' + rstPad(d.getMonth() + 1);
  }

  /* ym -> 35 个日列（列号 / 日期 / 序列号 / 是否在当月 / 属于哪一周 / 周内第几天） */
  function rostMonthGrid(ym, dayCount) {
    var n = dayCount || ROSTER_DAY_COUNT;
    var p = String(ym).split('-').map(Number);
    if (p.length !== 2 || !p[0] || !p[1]) return { ym: ym, start: '', weeks: [], cols: [] };
    var first = new Date(p[0], p[1] - 1, 1);
    var dow = first.getDay();
    var start = rstAdd(first, -(dow === 0 ? 6 : dow - 1));
    var cols = [], weeks = [];
    for (var i = 0; i < n; i++) {
      var d = rstAdd(start, i);
      var w = rstYmd(rstAdd(start, Math.floor(i / 7) * 7));
      if (weeks.indexOf(w) < 0) weeks.push(w);
      cols.push({
        col: ROSTER_DAY_COL_FIRST + i,
        letter: rostColLetter(ROSTER_DAY_COL_FIRST + i),
        date: rstYmd(d),
        serial: rostSerial(d),
        inMonth: (d.getFullYear() + '-' + rstPad(d.getMonth() + 1)) === ym,
        weekKey: w,
        dayIdx: i % 7
      });
    }
    return { ym: ym, start: rstYmd(start), weeks: weeks, cols: cols };
  }

  /* 系统里的 slot/role → 参考表的写法 */
  function rostCellText(cell) {
    var slot = (cell && cell.slot) || '';
    if (!slot) return '';
    if (slot === 'rest') return '/';
    if (slot === 'early') return (cell.role === 'open') ? '开店' : ROSTER_SLOT_TEXT.early;
    if (slot === 'mid') return ROSTER_SLOT_TEXT.mid;
    if (slot === 'night') return (cell.role === 'close') ? '闭店' : ROSTER_SLOT_TEXT.night;
    return '';
  }

  /* 员工 → 参考表行号：先按姓名各就各位，剩下的人从空行里补；
     对不上的参考行留空（导出时该行 hidden="1"）。 */
  function rostRowPlan(names, refNames, firstRow) {
    var used = {}, pending = [], i;
    var byName = {};
    for (i = 0; i < refNames.length; i++) byName[String(refNames[i])] = firstRow + i;
    for (i = 0; i < names.length; i++) {
      var r = byName[String(names[i])];
      if (r && !used[r]) used[r] = names[i];
      else pending.push(names[i]);
    }
    var free = [];
    for (i = 0; i < refNames.length; i++) if (!used[firstRow + i]) free.push(firstRow + i);
    var overflow = [];
    for (i = 0; i < pending.length; i++) {
      if (free.length) used[free.shift()] = pending[i];
      else overflow.push(pending[i]);
    }
    var rows = [];
    for (i = 0; i < refNames.length; i++) rows.push({ row: firstRow + i, name: used[firstRow + i] || '' });
    return { rows: rows, overflow: overflow };
  }

  /* 人数统计区（参考表 102..107 行）：早班 / 中班2 / 晚班 / 出勤 / 休息 / 全员出勤 */
  function rostStats(o) {
    var out = {};
    for (var i = 0; i < o.cols.length; i++) {
      var col = o.cols[i].letter, early = 0, mid = 0, night = 0, rest = 0, all = 0, r, t;
      for (r = o.frontFirst; r <= o.frontLast; r++) {
        t = o.cellOf(r, col);
        if (!t) continue;
        if (t === '早班' || t === '早班2' || t === '开店') early++;
        else if (t === '中班1' || t === '中班2') mid++;
        else if (t === '晚班1' || t === '晚班2' || t === '闭店' || t === '3-12') night++;
        else if (t === '/' || t === '年假' || t === '休假' || t === '事假') rest++;
      }
      for (r = o.firstRow; r <= o.lastRow; r++) {
        t = o.cellOf(r, col);
        if (t && t !== '/' && t !== '请假' && t !== '调休') all++;
      }
      out[col + '102'] = early;
      out[col + '103'] = mid;
      out[col + '104'] = night;
      out[col + '105'] = early + mid + night;
      out[col + '106'] = rest;
      out[col + '107'] = all;
    }
    return out;
  }

  /* 35 个 <col>：宽度/样式照参考表，不在当月的日子 hidden="1" */
  function rostDayCols(cols, defs) {
    var out = [];
    for (var i = 0; i < cols.length; i++) {
      var d = (defs && defs[i]) || {};
      out.push('<col min="' + cols[i].col + '" max="' + cols[i].col + '" width="' + (d.width || 12.625) + '"' +
        (d.style ? ' style="' + d.style + '"' : '') + (cols[i].inMonth ? '' : ' hidden="1"') + ' customWidth="1"/>');
    }
    return out.join('');
  }

  /* 名册 + 班次 → xlsx-lite 需要的 ctx（纯函数；导出与单测共用这一条装配路径） */
  function rostCtx(o) {
    var ym = String(o.ym || '');
    var meta = o.meta;
    var staff = o.staff || [];
    var cells = o.cells || {};                 /* "姓名|weekKey|day" → {slot, role} */
    var grid = rostMonthGrid(ym);
    var plan = rostRowPlan(staff.map(function (p) { return p.name; }), meta.refNames, meta.personFirst);
    var byName = {};
    staff.forEach(function (p) { byName[p.name] = p; });

    var text = {}, num = {}, hidden = [], shown = 0;
    var mon = Number(ym.slice(5, 7));

    /* 标题：参考表 B1 里原本就带「换行 + 空格」，照抄，视觉才一致 */
    text.B1 = ROSTER_STORE + mon + '月排班表\n ';

    /* 每个日列：日期序列号 + 该列所有人员行的班次 */
    grid.cols.forEach(function (c) { num[c.letter + '3'] = c.serial; });

    for (var i = 0; i < plan.rows.length; i++) {
      var item = plan.rows[i], r = item.row;
      if (!item.name) { hidden.push(r); continue; }
      shown++;
      var p = byName[item.name] || {};
      num['A' + r] = shown;                       /* 序号：只数真正有人的行，不跳号 */
      text['B' + r] = p.position || p.module || '';
      text['C' + r] = '';                         /* 工号：库里没有这一列，留空 */
      text['D' + r] = item.name;
      for (var k = 0; k < grid.cols.length; k++) {
        var gc = grid.cols[k];
        text[gc.letter + r] = rostCellText(cells[item.name + '|' + gc.weekKey + '|' + gc.dayIdx]);
      }
    }

    /* 人数统计区：参考表 102..107 行，按「前场体验顾问」的行区间算 */
    var stats = rostStats({
      cols: grid.cols,
      firstRow: meta.personFirst,
      lastRow: meta.personLast,
      frontFirst: meta.stats.frontFirst,
      frontLast: meta.stats.frontLast,
      cellOf: function (row, col) { return text[col + row] || ''; }
    });
    Object.keys(stats).forEach(function (k) { num[k] = stats[k]; });

    return {
      ym: ym,
      mon: mon,
      grid: grid,
      text: text,
      num: num,
      hiddenRows: hidden,
      shown: shown,
      overflow: plan.overflow,
      sheet: mon + '月班表',
      title: ROSTER_STORE + mon + '月排班表',
      monthText: (ym === meta.ym) ? meta.monthText : {},
      dayCols: rostDayCols(grid.cols, meta.dayCols),
      file: ROSTER_STORE.replace(/（/g, '(').replace(/）/g, ')') + '-' + ym + '月班表.xlsx'
    };
  }
  /* ===== ROSTEREXPORT-BLOCK-END ===== */

  /* ---------------- 导出 Excel（版式复用参考文件模板） ----------------
     数据：本月 5 个 week_key 的 shifts + 在职员工名册；模板：_deploy/tpl/。
     模板只取一次（fetch 后缓存），之后每次导出都是本地拼装，不再走网络。 */
  var ROSTER_TPL = null;

  function loadRosterTpl() {
    if (ROSTER_TPL) return Promise.resolve(ROSTER_TPL);
    var names = ['sheet', 'styles', 'theme', 'workbook', 'workbook-rels', 'rels', 'content-types', 'app', 'core'];
    var jobs = names.map(function (n) {
      return fetch('tpl/' + n + '.xml', { cache: 'force-cache' }).then(function (r) {
        if (!r.ok) throw new Error('模板 tpl/' + n + '.xml 读不到（HTTP ' + r.status + '）');
        return r.text();
      });
    });
    jobs.push(fetch('tpl/meta.json', { cache: 'force-cache' }).then(function (r) {
      if (!r.ok) throw new Error('模板 tpl/meta.json 读不到（HTTP ' + r.status + '）');
      return r.json();
    }));
    return Promise.all(jobs).then(function (out) {
      var tpl = {};
      for (var i = 0; i < names.length; i++) tpl[names[i]] = out[i];
      tpl.meta = out[names.length];
      ROSTER_TPL = tpl;
      return tpl;
    });
  }

  function rosterBtnLabel() {
    var ym = rostMonthOfWeek(S.week);
    return '导出 Excel' + (ym ? '（' + Number(ym.slice(5, 7)) + '月）' : '');
  }

  function exportRoster() {
    if (!S.week) { SR.ui.toast('先等本周班表载入', 'bad'); return; }
    var ym = rostMonthOfWeek(S.week);
    var grid = rostMonthGrid(ym);
    var btn = $('#xlsxBtn');
    btn.disabled = true;
    setSave('正在生成 Excel…', '');

    Promise.all([
      loadRosterTpl(),
      SR.db.select('shifts', 'week_key=in.(' + grid.weeks.join(',') + ')&select=staff_name,day,slot,role')
    ]).then(function (res) {
      var tpl = res[0], sh = res[1], meta = tpl.meta;
      if (sh.http === 401) { reauth(); return; }
      if (!sh.ok) throw new Error(sh.error || '班次读取失败');

      /* "姓名|weekKey|day" → 格子 */
      var cells = {};
      (sh.data || []).forEach(function (row) {
        cells[row.staff_name + '|' + row.week_key + '|' + row.day] = { slot: row.slot || '', role: row.role || null };
      });
      var hasAny = {};
      (sh.data || []).forEach(function (row) { if (row.slot) hasAny[row.week_key] = 1; });

      var ctx = rostCtx({ ym: ym, meta: meta, staff: S.staff, cells: cells });
      XLSXLITE.save(XLSXLITE.build(tpl, ctx), ctx.file);

      setSave('Excel 已导出', 'ok');
      var blank = grid.weeks.filter(function (w) { return !hasAny[w]; });
      var inMonth = grid.cols.filter(function (c) { return c.inMonth; }).length;
      SR.ui.toast('已导出 ' + ctx.mon + ' 月班表：' + ctx.shown + ' 人 × ' + inMonth + ' 天' +
        (blank.length ? '（' + blank.length + ' 周还没排班，对应日期为空）' : ''), 'good');
      if (ctx.overflow.length) {
        SR.ui.toast('参考表只有 ' + meta.personCount + ' 个人员行，这 ' +
          ctx.overflow.length + ' 人没排进去：' + ctx.overflow.join('、'), 'bad');
      }
    }).catch(function (e) {
      setSave('导出失败', 'bad');
      var msg = String(e && e.message ? e.message : e);
      SR.ui.toast('导出失败：' + msg, 'bad');
      if (/tpl\/|模板/.test(msg)) {
        SR.ui.toast('先在本机跑一次 node tools/build_roster_tpl.mjs 生成 _deploy/tpl/ 再部署', 'bad');
      }
    }).then(function () {
      btn.disabled = false;
    });
  }


  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function reauth() {
    SR.session.clear();
    SR.ui.toast('登录状态已失效，正在返回登录页…', 'bad');
    setTimeout(function () { location.replace('login.html'); }, 900);
  }

  function setSave(text, kind) {
    var el = $('#saveState');
    el.textContent = text;
    el.className = 'save-state' + (kind ? ' ' + kind : '');
  }

  /* ---------------- 载入 ---------------- */
  function load(week) {
    S.week = week;
    S.day = mgrDayIdx(week, new Date());   /* 换周后「按天」默认落在今天；不在本周就回周一 */
    S.grid = {};
    S.dirty = {};
    setSave('载入中…', '');
    $('#range').textContent = rangeText(week);
    $('#xlsxBtn').textContent = rosterBtnLabel();   /* 导出按钮上直接标明「几月」 */
    var sk = '<div class="skeleton">正在载入 ' + esc(rangeText(week)) + ' 的班表…</div>';
    $('#sheetWrap').innerHTML = sk;
    $('#overviewWrap').innerHTML = sk;
    $('#dayWrap').innerHTML = sk;

    return Promise.all([
      SR.db.select('weeks', 'week_key=eq.' + week + '&select=week_key,status'),
      SR.db.select('staff', 'select=name,domain,module,position,level&active=is.true&order=domain.asc,name.asc'),
      SR.db.select('shifts', 'week_key=eq.' + week + '&select=staff_name,day,slot,role,manual'),
      SR.db.select('publish_versions', 'week_key=eq.' + week + '&select=publish_id,version,published_at&order=version.desc&limit=1')
    ]).then(function (r) {
      var wk = r[0], st = r[1], sh = r[2], pv = r[3];
      if (wk.http === 401 || st.http === 401) { reauth(); return; }

      if (!st.ok) { fail(st.error || '员工名单读取失败'); return; }
      S.staff = st.data || [];

      /* 周记录不存在就建一条：ignore-duplicates，避免把已发布的周改回草稿 */
      if (wk.ok && (!wk.data || !wk.data.length)) {
        SR.db.insert('weeks', { week_key: week, status: 'draft' }, 'resolution=ignore-duplicates');
      }

      if (sh.ok && sh.data) {
        sh.data.forEach(function (row) {
          S.grid[row.staff_name + '|' + row.day] = {
            slot: row.slot || '', role: row.role || null, manual: !!row.manual
          };
        });
      }

      S.published = (pv.ok && pv.data && pv.data[0]) ? pv.data[0] : null;
      setSave('草稿已同步', 'ok');
      renderAll();
      loadAck();
      loadReqs();          /* 请假 / 必上：单独兜底，读不到（表未建）也不影响班表 */
    }).catch(function (e) {
      fail(String(e && e.message ? e.message : e));
    });
  }

  function fail(msg) {
    setSave('载入失败', 'bad');
    var box = '<div class="empty"><b>班表没载入成功</b>' + esc(msg) +
      '<div class="acts" style="max-width:200px;margin:16px auto 0">' +
      '<button class="btn ghost block" type="button" onclick="location.reload()">重新加载</button></div></div>';
    /* 三种看法都要看到这条，否则你在「按天」里会以为页面卡住了 */
    $('#sheetWrap').innerHTML = box;
    $('#overviewWrap').innerHTML = box;
    $('#dayWrap').innerHTML = box;
  }

  /* ---------------- 渲染 ---------------- */
  function visibleStaff() {
    var q = S.q.trim().toLowerCase();
    return S.staff.filter(function (p) {
      if (S.domain !== '*' && p.domain !== S.domain) return false;
      if (!q) return true;
      return (p.name + ' ' + (p.position || '') + ' ' + (p.module || '') + ' ' + (p.level || ''))
        .toLowerCase().indexOf(q) >= 0;
    });
  }

  function renderDomSeg() {
    var counts = {};
    S.staff.forEach(function (p) { counts[p.domain] = (counts[p.domain] || 0) + 1; });
    var h = '<button type="button" data-dom="*"' + (S.domain === '*' ? ' class="on"' : '') + '>全部 ' +
      S.staff.length + '</button>';
    DOMAINS.forEach(function (d) {
      if (!counts[d[0]]) return;
      h += '<button type="button" data-dom="' + d[0] + '"' + (S.domain === d[0] ? ' class="on"' : '') + '>' +
        d[1] + ' ' + counts[d[0]] + '</button>';
    });
    $('#domSeg').innerHTML = h;
  }

  function renderAll() {
    renderReqNames();
    renderDomSeg();
    renderView();
    renderReqList();
  }

  /* 三种看法共用一份数据（S.grid），同一时刻只画一块 */
  function renderView() {
    if (!S.week) return;   /* 还没定周（首屏）先别画，免得算出 NaN 日期 */
    var btns = document.querySelectorAll('#viewSeg button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].className = btns[i].getAttribute('data-view') === S.view ? 'on' : '';
    }
    $('#sheetWrap').hidden = S.view !== 'sheet';
    $('#overviewWrap').hidden = S.view !== 'overview';
    $('#dayWrap').hidden = S.view !== 'day';
    $('#fsBtn').hidden = S.view === 'day';   /* 按天本来就是一屏，不需要全屏 */
    if (S.view === 'overview') renderOverview();
    else if (S.view === 'day') renderDay();
    else renderSheet();
    updateCounts();
  }

  function renderSheet() {
    var list = visibleStaff();
    if (!list.length) {
      $('#sheetWrap').innerHTML = '<div class="empty"><b>没有匹配的员工</b>换个筛选或搜索词试试</div>';
      updateCounts();
      return;
    }

    var rmap = reqMap();
    var h = '<table class="grid"><thead><tr><th class="who">员工 <small>共 ' + list.length + ' 人</small></th>';
    for (var i = 0; i < 7; i++) {
      var d = addDays(parseYmd(S.week), i);
      h += '<th class="' + (i >= 5 ? 'we' : '') + '" data-dayhead="' + i + '" title="点这里看这一天所有人">' + DAYS[i] +
        '<span class="d">' + (d.getMonth() + 1) + '/' + d.getDate() + '</span></th>';
    }
    h += '</tr></thead><tbody>';

    list.forEach(function (p) {
      var si = S.staff.indexOf(p);
      var meta = DOMAIN_LABEL[p.domain] || p.domain || '';
      if (p.position) meta += ' · ' + p.position;
      if (p.level === '经理') meta += ' · 不排班';
      h += '<tr><td class="who"><b>' + esc(p.name) + '</b><small>' + esc(meta) + '</small></td>';
      for (var day = 0; day < 7; day++) {
        var k = p.name + '|' + day;
        var cell = S.grid[k] || {};
        var slot = cell.slot || '';
        var role = cell.role || '';
        var mgr = p.level === '经理';     /* 经理不参与排班，格子恒为空且不可点 */
        var qk = rmap[k] || '';
        h += '<td class="celltd"><button class="cell ' + SLOT_CLASS[slot] +
          (S.dirty[k] ? ' dirty' : '') + '" type="button" data-si="' + si + '" data-day="' + day +
          '" data-s="' + slot + '"' + ((S.readonly || mgr) ? ' disabled' : '') +
          ' title="' + esc(p.name + ' · ' + DAYS[day] + (mgr ? '（经理不排班）' : '') +
            (qk === 'leave' ? '（已录请假）' : qk === 'must' ? '（已录必上）' : '')) + '">' +
          (SLOT_LABEL[slot] || '—') + roleChip(role, slot) + reqChip(qk) + '</button></td>';
      }
      h += '</tr>';
    });

    h += '</tbody><tfoot><tr><td class="who">每日人数</td>';
    for (var k2 = 0; k2 < 7; k2++) h += '<td data-sum="' + k2 + '">0</td>';
    h += '</tr></tfoot></table>';

    $('#sheetWrap').innerHTML = h;
    updateCounts();
  }

  function countDay(day) {
    var n = 0;
    visibleStaff().forEach(function (p) {
      var c = S.grid[p.name + '|' + day];
      if (c && c.slot && c.slot !== 'rest') n++;
    });
    return n;
  }

  function updateCounts() {
    var sums = document.querySelectorAll('#sheetWrap td[data-sum]');
    for (var i = 0; i < sums.length; i++) sums[i].textContent = countDay(Number(sums[i].getAttribute('data-sum')));

    var list = visibleStaff(), cells = 0, working = 0, perStaff = 0;
    list.forEach(function (p) {
      var n = 0;
      for (var d = 0; d < 7; d++) {
        var c = S.grid[p.name + '|' + d];
        if (c && c.slot) { cells++; if (c.slot !== 'rest') { working++; n++; } }
      }
      if (n) perStaff++;
    });

    $('#stats').innerHTML =
      stat(cells, '已排格子') +
      stat(perStaff, '本周有人上班') +
      stat(working, '上班人次') +
      stat(cells ? (working / 7).toFixed(1) : '0', '日均上班人数');

    pubBadge();
  }

  function stat(n, k) {
    return '<div class="stat"><div class="n">' + n + '</div><div class="k">' + k + '</div></div>';
  }

  /* ---------------- 总览：一眼看完全店 ----------------
     「表格」适合细改，「总览」适合先看全貌：按部门分组、一人一行、7 个色块，
     点色块或点表头都能展开到「当天所有人」。 */
  function renderOverview() {
    var list = visibleStaff();
    if (!list.length) {
      $('#overviewWrap').innerHTML = '<div class="empty"><b>没有匹配的员工</b>换个筛选或搜索词试试</div>';
      return;
    }
    var rmap = reqMap();
    var byDom = {}, order = [];
    list.forEach(function (p) {
      var k = p.domain || '未分组';
      if (!byDom[k]) { byDom[k] = []; order.push(k); }
      byDom[k].push(p);
    });

    var h = '<div class="ovwrap"><table class="ov"><thead><tr><th class="who2">员工 ' +
      '<small style="font-weight:400;color:var(--text-3)">共 ' + list.length + ' 人</small></th>';
    for (var i = 0; i < 7; i++) {
      var d = addDays(parseYmd(S.week), i);
      h += '<th class="' + (i >= 5 ? 'we' : '') + '" data-dayhead="' + i + '" title="点这里看这一天所有人">' +
        DAYS[i] + '<span class="d">' + (d.getMonth() + 1) + '/' + d.getDate() + '</span></th>';
    }
    h += '</tr></thead><tbody>';

    order.forEach(function (dom) {
      h += '<tr class="grp"><td colspan="8">' + esc(DOMAIN_LABEL[dom] || dom) +
        ' · ' + byDom[dom].length + ' 人</td></tr>';
      byDom[dom].forEach(function (p) {
        var mgr = p.level === '经理';
        h += '<tr><td class="who2">' + esc(p.name) +
          (mgr ? ' <span class="badge">不排班</span>' : '') + '</td>';
        for (var day = 0; day < 7; day++) {
          var c = S.grid[p.name + '|' + day] || {};
          var slot = c.slot || '';
          var qk = rmap[p.name + '|' + day] || '';
          var tag = qk === 'leave' ? '请' : qk === 'must' ? '必' : '';
          h += '<td data-ov="' + esc(p.name) + '|' + day + '">' +
            '<span class="ob ' + SLOT_CLASS[slot] + '">' + (SLOT_LABEL[slot] || '·') + tag + '</span></td>';
        }
        h += '</tr>';
      });
    });

    h += '</tbody></table></div>' +
      '<p class="hint">点任意色块 / 表头 →「当天所有人」浮窗，在里面直接改班次；要一格一格细改就切回「表格」。</p>';
    $('#overviewWrap').innerHTML = h;
  }

  /* ---------------- 按天：一天一屏（手机上默认） ----------------
     替代原来的左右横滑：先选天，再看这一天所有人的班次，直接在行尾改。 */
  function renderDay() {
    var list = visibleStaff();
    var rmap = reqMap();
    if (!(S.day >= 0 && S.day <= 6)) S.day = 0;

    var h = '<div class="daytabs">';
    for (var i = 0; i < 7; i++) {
      var d = addDays(parseYmd(S.week), i);
      h += '<button type="button" data-daytab="' + i + '" class="' + (i >= 5 ? 'we' : '') +
        (i === S.day ? ' on' : '') + '">' + DAYS[i] +
        '<b>' + (d.getMonth() + 1) + '/' + d.getDate() + '</b></button>';
    }
    h += '</div>';

    if (!list.length) {
      $('#dayWrap').innerHTML = h + '<div class="empty"><b>没有匹配的员工</b>换个筛选或搜索词试试</div>';
      return;
    }

    h += '<div class="daycards">';
    list.forEach(function (p) {
      var c = S.grid[p.name + '|' + S.day] || {};
      var slot = c.slot || '';
      var qk = rmap[p.name + '|' + S.day] || '';
      var mgr = p.level === '经理';
      var meta = DOMAIN_LABEL[p.domain] || p.domain || '';
      if (p.position) meta += ' · ' + p.position;
      if (mgr) meta += ' · 不排班';
      h += '<div class="dcard"><div class="nm">' + esc(p.name) + '<small>' + esc(meta) + '</small></div>' +
        (qk ? '<span class="badge ' + (qk === 'leave' ? 'bad' : 'info') + '">' +
          (qk === 'leave' ? '请假' : '必上') + '</span>' : '') +
        (c.role ? '<span class="role-tag">' + ROLE_LABEL[c.role] + '</span>' : '') +
        '<div class="mini" data-mini="' + esc(p.name) + '">' +
        miniBtns(slot, S.readonly || mgr) + '</div></div>';
    });
    h += '</div><p class="hint">「按天」适合手机：不用左右横滑；要并排看一周就切「表格」，要先看全貌就切「总览」。</p>';
    $('#dayWrap').innerHTML = h;
  }

  /* ---------------- 日期浮窗：当天所有人 ----------------
     点表头 / 总览里的格子都能唤起；在浮窗里改班次会立刻落草稿（和表格同一套逻辑）。 */
  function openDay(day) {
    if (!(day >= 0 && day <= 6)) day = 0;
    S.day = day;
    var d = addDays(parseYmd(S.week), day);
    var list = visibleStaff();
    var rmap = reqMap();

    var work = 0;
    list.forEach(function (p) {
      var c = S.grid[p.name + '|' + day];
      if (c && c.slot && c.slot !== 'rest') work++;
    });

    $('#dayTitle').textContent = DAYS[day] + ' · ' + (d.getMonth() + 1) + '/' + d.getDate();
    $('#dayDesc').textContent = '上班 ' + work + ' 人 / 共 ' + list.length +
      ' 人 · 点右侧按钮直接改班次，改完立刻存草稿';

    var h = '';
    list.forEach(function (p) {
      var c = S.grid[p.name + '|' + day] || {};
      var slot = c.slot || '';
      var qk = rmap[p.name + '|' + day] || '';
      var mgr = p.level === '经理';
      var meta = DOMAIN_LABEL[p.domain] || p.domain || '';
      if (p.position) meta += ' · ' + p.position;
      if (mgr) meta += ' · 不排班';
      h += '<div class="drow"><div class="nm">' + esc(p.name) + '<small>' + esc(meta) + '</small></div>' +
        (qk ? '<span class="badge ' + (qk === 'leave' ? 'bad' : 'info') + '">' +
          (qk === 'leave' ? '请假' : '必上') + '</span>' : '') +
        (c.role ? '<span class="role-tag">' + ROLE_LABEL[c.role] + '</span>' : '') +
        '<div class="mini" data-mini="' + esc(p.name) + '">' +
        miniBtns(slot, S.readonly || mgr) + '</div></div>';
    });

    $('#dayList').innerHTML = h || '<div class="empty"><b>没有匹配的员工</b>换个筛选或搜索词试试</div>';
    $('#dayOv').classList.add('show');
  }

  /* 浮窗开着的时候改了班次：重画内容但保留滚动位置 */
  function refreshDayDialog() {
    var ov = $('#dayOv');
    if (!ov.classList.contains('show')) return;
    var sc = $('#dayList').scrollTop;
    openDay(S.day);
    $('#dayList').scrollTop = sc;
  }

  function closeDay() { $('#dayOv').classList.remove('show'); }

  function setFs(on) {
    S.fs = !!on;
    $('#viewBox').classList.toggle('fs', S.fs);
    document.body.classList.toggle('fs-open', S.fs);
    $('#fsBtn').textContent = S.fs ? '退出全屏' : '全屏编辑';
  }

  /* ---------------- 已知晓回执 ---------------- */
  /* 只统计「这一版」：publish 时为每个排了班的员工建一条 inapp 投递，
     员工在「我的班表」点确认后，Edge Function ack 把那条的 status 改成 seen。 */
  function loadAck() {
    var pid = S.published && S.published.publish_id;
    S.ack = null;
    if (!pid) { pubBadge(); return; }
    pubBadge();

    SR.db.select('publish_deliveries',
      'publish_id=eq.' + encodeURIComponent(pid) + '&select=staff_name,status')
      .then(function (r) {
        /* 期间切了周：丢掉过期结果 */
        if (!S.published || S.published.publish_id !== pid) return;
        if (!r.ok || !r.data) { S.ack = null; pubBadge(); return; }
        var seen = 0, pending = [];
        r.data.forEach(function (d) {
          if (d.status === 'seen') seen++;
          else pending.push(d.staff_name);
        });
        S.ack = { seen: seen, total: r.data.length, pending: pending };
        pubBadge();
      })
      .catch(function () {
        if (!S.published || S.published.publish_id !== pid) return;
        S.ack = null;
        pubBadge();
      });
  }

  function pubBadge() {
    var b = $('#pubBadge');
    b.hidden = false;
    b.title = '';
    if (S.published) {
      var dirty = Object.keys(S.dirty).length > 0;
      b.className = 'badge ' + (dirty ? 'warn' : 'ok');
      var txt = (dirty ? '有未发布改动 · ' : '已发布 ') + 'v' + S.published.version;
      if (S.ack && S.ack.total) {
        txt += ' · 已知晓 ' + S.ack.seen + '/' + S.ack.total;
        b.title = S.ack.pending.length
          ? '还没确认：' + S.ack.pending.join('、')
          : '全员已确认';
      }
      b.textContent = txt;
    } else {
      b.className = 'badge info';
      b.textContent = '尚未发布';
    }
    var hasAny = Object.keys(S.grid).some(function (k) { return !!S.grid[k].slot; });
    var btn = $('#publishBtn');
    btn.disabled = S.readonly || S.saving || !hasAny;
    btn.title = S.readonly ? '只读账号不能发布' : (!hasAny ? '这一周还没排班' : '');
  }

  /* ---------------- 编辑 ----------------
     一个格子承载两件事：班次（早/中/晚/休）与角色（开店/闭店）。
     两种都用「点」来改，靠上面的模式切换分辨；切模式后重画一次表格，
     让「开店 / 闭店」模式下所有上班格都露出淡占位（可点的位置看得见）。 */
  $('#modeSeg').addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('button[data-mode]') : null;
    if (!b) return;
    S.mode = b.getAttribute('data-mode') === 'role' ? 'role' : 'slot';
    var all = $('#modeSeg').querySelectorAll('button');
    for (var i = 0; i < all.length; i++) all[i].className = all[i] === b ? 'on' : '';
    $('#modeHint').textContent = S.mode === 'role'
      ? '点上班格循环：不标 → 开店 → 闭店 → 不标（休息格不能标）'
      : '点格子切换：早 → 中 → 晚 → 休 → 清空（切班次会清掉开/闭）';
    renderView();
    SR.ui.toast(S.mode === 'role' ? '现在点格子改的是「开店 / 闭店」' : '现在点格子改的是「班次」', 'good');
  });

  $('#sheetWrap').addEventListener('click', function (e) {
    var hd = e.target && e.target.closest ? e.target.closest('[data-dayhead]') : null;
    if (hd) { openDay(Number(hd.getAttribute('data-dayhead'))); return; }
    var btn = e.target && e.target.closest ? e.target.closest('.cell') : null;
    if (!btn || btn.disabled || S.readonly) return;
    var si = Number(btn.getAttribute('data-si'));
    var day = Number(btn.getAttribute('data-day'));
    var p = S.staff[si];
    if (!p) return;
    var k = p.name + '|' + day;
    var cur = S.grid[k] || { slot: '', role: null };

    if (S.mode === 'role') {
      if (!cur.slot || cur.slot === 'rest') {
        SR.ui.toast('先给这天排上班次，才能标开店 / 闭店', 'bad');
        return;
      }
      var next = ROLE_CYCLE[cur.role || ''] || '';
      setSlot(k, cur.slot, btn, day, next);
      SR.ui.toast(p.name + ' · ' + DAYS[day] + ' → ' +
        (next === 'open' ? '开店' : next === 'close' ? '闭店' : '不标开/闭'), 'good');
      return;
    }
    /* 切班次时顺手清掉角色：换成休息 / 清空还挂着「开店」是自相矛盾的 */
    setSlot(k, CYCLE[cur.slot] || '', btn, day, '');
  });

  /* ---------------- 看法切换 / 全屏 / 日期浮窗 ----------------
     三种看法共用一份数据，切换只影响「怎么画」，不改任何草稿；
     全屏用 CSS 固定铺满（不用 Fullscreen API），iPhone 上同样可用。 */
  $('#viewSeg').addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('button[data-view]') : null;
    if (!b) return;
    S.view = b.getAttribute('data-view') || 'sheet';
    if (S.view === 'day') S.day = dayIdxOfWeek();
    try { localStorage.setItem('sr.mgrView', S.view); } catch (err) {}
    renderView();
    SR.ui.toast(S.view === 'overview' ? '总览：一屏看完谁上班' :
      S.view === 'day' ? '按天：一天一屏，手机上不用左右滑' : '表格：一格一格细改', 'good');
  });

  $('#fsBtn').addEventListener('click', function () { setFs(!S.fs); });
  $('#xlsxBtn').addEventListener('click', exportRoster);
  $('#fsExit').addEventListener('click', function () { setFs(false); });

  $('#overviewWrap').addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('[data-dayhead]') : null;
    if (t) { openDay(Number(t.getAttribute('data-dayhead'))); return; }
    var c = e.target && e.target.closest ? e.target.closest('[data-ov]') : null;
    if (!c) return;
    openDay(Number(String(c.getAttribute('data-ov')).split('|')[1]));
  });

  $('#dayWrap').addEventListener('click', function (e) {
    var tab = e.target && e.target.closest ? e.target.closest('[data-daytab]') : null;
    if (tab) {
      S.day = Number(tab.getAttribute('data-daytab'));
      renderDay();
      return;
    }
    var b = e.target && e.target.closest ? e.target.closest('.mini button[data-slot]') : null;
    if (!b || b.disabled || S.readonly) return;
    var name = b.parentNode.getAttribute('data-mini');
    if (name) setSlot(name + '|' + S.day, b.getAttribute('data-slot'), null, S.day, '');
  });

  $('#dayList').addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('.mini button[data-slot]') : null;
    if (!b || b.disabled || S.readonly) return;
    var name = b.parentNode.getAttribute('data-mini');
    if (name) setSlot(name + '|' + S.day, b.getAttribute('data-slot'), null, S.day, '');
  });

  $('#dayClose').addEventListener('click', closeDay);
  $('#dayOv').addEventListener('click', function (e) { if (e.target === $('#dayOv')) closeDay(); });
  $('#dayFs').addEventListener('click', function () {
    closeDay();
    S.view = 'sheet';
    try { localStorage.setItem('sr.mgrView', 'sheet'); } catch (err) {}
    renderView();
    setFs(true);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if ($('#dayOv').classList.contains('show')) { closeDay(); return; }
    if (S.fs) setFs(false);
  });

  function setSlot(k, slot, btn, day, role) {
    if (!S.grid[k]) S.grid[k] = { slot: '', role: null, manual: false };
    S.grid[k].slot = slot;
    S.grid[k].role = (slot && slot !== 'rest') ? (role || null) : null;
    S.grid[k].manual = true;      /* 人工点过的格子 → shifts.manual（「轻触」契约落库） */
    S.dirty[k] = true;

    if (btn) {
      btn.className = 'cell ' + SLOT_CLASS[slot] + ' dirty';
      btn.setAttribute('data-s', slot);
      btn.innerHTML = (SLOT_LABEL[slot] || '—') + roleChip(S.grid[k].role, slot) +
        reqChip(reqMap()[k] || '');
    } else {
      /* 从「按天」或日期浮窗里改的：没有格子按钮可改，重画当前这块 */
      renderView();
      refreshDayDialog();
    }
    updateCounts();
    schedule();
  }

  function schedule() {
    clearTimeout(S.timer);
    setSave('保存中…', '');
    S.timer = setTimeout(flush, 700);
  }

  /* 把脏格子写回云端：有班次 → upsert；清空 → 删除该行 */
  function flush() {
    clearTimeout(S.timer);
    var keys = Object.keys(S.dirty);
    if (!keys.length) return Promise.resolve(true);
    if (S.readonly) return Promise.resolve(false);

    var up = [], del = [];
    keys.forEach(function (k) {
      var parts = k.split('|');
      var cell = S.grid[k] || {};
      var slot = cell.slot || '';
      if (slot) {
        up.push({
          week_key: S.week,
          staff_name: parts[0],
          day: Number(parts[1]),
          slot: slot,
          role: cell.role || null,
          /* 生成写回的格子是算法产出的，不该继承上一版的「手动」标记 */
          manual: !!cell.manual
        });
      } else {
        del.push(parts);
      }
    });

    var jobs = [];
    if (up.length) jobs.push(SR.db.upsert('shifts', up, 'week_key,staff_name,day'));
    del.forEach(function (parts) {
      jobs.push(SR.db.del('shifts', 'week_key=eq.' + S.week +
        '&staff_name=eq.' + encodeURIComponent(parts[0]) + '&day=eq.' + Number(parts[1])));
    });

    S.saving = true;
    pubBadge();

    return Promise.all(jobs).then(function (res) {
      S.saving = false;
      var bad = res.filter(function (r) { return !r.ok; });
      if (bad.length) {
        if (bad[0].http === 401) { reauth(); return false; }
        setSave('保存失败', 'bad');
        SR.ui.toast('保存失败：' + (bad[0].error || '网络异常'), 'bad');
        pubBadge();
        return false;
      }
      keys.forEach(function (k) { if (S.dirty[k] && S.grid[k]) delete S.dirty[k]; });
      setSave('草稿已同步', 'ok');
      document.querySelectorAll('#sheetWrap .cell').forEach(function (el) {
        var si = Number(el.getAttribute('data-si'));
        var day = Number(el.getAttribute('data-day'));
        var p = S.staff[si];
        if (p) el.classList.toggle('dirty', !!S.dirty[p.name + '|' + day]);
      });
      pubBadge();
      return true;
    });
  }

  /* ---------------- 请假 / 必上录入 ----------------
     落两张表，与「生成本周」读取的位置一致：
       · 请假 → requests（week_key=本周，day 为空 = 整周请假，status=approved 直接生效）
       · 必上 → must_work（day 必填：引擎没有「哪天都行」这种约束）
     录入不自动重排：生成是整周覆盖，什么时候排由经理自己点。 */
  var REQ_KIND = { leave: '请假', must: '必上', swap: '调班' };
  var REQ_DAY = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

  function renderReqNames() {
    var sel = $('#reqName');
    if (!sel) return;
    var keep = sel.value;
    var h = '';
    S.staff.forEach(function (p) {
      var d = DOMAIN_LABEL[p.domain] || p.domain || '';
      h += '<option value="' + esc(p.name) + '">' + esc(p.name + (d ? ' · ' + d : '') +
        (p.level === '经理' ? '（不排班）' : '')) + '</option>';
    });
    sel.innerHTML = h || '<option value="">（名单是空的）</option>';
    if (keep && h) { sel.value = keep; if (!sel.value) sel.selectedIndex = 0; }
  }

  /* 请假 / 必上 → 「姓名|day」的角标表；整周请假按引擎语义展开成 7 天 */
  function reqMap() {
    var m = {};
    S.reqs.forEach(function (x) {
      var kind = x.kind === 'must' ? 'must' : 'leave';
      if (x.day == null) {
        if (kind !== 'leave') return;
        for (var d = 0; d < 7; d++) m[x.name + '|' + d] = 'leave';
        return;
      }
      var k = x.name + '|' + Number(x.day);
      /* 同一天既请又必上属于冲突：请假优先显示，让人一眼看到要处理 */
      if (m[k] !== 'leave') m[k] = kind;
    });
    return m;
  }

  function loadReqs() {
    var wk = S.week;
    return Promise.all([
      SR.db.select('requests', 'week_key=eq.' + wk + '&select=id,staff_name,day,type,status&order=id.desc'),
      SR.db.select('must_work', 'week_key=eq.' + wk + '&select=id,staff_name,day&order=id.desc')
    ]).then(function (r) {
      if (S.week !== wk) return;                 /* 期间切了周：丢掉过期结果 */
      var list = [];
      if (r[0].ok && r[0].data) r[0].data.forEach(function (x) {
        list.push({ id: x.id, tbl: 'requests', name: x.staff_name, day: x.day, kind: x.type });
      });
      if (r[1].ok && r[1].data) r[1].data.forEach(function (x) {
        list.push({ id: x.id, tbl: 'must_work', name: x.staff_name, day: x.day, kind: 'must' });
      });
      S.reqs = list;
      renderReqList();
      renderSheet();                             /* 角标依赖 S.reqs，得重画一次表格 */
    }).catch(function () {
      /* 表没建 / 网络抖动：面板留空，班表照常可用 */
    });
  }

  function renderReqList() {
    var box = $('#reqList'), cnt = $('#reqCount');
    if (cnt) cnt.textContent = String(S.reqs.length);
    if (!box) return;
    if (!S.reqs.length) {
      box.innerHTML = '<p class="hint" style="margin:0">本周还没有请假 / 必上记录。</p>';
      return;
    }
    box.innerHTML = S.reqs.map(function (x) {
      var dayTxt = x.day == null ? '整周' : (REQ_DAY[Number(x.day)] || ('第 ' + x.day + ' 天'));
      var cls = x.kind === 'must' ? 'must' : x.kind === 'leave' ? 'leave' : '';
      var tail = x.kind === 'swap' ? '（调班暂不支持自动排，需手工改格子）' : '';
      return '<div class="req-row"><span class="tag ' + cls + '">' + esc(REQ_KIND[x.kind] || x.kind) +
        '</span><b>' + esc(x.name) + '</b><span class="hint" style="margin:0">' + esc(dayTxt + tail) + '</span>' +
        '<button class="btn plain sm x" type="button" data-del-tbl="' + esc(x.tbl) +
        '" data-del-id="' + esc(x.id) + '">删除</button></div>';
    }).join('');
  }

  function addReq() {
    if (S.readonly) return SR.ui.toast('只读账号不能录入', 'bad');
    var name = $('#reqName') ? $('#reqName').value : '';
    var dv = $('#reqDay').value;
    var type = $('#reqType').value === 'must' ? 'must' : 'leave';
    var day = dv === '' ? null : Number(dv);
    if (!name) return SR.ui.toast('先选一位员工', 'bad');
    if (type === 'must' && day == null) return SR.ui.toast('「必须上班」得选具体哪天', 'bad');

    var dup = S.reqs.some(function (x) {
      var xd = x.day == null ? null : Number(x.day);
      var xk = x.kind === 'must' ? 'must' : 'leave';
      return x.name === name && xk === type && xd === day;
    });
    if (dup) return SR.ui.toast('这条已经录过了', 'bad');

    var job = type === 'must'
      ? SR.db.insert('must_work', { staff_name: name, week_key: S.week, day: day })
      : SR.db.insert('requests', {
          staff_name: name, week_key: S.week, day: day, type: 'leave',
          status: 'approved', note: '经理端录入'
        });

    return job.then(function (r) {
      if (!r.ok) {
        if (r.http === 401) { reauth(); return; }
        var msg = r.error || ('HTTP ' + r.http);
        /* 403 基本只有一种可能：数据库策略还只允许「员工给自己请假」，
           经理替别人录被 RLS 挡掉（见 supabase/migrations/006_requests_manager_insert.sql） */
        if (r.http === 403) {
          msg = '没有权限（数据库策略未放开「经理替别人录入」，执行 006_requests_manager_insert.sql）';
        }
        if (window.console && console.warn) console.warn('[录入失败]', r);
        SR.ui.toast('录入失败：' + msg, 'bad');
        return;
      }
      var where = day == null ? '整周' : DAYS[day];
      SR.ui.toast('已录入：' + name + ' · ' + REQ_KIND[type] + ' · ' + where, 'good');
      genNote('<b>已录入' + esc(REQ_KIND[type]) + '</b> ' + esc(name + ' · ' + where) +
        '<br><span class="mute">点右上角「生成本周」重排后生效（生成是整周覆盖）。</span>');
      return loadReqs();
    });
  }

  /* 「必须上班」没有「哪天都行」这种语义（引擎的 mustWork 必须带 day）：
     选「必上」就把「整周」这一项禁掉并自动落到周一，省得点了才被拦。 */
  function syncReqDay() {
    var must = $('#reqType').value === 'must';
    var sel = $('#reqDay');
    var opt = sel.querySelector ? sel.querySelector('option[value=""]') : null;
    if (opt) opt.disabled = must;
    if (must && sel.value === '') sel.value = '0';
    sel.title = must ? '「必须上班」要选具体哪天' : '不选 = 整周请假';
  }
  $('#reqType').addEventListener('change', syncReqDay);
  syncReqDay();

  $('#reqAdd').addEventListener('click', function () { addReq(); });

  /* 删除：按行上的表名 + id 定向删，不做「清空整周」这种危险操作 */
  $('#reqList').addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('button[data-del-id]') : null;
    if (!b) return;
    if (S.readonly) return SR.ui.toast('只读账号不能改', 'bad');
    var tbl = b.getAttribute('data-del-tbl');
    var id = b.getAttribute('data-del-id');
    if (tbl !== 'requests' && tbl !== 'must_work') return;
    b.disabled = true;
    SR.db.del(tbl, 'id=eq.' + encodeURIComponent(id)).then(function (r) {
      if (!r.ok) {
        b.disabled = false;
        SR.ui.toast('删除失败：' + (r.error || ('HTTP ' + r.http)), 'bad');
        return;
      }
      SR.ui.toast('已删除', 'good');
      loadReqs();
    }).catch(function () { b.disabled = false; });
  });

  /* ---------------- 智能生成（算法文档 §8 一期） ----------------
     做的事：读云端输入（规则阈值 / 请假 / 必上 / 固定班表 / 员工名单）→ 交给
     scheduler.js 排班引擎（N1 预算用满 + N2 爬山）→ 结果写成 shifts 草稿。
     设计要点：
       · 一律**先生成再落草稿**：写进去的就是 dirty 格子，走同一条 flush() 保存链路，
         不会出现「页面显示的」和「云端的」两套；
       · 一个领域一次生成（引擎的 generateWeek 只认单领域），多领域时串行并让出主线程，
         否则页面在生成期间会整段卡住、连进度都刷不出来；
       · 有手改过的格子时会先确认：生成是**覆盖**，不是合并。 */
  var SCHED = window.Scheduler || null;
  var NEEDS_FIELD = {
    hongmeng: 'needsHM', zunjie: 'needsZJ', aftersales: 'needsAS',
    kufang: 'needsKF', admin: 'needsAD', manager: 'needsMgr'
  };
  var LIMITS_FIELD = {
    hongmeng: 'limitsHM', zunjie: 'limitsZJ', aftersales: 'limitsAS',
    kufang: 'limitsKF', admin: 'limitsAD', manager: 'limitsMgr'
  };
  var REST_FIELD = {
    hongmeng: 'restMaxHM', zunjie: 'restMaxZJ', aftersales: 'restMaxAS',
    kufang: 'restMaxKF', admin: 'restMaxAD', manager: 'restMaxMgr'
  };
  var SLOTS = { '早': 'early', '中': 'mid', '晚': 'night', '休': 'rest',
                early: 'early', mid: 'mid', night: 'night', rest: 'rest' };

  /* 生成一次的总耗时预算：单领域精细 ≈ 3s、快速 ≈ 1s；领域多时按数量摊薄，
     免得「全部」一键下去要等半分钟。 */
  var GEN_BUDGET = {
    quality: { budgetMs: 2000, climbMs: 1000 },
    fast: { budgetMs: 1600, climbMs: 0 }
  };

  function genNote(html) {
    var el = $('#genResult');
    if (!html) { el.hidden = true; el.innerHTML = ''; return; }
    el.hidden = false;
    el.innerHTML = html;
  }

  function setGenBusy(on, text) {
    var btn = $('#genBtn');
    btn.disabled = on || S.readonly;
    if (on) btn.textContent = text || '生成中…';
    else btn.textContent = '生成本周';
    $('#genEffort').disabled = on;
  }

  /* 云端输入 → 引擎的 state。字段名与 scheduler.js 的 loadInput 一致。 */
  function buildSchedState(rows) {
    var ruleRows = rows[0].data || [], reqRows = rows[1].data || [],
        allReqRows = rows[2].data || [], mustRows = rows[3].data || [],
        fixedRows = rows[4].data || [];

    var st = {
      staff: [], staffProfiles: {}, staffDomain: {},
      requests: [], mustWork: [],
      schedule: {}, roles: {}, roleSig: {}, manual: {}
    };
    S.staff.forEach(function (p) {
      st.staff.push(p.name);
      st.staffProfiles[p.name] = {
        module: p.module || '', position: p.position || '', level: p.level || '员工'
      };
      st.staffDomain[p.name] = p.domain;
    });

    var skip = [];
    function addReq(row, isWeek) {
      var name = row.staff_name, day = row.day;
      /* 只认三种能落到规则表上的类型：请假→必须休息，必须上班→不排休息。
         调班（swap）没有「换成哪个班」的字段，一期明确不支持，列出来让人手工改。 */
      var type = row.type === 'leave' ? 'off' : row.type === 'must' ? 'work' : null;
      if (!type) { skip.push(name + '（调班申请暂不支持自动排）'); return; }
      if (day == null) {
        /* 请假没写具体哪天 → 按整周请假处理；「必须上班」没写哪天是「哪天都行」，
           引擎没有这种约束，直接跳过，避免凭空钉死 7 天。 */
        if (type === 'off') {
          for (var d = 0; d < 7; d++) st.requests.push(
            { id: st.requests.length + 1, name: name, day: d, type: 'off', scope: 'always', weekKey: '' });
        } else {
          skip.push(name + '（必上未指定日期，已忽略）');
        }
        return;
      }
      st.requests.push({
        id: st.requests.length + 1, name: name, day: Number(day), type: type,
        scope: isWeek ? 'once' : 'always', weekKey: isWeek ? S.week : ''
      });
    }
    reqRows.forEach(function (r) { addReq(r, true); });          /* 本周申请 */
    allReqRows.forEach(function (r) { addReq(r, false); });      /* 常驻（week_key 为空） */

    mustRows.forEach(function (m) {
      if (m.day == null) { skip.push(m.staff_name + '（必上未指定日期，已忽略）'); return; }
      st.mustWork.push({ name: m.staff_name, day: Number(m.day) });
    });

    /* 固定班表：pattern 是「整个领域」的底表，staff_name 非空则是逐人覆盖 */
    var fixed = {};
    fixedRows.forEach(function (f) {
      if (!f.domain) return;
      var arr = (f.pattern || []).map(function (v) { return SLOTS[v] || ''; });
      if (arr.length !== 7) return;
      if (!fixed[f.domain]) fixed[f.domain] = { pattern: null, roster: {} };
      if (f.staff_name) fixed[f.domain].roster[f.staff_name] = arr;
      else fixed[f.domain].pattern = arr;
    });
    st.fixedRoster = fixed;

    /* 规则阈值：rules.config 里认 needs / limits / restMax / exactShifts / weekendEarlyMax。
       没有配置的领域不写，让引擎用它自己的预设（与页面上「需求」面板显示的一致）。 */
    ruleRows.forEach(function (r) {
      var c = r.config || {}, dom = r.domain;
      if (Array.isArray(c.needs) && c.needs.length === 7) {
        st[NEEDS_FIELD[dom] || 'needs'] = c.needs;
      }
      if (c.limits && typeof c.limits === 'object') st[LIMITS_FIELD[dom] || 'limits'] = c.limits;
      if (c.restMax && typeof c.restMax === 'object') st[REST_FIELD[dom] || 'restMax'] = c.restMax;
      if (Array.isArray(c.exactShifts)) st.exactShifts = c.exactShifts;
      if (typeof c.weekendEarlyMax === 'number') st.weekendEarlyMax = c.weekendEarlyMax;
      if (c.groups && typeof c.groups === 'object') st.groups = c.groups;
    });
    return { state: st, skip: skip };
  }

  /* 这次要生成哪些领域：页面上选了具体领域就只生成它，选「全部」就按名单逐个领域排。
     「管理」永远跳过：经理（level=经理）不参与排班，进去只会得到「至少需要 2 人」。 */
  function targetDomains(st) {
    if (S.domain !== '*') return [S.domain];
    var have = {}, order = [];
    st.staff.forEach(function (n) {
      var d = st.staffDomain[n];
      if (!d) return;
      if (!have[d]) { have[d] = 0; order.push(d); }
      have[d]++;
    });
    var out = [];
    DOMAINS.forEach(function (x) { if (x[0] !== 'manager' && have[x[0]]) out.push(x[0]); });
    /* 名单里出现、但页面没定义过的领域也照排（N16 之后领域以库里的 staff.domain 为准） */
    order.forEach(function (d) {
      if (d === 'manager' || out.indexOf(d) >= 0) return;
      if (have[d]) out.push(d);
    });
    return out;
  }

  /* 把引擎结果并进 S.grid，并标脏等 flush 落库。
     ⚠️ 必须按领域过滤：引擎的周表里**故意**带着全店的人（内嵌页面要画整张表），
     「行政」走固定班表时一行 `ensureWeek` 就会给全部 81 人建行，且只有行政的 5 行有内容。
     照单全收的话，最后生成的行政会把其它领域刚排好的格子一条条清成空
     —— 表现就是「点了生成本周，格子里什么都没有」（2026-10-27 实测复现）。 */
  function mergeWeek(res, dom, st) {
    var grid = res.grid || {}, roles = res.roles || {}, n = 0, names = 0;
    Object.keys(grid).forEach(function (name) {
      if (st.staffDomain[name] !== dom) return;
      var row = grid[name] || [], roleRow = roles[name] || [];
      var hasAny = false;
      for (var d = 0; d < 7; d++) if (row[d]) { hasAny = true; break; }
      if (!hasAny) return;            /* 全空行：本领域没排到这个人，别去清已有草稿 */
      names++;
      for (var d2 = 0; d2 < 7; d2++) {
        var k = name + '|' + d2;
        var slot = row[d2] || '';
        if (SLOTS[slot] === undefined) slot = '';   /* 引擎只产出 early/mid/night/rest */
        var role = roleRow[d2] || null;
        var cur = S.grid[k] || { slot: '', role: null, manual: false };
        if (cur.slot === slot && (cur.role || null) === role) continue;
        S.grid[k] = { slot: slot, role: role, manual: false };
        S.dirty[k] = true;
        n++;
      }
    });
    return { cells: n, names: names };
  }

  function genRun() {
    if (!SCHED) return SR.ui.toast('排班引擎没加载（scheduler.js 缺失）', 'bad');
    if (S.readonly) return SR.ui.toast('只读账号不能生成', 'bad');
    if (S.domain === 'manager') return SR.ui.toast('「管理」领域不排班：经理的班次手排或到本部门排', 'bad');

    var existing = Object.keys(S.grid).filter(function (k) { return S.grid[k] && S.grid[k].slot; }).length;
    if (existing && !confirm('本周已有 ' + existing + ' 格草稿，生成会整周覆盖，继续？')) return;

    var effort = $('#genEffort').value === 'fast' ? 'fast' : 'quality';
    var budget = GEN_BUDGET[effort];
    setGenBusy(true, '准备中…');
    genNote('');
    setSave('正在读取排班输入…', '');

    flush().then(function () {
      return Promise.all([
        SR.db.select('rules', 'select=domain,config'),
        SR.db.select('requests', 'week_key=eq.' + S.week + '&status=eq.approved&select=staff_name,day,type'),
        SR.db.select('requests', 'week_key=is.null&status=eq.approved&select=staff_name,day,type'),
        SR.db.select('must_work', 'week_key=eq.' + S.week + '&select=staff_name,day'),
        SR.db.select('fixed_roster', 'select=domain,staff_name,pattern')
      ]);
    }).then(function (rows) {
      var bad = rows.filter(function (r) { return !r.ok; });
      if (bad.length) {
        if (bad[0].http === 401) { reauth(); return null; }
        throw new Error('排班输入读取失败：' + (bad[0].error || ('HTTP ' + bad[0].http)));
      }
      var built = buildSchedState(rows);
      var doms = targetDomains(built.state);
      if (!doms.length) throw new Error('这个领域还没有可排班的员工，先到「人员管理」加人');
      return genDomains(doms, built.state, effort, budget, built.skip);
    }).catch(function (e) {
      setSave('生成失败', 'bad');
      var msg = String(e && e.message ? e.message : e);
      genNote('生成失败：' + esc(msg));
      SR.ui.toast(msg, 'bad');
    }).then(function () {
      setGenBusy(false);
    });
  }

  /* 逐领域生成 + 每轮让出主线程（await sleep），保证进度能刷新出来 */
  function genDomains(doms, st, effort, budget, skip) {
    var out = [], i = 0;
    function step() {
      if (i >= doms.length) return Promise.resolve(out);
      var dom = doms[i];
      setSave('生成中 ' + (DOMAIN_LABEL[dom] || dom) + ' ' + (i + 1) + '/' + doms.length + '…', '');
      setGenBusy(true, '生成中 ' + (i + 1) + '/' + doms.length);
      return sleep(16).then(function () {
        var t0 = Date.now();
        var res = SCHED.generateWeek({
          weekKey: S.week, domain: dom, effort: effort,
          budgetMs: budget.budgetMs, climbMs: budget.climbMs,
          input: { state: st }
        });
        var merged = mergeWeek(res, dom, st);
        out.push({
          domain: dom, res: res, cells: merged.cells, names: merged.names, ms: Date.now() - t0
        });
        i++;
        return step();
      });
    }
    return step().then(function (list) {
      renderSheet();
      var total = 0, ms = 0, hard = 0, gaps = 0, score = 0, warn = [];
      list.forEach(function (x) {
        total += x.cells; ms += x.ms;
        var s = (x.res && x.res.stats) || {};
        hard += s.hard || 0;
        gaps += s.gaps || 0;
        score += s.score || 0;
        (x.res && x.res.warnings || []).forEach(function (w) { warn.push(w); });
      });
      skip.forEach(function (s) { warn.push(s); });

      /* 结果先落库，落库成功才敢说「已生成」—— 否则页面好看、云端是空的 */
      return flush().then(function (ok) {
        if (!ok) throw new Error('班表已生成，但写入云端失败（草稿仍留在页面上，可再点一次生成重试）');
        setSave('草稿已同步', 'ok');
        pubBadge();

        var head = (DOMAIN_LABEL[S.domain] || '全部领域') + ' · ' +
          (effort === 'quality' ? '精细' : '快速') + ' · ' +
          total + ' 格改动 · ' + (ms / 1000).toFixed(1) + 's';
        var body = '硬约束违约 ' + hard + ' 条 · 缺口 ' + gaps + ' 处 · 评分 ' + Math.round(score);
        /* 逐领域明细：排了 0 格时必须说清原因，否则页面只会「什么都没变」 */
        var rows = list.map(function (x) {
          var s = (x.res && x.res.stats) || {};
          var label = DOMAIN_LABEL[x.domain] || x.domain;
          var line = label + ' ' + x.cells + ' 格';
          if (x.res && x.res.ok && x.cells) {
            line += '（' + s.hard + ' 违约 / ' + s.gaps + ' 缺口）';
          } else {
            var why = (x.res && x.res.warnings && x.res.warnings[0]) || '没有可排班的人';
            why = String(why).replace(/\s+/g, ' ').slice(0, 60);
            line += ' —— ' + esc(why);
          }
          return line;
        }).join('<br>');
        var tail = warn.length
          ? '<br><span class="mute">需要人工确认 ' + warn.length + ' 条：' + esc(warn.slice(0, 6).join('；')) +
            (warn.length > 6 ? ' …' : '') + '</span>'
          : '';
        genNote('<b>' + (total ? '已生成' : '⚠️ 没有生成任何班次') + '</b> ' + esc(head) +
          '<br>' + esc(body) + '<br><span class="mute">' + rows + '</span>' + tail);
        SR.ui.toast(total ? '本周班表已生成 ' + total + ' 格' : '没有生成任何班次，请看下方原因',
          total ? 'good' : 'bad');
      });
    });
  }

  function sleep(ms) {
    return new Promise(function (res) { setTimeout(res, ms); });
  }

  $('#genBtn').addEventListener('click', genRun);

  /* ---------------- 周切换 ---------------- */
  function go(delta) {
    flush().then(function () {
      var d = parseYmd(S.week);
      load(ymd(addDays(d, delta * 7)));
    });
  }

  $('#prev').addEventListener('click', function () { go(-1); });
  $('#next').addEventListener('click', function () { go(1); });
  $('#today').addEventListener('click', function () {
    var w = ymd(mondayOf(new Date()));
    if (w === S.week) return;
    flush().then(function () { load(w); });
  });
  $('#reload').addEventListener('click', function () {
    if (Object.keys(S.dirty).length && !confirm('还有改动没保存，刷新会丢掉，继续？')) return;
    load(S.week);
  });

  /* 切回页面时补一次回执统计：员工确认后不用手工刷新也能看到 */
  window.addEventListener('focus', function () {
    if (S.published && !S.busy) loadAck();
  });

  $('#domSeg').addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    S.domain = b.getAttribute('data-dom') || '*';
    renderDomSeg();
    renderView();
  });

  $('#q').addEventListener('input', function () {
    S.q = this.value;
    renderView();
  });

  $('#logout').addEventListener('click', function () {
    flush().then(function () {
      SR.session.clear();
      location.replace('login.html');
    });
  });

  /* ---------------- 发布 ---------------- */
  $('#publishBtn').addEventListener('click', function () {
    if (S.readonly) return SR.ui.toast('只读账号不能发布', 'bad');
    flush().then(function (ok) {
      if (!ok) { SR.ui.toast('还有改动没同步成功，稍后再试', 'bad'); return; }
      openPublish();
    });
  });

  function counts() {
    var staff = {}, cells = 0, working = 0;
    Object.keys(S.grid).forEach(function (k) {
      var c = S.grid[k];
      if (!c || !c.slot) return;
      var name = k.split('|')[0];
      staff[name] = true;
      cells++;
      if (c.slot !== 'rest') working++;
    });
    return { staff: Object.keys(staff).length, cells: cells, working: working };
  }

  function openPublish() {
    var c = counts();
    if (!c.cells) return SR.ui.toast('这一周还是空的，先排几格', 'bad');
    $('#dlgKv').innerHTML =
      '<div><span>周次</span><b>' + esc(rangeText(S.week)) + '</b></div>' +
      '<div><span>涉及员工</span><b>' + c.staff + ' 人</b></div>' +
      '<div><span>班次格子</span><b>' + c.cells + ' 格（上班 ' + c.working + '）</b></div>' +
      '<div><span>版本</span><b>' + (S.published ? 'v' + (S.published.version + 1) + '（覆盖 v' + S.published.version + '）' : 'v1') + '</b></div>';
    $('#dlgNote').value = '';
    showDlgErr('');
    $('#overlay').classList.add('show');
    setTimeout(function () { $('#dlgNote').focus(); }, 60);
  }

  /* 弹层里的错误条：把服务端 HTTP 码和 code 摊开，出问题一眼能看出是哪一步 */
  function showDlgErr(msg) {
    var box = $('#dlgErr');
    if (!msg) { box.className = 'dlg-err'; box.textContent = ''; return; }
    box.className = 'dlg-err show';
    box.textContent = msg;
  }

  function closePublish() {
    $('#overlay').classList.remove('show');
    SR.ui.setLoading($('#dlgOk'), false);
    $('#dlgOk').querySelector('.txt').textContent = '确认发布';
    showDlgErr('');
  }

  $('#dlgCancel').addEventListener('click', function () { if (!S.busy) closePublish(); });
  $('#overlay').addEventListener('click', function (e) {
    if (e.target === this && !S.busy) closePublish();
  });

  $('#dlgOk').addEventListener('click', function () {
    if (S.busy) return;
    S.busy = true;
    SR.ui.setLoading($('#dlgOk'), true);
    $('#dlgOk').querySelector('.txt').textContent = '正在发布…';

    SR.api.call('publish', {
      method: 'POST',
      body: { token: TOKEN, week_key: S.week, note: $('#dlgNote').value.trim() }
    }).then(function (res) {
      var d = res.data || {};
      S.busy = false;
      if (!d.ok) {
        SR.ui.setLoading($('#dlgOk'), false);
        $('#dlgOk').querySelector('.txt').textContent = '确认发布';
        var c = d.code || '';
        if (c === 'BAD_TOKEN' || c === 'NO_TOKEN' || c === 'DISABLED' || c === 'NO_PROFILE') {
          closePublish();
          return reauth();
        }

        /* 把真实原因摊出来：HTTP 404 基本都是 publish 函数还没部署 */
        var why;
        if (res.http === 404 || c === 'NOT_FOUND') {
          why = '发布服务不存在（HTTP 404）：publish 函数还没部署到 Supabase';
        } else if (res.http === 0) {
          why = '网络中断，发布没有完成';
        } else if (!d.error) {
          why = '发布失败：HTTP ' + res.http + (d.message ? ' · ' + d.message : '');
        } else {
          why = d.error + (c ? '（' + c + '）' : '');
        }
        showDlgErr(why + ' · 你的草稿没有被改动，可以重试');
        return SR.ui.toast(why, 'bad');
      }
      closePublish();
      SR.ui.toast('已发布 v' + d.version + ' · ' + d.staff + ' 人可见', 'good');
      load(S.week);
    }).catch(function (e) {
      S.busy = false;
      SR.ui.setLoading($('#dlgOk'), false);
      $('#dlgOk').querySelector('.txt').textContent = '确认发布';
      showDlgErr('发布请求失败：' + String(e && e.message ? e.message : e) + ' · 草稿没有被改动');
      SR.ui.toast('网络异常，发布没有完成', 'bad');
    });
  });

  /* ---------------- 启动 ---------------- */
  (function init() {
    var rb = $('#roleBadge');
    rb.textContent = ME.role === 'manager' ? '排班经理' : '只读';
    rb.className = 'badge ' + (ME.role === 'manager' ? 'ok' : 'warn');

    $('#hint').innerHTML = S.readonly
      ? '只读账号：可以查看全部班表，但不能修改或发布。'
      : '改动会自动保存为草稿（员工看不到）；「生成本周」按算法排一周草稿，点「发布本周」后员工端才会显示。';

    setGenBusy(false);   /* 只读账号在这里被禁用 */

    /* 默认看法：手机 / 平板窄屏 → 「按天」（替代左右横滑）；电脑 → 「表格」。
       上次手动选过就沿用上次的选择（本机偏好，不上云）。 */
    var saved = '';
    try { saved = localStorage.getItem('sr.mgrView') || ''; } catch (e) {}
    if (saved === 'sheet' || saved === 'overview' || saved === 'day') S.view = saved;
    else S.view = window.innerWidth <= 720 ? 'day' : 'sheet';

    load(ymd(mondayOf(new Date())));
  })();
})();
</script>
</body>
</html>
