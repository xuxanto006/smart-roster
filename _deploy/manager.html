<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="color-scheme" content="light dark">
<title>排班工作台 · 智能排班</title>
<link rel="stylesheet" href="ui.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231d1d1f'/><text x='50' y='66' font-size='46' font-family='system-ui' font-weight='700' text-anchor='middle' fill='%23fff'>SR</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand-inline" href="manager.html">
      <span class="logo sm">SR</span><b>排班工作台</b>
    </a>
    <span class="sep"></span>
    <span class="badge" id="roleBadge">—</span>
    <a class="btn plain sm" href="view-account.html">账号中心</a>
    <button class="btn plain sm" id="logout" type="button">退出</button>
  </div>
</header>

<main class="wrap wb">

  <div class="wb-head">
    <div class="weeknav">
      <button class="btn ghost sm" id="prev" type="button" aria-label="上一周">‹</button>
      <span class="range" id="range">—</span>
      <button class="btn ghost sm" id="next" type="button" aria-label="下一周">›</button>
      <button class="btn plain sm" id="today" type="button">本周</button>
    </div>
    <span class="badge info" id="pubBadge">载入中…</span>
    <span class="sep"></span>
    <span class="save-state" id="saveState">载入中…</span>
    <button class="btn ghost sm" id="reload" type="button">刷新</button>
    <select class="select" id="genEffort" title="生成质量：精细多花几秒换更好的班表">
      <option value="quality">精细</option>
      <option value="fast">快速</option>
    </select>
    <button class="btn plain" id="genBtn" type="button">生成本周</button>
    <button class="btn primary" id="publishBtn" type="button">发布本周</button>
  </div>

  <div class="toolbar">
    <div class="seg" id="domSeg"></div>
    <input class="search" id="q" type="search" placeholder="搜索员工 / 岗位 / 模块" autocomplete="off">
  </div>

  <p class="hint" id="genResult" hidden></p>

  <div class="legend">
    <span><i class="lg-early"></i>早班</span>
    <span><i class="lg-mid"></i>中班</span>
    <span><i class="lg-night"></i>晚班</span>
    <span><i class="lg-rest"></i>休息</span>
    <span class="mute">点格子依次切换：早 → 中 → 晚 → 休 → 清空；蓝点表示还没同步</span>
  </div>

  <div class="sheet-wrap" id="sheetWrap">
    <div class="skeleton">正在载入班表…</div>
  </div>

  <div class="stats" id="stats"></div>

  <p class="hint" id="hint"></p>
</main>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h3 id="dlgTitle">发布本周班表</h3>
    <p class="sub" id="dlgDesc">发布后员工端立刻能看到自己的班表，草稿改动不会外泄。</p>
    <div class="kv" id="dlgKv"></div>
    <div class="field" style="margin-top:16px">
      <label for="dlgNote">发布说明（选填）</label>
      <div class="input-shell">
        <input class="input" id="dlgNote" maxlength="200" placeholder="例如：本周有调休，已和大家确认过">
      </div>
    </div>
    <div class="acts">
      <button class="btn primary block" id="dlgOk" type="button">
        <span class="spin"></span><span class="txt">确认发布</span>
      </button>
      <button class="btn plain block" id="dlgCancel" type="button">取消</button>
    </div>
    <div class="dlg-err" id="dlgErr"></div>
  </div>
</div>

<script src="auth-core.js"></script>
<script src="scheduler.js"></script>
<script>
(function () {
  'use strict';

  var $ = SR.$;
  var session = SR.session.get();
  if (!session || !session.access_token) {
    location.replace('login.html');
    return;
  }

  var TOKEN = session.access_token;
  var ME = {
    username: session.username || '',
    name: session.display_name || session.username || '',
    role: session.role || 'employee'
  };

  if (ME.role !== 'manager' && ME.role !== 'viewer') {
    document.body.innerHTML =
      '<main class="page"><section class="card auth" style="max-width:420px">' +
      '<h2 class="h2">没有访问权限</h2>' +
      '<p class="sub">这个页面只对排班经理开放。员工请到「我的班表」。</p>' +
      '<div class="acts"><a class="btn primary block" href="login.html">返回登录</a></div>' +
      '</section></main>';
    return;
  }

  var DAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  var SLOT_LABEL = { early: '早', mid: '中', night: '晚', rest: '休' };
  var SLOT_CLASS = { '': '', early: 's-early', mid: 's-mid', night: 's-night', rest: 's-rest' };
  var CYCLE = { '': 'early', early: 'mid', mid: 'night', night: 'rest', rest: '' };
  var DOMAINS = [
    ['3c', '3C'], ['hongmeng', '鸿蒙'], ['zunjie', '尊界'],
    ['aftersales', '售后'], ['kufang', '库房'], ['admin', '行政'], ['manager', '管理']
  ];
  var DOMAIN_LABEL = {};
  DOMAINS.forEach(function (d) { DOMAIN_LABEL[d[0]] = d[1]; });

  var S = {
    week: '',
    staff: [],
    grid: {},        /* "姓名|day" -> {slot, role} */
    dirty: {},       /* "姓名|day" -> true */
    timer: null,
    saving: false,
    published: null,
    ack: null,       /* { seen, total, pending: [姓名…] }·这一版员工「已知晓」回执统计 */
    readonly: ME.role !== 'manager',
    domain: '*',
    q: '',
    busy: false
  };

  /* ---------------- 日期 ---------------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseYmd(s) {
    var p = String(s).split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }
  function mondayOf(d) {
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var dow = t.getDay();                 /* 0 = 周日 */
    t.setDate(t.getDate() + (dow === 0 ? -6 : 1 - dow));
    return t;
  }
  function addDays(d, n) {
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    t.setDate(t.getDate() + n);
    return t;
  }
  function rangeText(week) {
    var a = parseYmd(week), b = addDays(a, 6);
    return a.getFullYear() + '/' + pad(a.getMonth() + 1) + '/' + pad(a.getDate()) +
      ' – ' + pad(b.getMonth() + 1) + '/' + pad(b.getDate());
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function reauth() {
    SR.session.clear();
    SR.ui.toast('登录状态已失效，正在返回登录页…', 'bad');
    setTimeout(function () { location.replace('login.html'); }, 900);
  }

  function setSave(text, kind) {
    var el = $('#saveState');
    el.textContent = text;
    el.className = 'save-state' + (kind ? ' ' + kind : '');
  }

  /* ---------------- 载入 ---------------- */
  function load(week) {
    S.week = week;
    S.grid = {};
    S.dirty = {};
    setSave('载入中…', '');
    $('#range').textContent = rangeText(week);
    $('#sheetWrap').innerHTML = '<div class="skeleton">正在载入 ' + esc(rangeText(week)) + ' 的班表…</div>';

    return Promise.all([
      SR.db.select('weeks', 'week_key=eq.' + week + '&select=week_key,status'),
      SR.db.select('staff', 'select=name,domain,module,position,level&active=is.true&order=domain.asc,name.asc'),
      SR.db.select('shifts', 'week_key=eq.' + week + '&select=staff_name,day,slot,role,manual'),
      SR.db.select('publish_versions', 'week_key=eq.' + week + '&select=publish_id,version,published_at&order=version.desc&limit=1')
    ]).then(function (r) {
      var wk = r[0], st = r[1], sh = r[2], pv = r[3];
      if (wk.http === 401 || st.http === 401) { reauth(); return; }

      if (!st.ok) { fail(st.error || '员工名单读取失败'); return; }
      S.staff = st.data || [];

      /* 周记录不存在就建一条：ignore-duplicates，避免把已发布的周改回草稿 */
      if (wk.ok && (!wk.data || !wk.data.length)) {
        SR.db.insert('weeks', { week_key: week, status: 'draft' }, 'resolution=ignore-duplicates');
      }

      if (sh.ok && sh.data) {
        sh.data.forEach(function (row) {
          S.grid[row.staff_name + '|' + row.day] = {
            slot: row.slot || '', role: row.role || null, manual: !!row.manual
          };
        });
      }

      S.published = (pv.ok && pv.data && pv.data[0]) ? pv.data[0] : null;
      setSave('草稿已同步', 'ok');
      renderAll();
      loadAck();
    }).catch(function (e) {
      fail(String(e && e.message ? e.message : e));
    });
  }

  function fail(msg) {
    setSave('载入失败', 'bad');
    $('#sheetWrap').innerHTML =
      '<div class="empty"><b>班表没载入成功</b>' + esc(msg) +
      '<div class="acts" style="max-width:200px;margin:16px auto 0">' +
      '<button class="btn ghost block" type="button" onclick="location.reload()">重新加载</button></div></div>';
  }

  /* ---------------- 渲染 ---------------- */
  function visibleStaff() {
    var q = S.q.trim().toLowerCase();
    return S.staff.filter(function (p) {
      if (S.domain !== '*' && p.domain !== S.domain) return false;
      if (!q) return true;
      return (p.name + ' ' + (p.position || '') + ' ' + (p.module || '') + ' ' + (p.level || ''))
        .toLowerCase().indexOf(q) >= 0;
    });
  }

  function renderDomSeg() {
    var counts = {};
    S.staff.forEach(function (p) { counts[p.domain] = (counts[p.domain] || 0) + 1; });
    var h = '<button type="button" data-dom="*"' + (S.domain === '*' ? ' class="on"' : '') + '>全部 ' +
      S.staff.length + '</button>';
    DOMAINS.forEach(function (d) {
      if (!counts[d[0]]) return;
      h += '<button type="button" data-dom="' + d[0] + '"' + (S.domain === d[0] ? ' class="on"' : '') + '>' +
        d[1] + ' ' + counts[d[0]] + '</button>';
    });
    $('#domSeg').innerHTML = h;
  }

  function renderAll() {
    renderDomSeg();
    renderSheet();
  }

  function renderSheet() {
    var list = visibleStaff();
    if (!list.length) {
      $('#sheetWrap').innerHTML = '<div class="empty"><b>没有匹配的员工</b>换个筛选或搜索词试试</div>';
      updateCounts();
      return;
    }

    var h = '<table class="grid"><thead><tr><th class="who">员工 <small>共 ' + list.length + ' 人</small></th>';
    for (var i = 0; i < 7; i++) {
      var d = addDays(parseYmd(S.week), i);
      h += '<th class="' + (i >= 5 ? 'we' : '') + '">' + DAYS[i] +
        '<span class="d">' + (d.getMonth() + 1) + '/' + d.getDate() + '</span></th>';
    }
    h += '</tr></thead><tbody>';

    list.forEach(function (p) {
      var si = S.staff.indexOf(p);
      var meta = DOMAIN_LABEL[p.domain] || p.domain || '';
      if (p.position) meta += ' · ' + p.position;
      h += '<tr><td class="who"><b>' + esc(p.name) + '</b><small>' + esc(meta) + '</small></td>';
      for (var day = 0; day < 7; day++) {
        var k = p.name + '|' + day;
        var slot = (S.grid[k] && S.grid[k].slot) || '';
        h += '<td class="celltd"><button class="cell ' + SLOT_CLASS[slot] +
          (S.dirty[k] ? ' dirty' : '') + '" type="button" data-si="' + si + '" data-day="' + day +
          '" data-s="' + slot + '"' + (S.readonly ? ' disabled' : '') +
          ' title="' + esc(p.name + ' · ' + DAYS[day]) + '">' + (SLOT_LABEL[slot] || '—') + '</button></td>';
      }
      h += '</tr>';
    });

    h += '</tbody><tfoot><tr><td class="who">每日人数</td>';
    for (var k2 = 0; k2 < 7; k2++) h += '<td data-sum="' + k2 + '">0</td>';
    h += '</tr></tfoot></table>';

    $('#sheetWrap').innerHTML = h;
    updateCounts();
  }

  function countDay(day) {
    var n = 0;
    visibleStaff().forEach(function (p) {
      var c = S.grid[p.name + '|' + day];
      if (c && c.slot && c.slot !== 'rest') n++;
    });
    return n;
  }

  function updateCounts() {
    var sums = document.querySelectorAll('#sheetWrap td[data-sum]');
    for (var i = 0; i < sums.length; i++) sums[i].textContent = countDay(Number(sums[i].getAttribute('data-sum')));

    var list = visibleStaff(), cells = 0, working = 0, perStaff = 0;
    list.forEach(function (p) {
      var n = 0;
      for (var d = 0; d < 7; d++) {
        var c = S.grid[p.name + '|' + d];
        if (c && c.slot) { cells++; if (c.slot !== 'rest') { working++; n++; } }
      }
      if (n) perStaff++;
    });

    $('#stats').innerHTML =
      stat(cells, '已排格子') +
      stat(perStaff, '本周有人上班') +
      stat(working, '上班人次') +
      stat(cells ? (working / 7).toFixed(1) : '0', '日均上班人数');

    pubBadge();
  }

  function stat(n, k) {
    return '<div class="stat"><div class="n">' + n + '</div><div class="k">' + k + '</div></div>';
  }

  /* ---------------- 已知晓回执 ---------------- */
  /* 只统计「这一版」：publish 时为每个排了班的员工建一条 inapp 投递，
     员工在「我的班表」点确认后，Edge Function ack 把那条的 status 改成 seen。 */
  function loadAck() {
    var pid = S.published && S.published.publish_id;
    S.ack = null;
    if (!pid) { pubBadge(); return; }
    pubBadge();

    SR.db.select('publish_deliveries',
      'publish_id=eq.' + encodeURIComponent(pid) + '&select=staff_name,status')
      .then(function (r) {
        /* 期间切了周：丢掉过期结果 */
        if (!S.published || S.published.publish_id !== pid) return;
        if (!r.ok || !r.data) { S.ack = null; pubBadge(); return; }
        var seen = 0, pending = [];
        r.data.forEach(function (d) {
          if (d.status === 'seen') seen++;
          else pending.push(d.staff_name);
        });
        S.ack = { seen: seen, total: r.data.length, pending: pending };
        pubBadge();
      })
      .catch(function () {
        if (!S.published || S.published.publish_id !== pid) return;
        S.ack = null;
        pubBadge();
      });
  }

  function pubBadge() {
    var b = $('#pubBadge');
    b.hidden = false;
    b.title = '';
    if (S.published) {
      var dirty = Object.keys(S.dirty).length > 0;
      b.className = 'badge ' + (dirty ? 'warn' : 'ok');
      var txt = (dirty ? '有未发布改动 · ' : '已发布 ') + 'v' + S.published.version;
      if (S.ack && S.ack.total) {
        txt += ' · 已知晓 ' + S.ack.seen + '/' + S.ack.total;
        b.title = S.ack.pending.length
          ? '还没确认：' + S.ack.pending.join('、')
          : '全员已确认';
      }
      b.textContent = txt;
    } else {
      b.className = 'badge info';
      b.textContent = '尚未发布';
    }
    var hasAny = Object.keys(S.grid).some(function (k) { return !!S.grid[k].slot; });
    var btn = $('#publishBtn');
    btn.disabled = S.readonly || S.saving || !hasAny;
    btn.title = S.readonly ? '只读账号不能发布' : (!hasAny ? '这一周还没排班' : '');
  }

  /* ---------------- 编辑 ---------------- */
  $('#sheetWrap').addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('.cell') : null;
    if (!btn || btn.disabled || S.readonly) return;
    var si = Number(btn.getAttribute('data-si'));
    var day = Number(btn.getAttribute('data-day'));
    var p = S.staff[si];
    if (!p) return;
    var k = p.name + '|' + day;
    var cur = (S.grid[k] && S.grid[k].slot) || '';
    var next = CYCLE[cur] || '';
    setSlot(k, next, btn, day);
  });

  function setSlot(k, slot, btn, day) {
    if (!S.grid[k]) S.grid[k] = { slot: '', role: null, manual: false };
    S.grid[k].slot = slot;
    S.grid[k].manual = true;      /* 人工点过的格子 → shifts.manual（「轻触」契约落库） */
    S.dirty[k] = true;

    if (btn) {
      btn.className = 'cell ' + SLOT_CLASS[slot] + ' dirty';
      btn.setAttribute('data-s', slot);
      btn.textContent = SLOT_LABEL[slot] || '—';
    }
    updateCounts();
    schedule();
  }

  function schedule() {
    clearTimeout(S.timer);
    setSave('保存中…', '');
    S.timer = setTimeout(flush, 700);
  }

  /* 把脏格子写回云端：有班次 → upsert；清空 → 删除该行 */
  function flush() {
    clearTimeout(S.timer);
    var keys = Object.keys(S.dirty);
    if (!keys.length) return Promise.resolve(true);
    if (S.readonly) return Promise.resolve(false);

    var up = [], del = [];
    keys.forEach(function (k) {
      var parts = k.split('|');
      var cell = S.grid[k] || {};
      var slot = cell.slot || '';
      if (slot) {
        up.push({
          week_key: S.week,
          staff_name: parts[0],
          day: Number(parts[1]),
          slot: slot,
          role: cell.role || null,
          /* 生成写回的格子是算法产出的，不该继承上一版的「手动」标记 */
          manual: !!cell.manual
        });
      } else {
        del.push(parts);
      }
    });

    var jobs = [];
    if (up.length) jobs.push(SR.db.upsert('shifts', up, 'week_key,staff_name,day'));
    del.forEach(function (parts) {
      jobs.push(SR.db.del('shifts', 'week_key=eq.' + S.week +
        '&staff_name=eq.' + encodeURIComponent(parts[0]) + '&day=eq.' + Number(parts[1])));
    });

    S.saving = true;
    pubBadge();

    return Promise.all(jobs).then(function (res) {
      S.saving = false;
      var bad = res.filter(function (r) { return !r.ok; });
      if (bad.length) {
        if (bad[0].http === 401) { reauth(); return false; }
        setSave('保存失败', 'bad');
        SR.ui.toast('保存失败：' + (bad[0].error || '网络异常'), 'bad');
        pubBadge();
        return false;
      }
      keys.forEach(function (k) { if (S.dirty[k] && S.grid[k]) delete S.dirty[k]; });
      setSave('草稿已同步', 'ok');
      document.querySelectorAll('#sheetWrap .cell').forEach(function (el) {
        var si = Number(el.getAttribute('data-si'));
        var day = Number(el.getAttribute('data-day'));
        var p = S.staff[si];
        if (p) el.classList.toggle('dirty', !!S.dirty[p.name + '|' + day]);
      });
      pubBadge();
      return true;
    });
  }

  /* ---------------- 智能生成（算法文档 §8 一期） ----------------
     做的事：读云端输入（规则阈值 / 请假 / 必上 / 固定班表 / 员工名单）→ 交给
     scheduler.js 排班引擎（N1 预算用满 + N2 爬山）→ 结果写成 shifts 草稿。
     设计要点：
       · 一律**先生成再落草稿**：写进去的就是 dirty 格子，走同一条 flush() 保存链路，
         不会出现「页面显示的」和「云端的」两套；
       · 一个领域一次生成（引擎的 generateWeek 只认单领域），多领域时串行并让出主线程，
         否则页面在生成期间会整段卡住、连进度都刷不出来；
       · 有手改过的格子时会先确认：生成是**覆盖**，不是合并。 */
  var SCHED = window.Scheduler || null;
  var NEEDS_FIELD = {
    hongmeng: 'needsHM', zunjie: 'needsZJ', aftersales: 'needsAS',
    kufang: 'needsKF', admin: 'needsAD', manager: 'needsMgr'
  };
  var LIMITS_FIELD = {
    hongmeng: 'limitsHM', zunjie: 'limitsZJ', aftersales: 'limitsAS',
    kufang: 'limitsKF', admin: 'limitsAD', manager: 'limitsMgr'
  };
  var REST_FIELD = {
    hongmeng: 'restMaxHM', zunjie: 'restMaxZJ', aftersales: 'restMaxAS',
    kufang: 'restMaxKF', admin: 'restMaxAD', manager: 'restMaxMgr'
  };
  var SLOTS = { '早': 'early', '中': 'mid', '晚': 'night', '休': 'rest',
                early: 'early', mid: 'mid', night: 'night', rest: 'rest' };

  /* 生成一次的总耗时预算：单领域精细 ≈ 3s、快速 ≈ 1s；领域多时按数量摊薄，
     免得「全部」一键下去要等半分钟。 */
  var GEN_BUDGET = {
    quality: { budgetMs: 2000, climbMs: 1000 },
    fast: { budgetMs: 1600, climbMs: 0 }
  };

  function genNote(html) {
    var el = $('#genResult');
    if (!html) { el.hidden = true; el.innerHTML = ''; return; }
    el.hidden = false;
    el.innerHTML = html;
  }

  function setGenBusy(on, text) {
    var btn = $('#genBtn');
    btn.disabled = on || S.readonly;
    if (on) btn.textContent = text || '生成中…';
    else btn.textContent = '生成本周';
    $('#genEffort').disabled = on;
  }

  /* 云端输入 → 引擎的 state。字段名与 scheduler.js 的 loadInput 一致。 */
  function buildSchedState(rows) {
    var ruleRows = rows[0].data || [], reqRows = rows[1].data || [],
        allReqRows = rows[2].data || [], mustRows = rows[3].data || [],
        fixedRows = rows[4].data || [];

    var st = {
      staff: [], staffProfiles: {}, staffDomain: {},
      requests: [], mustWork: [],
      schedule: {}, roles: {}, roleSig: {}, manual: {}
    };
    S.staff.forEach(function (p) {
      st.staff.push(p.name);
      st.staffProfiles[p.name] = {
        module: p.module || '', position: p.position || '', level: p.level || '员工'
      };
      st.staffDomain[p.name] = p.domain;
    });

    var skip = [];
    function addReq(row, isWeek) {
      var name = row.staff_name, day = row.day;
      /* 只认三种能落到规则表上的类型：请假→必须休息，必须上班→不排休息。
         调班（swap）没有「换成哪个班」的字段，一期明确不支持，列出来让人手工改。 */
      var type = row.type === 'leave' ? 'off' : row.type === 'must' ? 'work' : null;
      if (!type) { skip.push(name + '（调班申请暂不支持自动排）'); return; }
      if (day == null) {
        /* 请假没写具体哪天 → 按整周请假处理；「必须上班」没写哪天是「哪天都行」，
           引擎没有这种约束，直接跳过，避免凭空钉死 7 天。 */
        if (type === 'off') {
          for (var d = 0; d < 7; d++) st.requests.push(
            { id: st.requests.length + 1, name: name, day: d, type: 'off', scope: 'always', weekKey: '' });
        } else {
          skip.push(name + '（必上未指定日期，已忽略）');
        }
        return;
      }
      st.requests.push({
        id: st.requests.length + 1, name: name, day: Number(day), type: type,
        scope: isWeek ? 'once' : 'always', weekKey: isWeek ? S.week : ''
      });
    }
    reqRows.forEach(function (r) { addReq(r, true); });          /* 本周申请 */
    allReqRows.forEach(function (r) { addReq(r, false); });      /* 常驻（week_key 为空） */

    mustRows.forEach(function (m) {
      if (m.day == null) { skip.push(m.staff_name + '（必上未指定日期，已忽略）'); return; }
      st.mustWork.push({ name: m.staff_name, day: Number(m.day) });
    });

    /* 固定班表：pattern 是「整个领域」的底表，staff_name 非空则是逐人覆盖 */
    var fixed = {};
    fixedRows.forEach(function (f) {
      if (!f.domain) return;
      var arr = (f.pattern || []).map(function (v) { return SLOTS[v] || ''; });
      if (arr.length !== 7) return;
      if (!fixed[f.domain]) fixed[f.domain] = { pattern: null, roster: {} };
      if (f.staff_name) fixed[f.domain].roster[f.staff_name] = arr;
      else fixed[f.domain].pattern = arr;
    });
    st.fixedRoster = fixed;

    /* 规则阈值：rules.config 里认 needs / limits / restMax / exactShifts / weekendEarlyMax。
       没有配置的领域不写，让引擎用它自己的预设（与页面上「需求」面板显示的一致）。 */
    ruleRows.forEach(function (r) {
      var c = r.config || {}, dom = r.domain;
      if (Array.isArray(c.needs) && c.needs.length === 7) {
        st[NEEDS_FIELD[dom] || 'needs'] = c.needs;
      }
      if (c.limits && typeof c.limits === 'object') st[LIMITS_FIELD[dom] || 'limits'] = c.limits;
      if (c.restMax && typeof c.restMax === 'object') st[REST_FIELD[dom] || 'restMax'] = c.restMax;
      if (Array.isArray(c.exactShifts)) st.exactShifts = c.exactShifts;
      if (typeof c.weekendEarlyMax === 'number') st.weekendEarlyMax = c.weekendEarlyMax;
      if (c.groups && typeof c.groups === 'object') st.groups = c.groups;
    });
    return { state: st, skip: skip };
  }

  /* 这次要生成哪些领域：页面上选了具体领域就只生成它，选「全部」就逐领域都排 */
  function targetDomains(st) {
    if (S.domain !== '*') return [S.domain];
    var have = {};
    st.staff.forEach(function (n) { have[st.staffDomain[n]] = (have[st.staffDomain[n]] || 0) + 1; });
    var out = [];
    DOMAINS.forEach(function (d) { if (have[d[0]]) out.push(d[0]); });
    return out;
  }

  /* 把引擎结果并进 S.grid，并标脏等 flush 落库 */
  function mergeWeek(res) {
    var grid = res.grid || {}, roles = res.roles || {}, n = 0;
    Object.keys(grid).forEach(function (name) {
      var row = grid[name] || [], roleRow = roles[name] || [];
      for (var d = 0; d < 7; d++) {
        var k = name + '|' + d;
        var slot = row[d] || '';
        if (SLOTS[slot] === undefined) slot = '';   /* 引擎只产出 early/mid/night/rest */
        var role = roleRow[d] || null;
        var cur = S.grid[k] || { slot: '', role: null, manual: false };
        if (cur.slot === slot && (cur.role || null) === role) continue;
        S.grid[k] = { slot: slot, role: role, manual: false };
        S.dirty[k] = true;
        n++;
      }
    });
    return n;
  }

  function genRun() {
    if (!SCHED) return SR.ui.toast('排班引擎没加载（scheduler.js 缺失）', 'bad');
    if (S.readonly) return SR.ui.toast('只读账号不能生成', 'bad');

    var existing = Object.keys(S.grid).filter(function (k) { return S.grid[k] && S.grid[k].slot; }).length;
    if (existing && !confirm('本周已有 ' + existing + ' 格草稿，生成会整周覆盖，继续？')) return;

    var effort = $('#genEffort').value === 'fast' ? 'fast' : 'quality';
    var budget = GEN_BUDGET[effort];
    setGenBusy(true, '准备中…');
    genNote('');
    setSave('正在读取排班输入…', '');

    flush().then(function () {
      return Promise.all([
        SR.db.select('rules', 'select=domain,config'),
        SR.db.select('requests', 'week_key=eq.' + S.week + '&status=eq.approved&select=staff_name,day,type'),
        SR.db.select('requests', 'week_key=is.null&status=eq.approved&select=staff_name,day,type'),
        SR.db.select('must_work', 'week_key=eq.' + S.week + '&select=staff_name,day'),
        SR.db.select('fixed_roster', 'select=domain,staff_name,pattern')
      ]);
    }).then(function (rows) {
      var bad = rows.filter(function (r) { return !r.ok; });
      if (bad.length) {
        if (bad[0].http === 401) { reauth(); return null; }
        throw new Error('排班输入读取失败：' + (bad[0].error || ('HTTP ' + bad[0].http)));
      }
      var built = buildSchedState(rows);
      var doms = targetDomains(built.state);
      if (!doms.length) throw new Error('这个领域还没有可排班的员工，先到「人员管理」加人');
      return genDomains(doms, built.state, effort, budget, built.skip);
    }).catch(function (e) {
      setSave('生成失败', 'bad');
      var msg = String(e && e.message ? e.message : e);
      genNote('生成失败：' + esc(msg));
      SR.ui.toast(msg, 'bad');
    }).then(function () {
      setGenBusy(false);
    });
  }

  /* 逐领域生成 + 每轮让出主线程（await sleep），保证进度能刷新出来 */
  function genDomains(doms, st, effort, budget, skip) {
    var out = [], i = 0;
    function step() {
      if (i >= doms.length) return Promise.resolve(out);
      var dom = doms[i];
      setSave('生成中 ' + (DOMAIN_LABEL[dom] || dom) + ' ' + (i + 1) + '/' + doms.length + '…', '');
      setGenBusy(true, '生成中 ' + (i + 1) + '/' + doms.length);
      return sleep(16).then(function () {
        var t0 = Date.now();
        var res = SCHED.generateWeek({
          weekKey: S.week, domain: dom, effort: effort,
          budgetMs: budget.budgetMs, climbMs: budget.climbMs,
          input: { state: st }
        });
        var cells = mergeWeek(res);
        out.push({ domain: dom, res: res, cells: cells, ms: Date.now() - t0 });
        i++;
        return step();
      });
    }
    return step().then(function (list) {
      renderSheet();
      var total = 0, ms = 0, hard = 0, gaps = 0, score = 0, warn = [];
      list.forEach(function (x) {
        total += x.cells; ms += x.ms;
        var s = (x.res && x.res.stats) || {};
        hard += s.hard || 0;
        gaps += s.gaps || 0;
        score += s.score || 0;
        (x.res && x.res.warnings || []).forEach(function (w) { warn.push(w); });
      });
      skip.forEach(function (s) { warn.push(s); });

      /* 结果先落库，落库成功才敢说「已生成」—— 否则页面好看、云端是空的 */
      return flush().then(function (ok) {
        if (!ok) throw new Error('班表已生成，但写入云端失败（草稿仍留在页面上，可再点一次生成重试）');
        setSave('草稿已同步', 'ok');
        pubBadge();
        var head = (DOMAIN_LABEL[S.domain] || '全部领域') + ' · ' +
          (effort === 'quality' ? '精细' : '快速') + ' · ' +
          total + ' 格改动 · ' + (ms / 1000).toFixed(1) + 's';
        var body = '硬约束违约 ' + hard + ' 条 · 缺口 ' + gaps + ' 处 · 评分 ' + Math.round(score);
        var tail = warn.length
          ? '<br><span class="mute">需要人工确认 ' + warn.length + ' 条：' + esc(warn.slice(0, 6).join('；')) +
            (warn.length > 6 ? ' …' : '') + '</span>'
          : '';
        genNote('<b>已生成</b> ' + esc(head) + '<br>' + esc(body) + tail);
        SR.ui.toast('本周班表已生成 ' + total + ' 格', 'good');
      });
    });
  }

  function sleep(ms) {
    return new Promise(function (res) { setTimeout(res, ms); });
  }

  $('#genBtn').addEventListener('click', genRun);

  /* ---------------- 周切换 ---------------- */
  function go(delta) {
    flush().then(function () {
      var d = parseYmd(S.week);
      load(ymd(addDays(d, delta * 7)));
    });
  }

  $('#prev').addEventListener('click', function () { go(-1); });
  $('#next').addEventListener('click', function () { go(1); });
  $('#today').addEventListener('click', function () {
    var w = ymd(mondayOf(new Date()));
    if (w === S.week) return;
    flush().then(function () { load(w); });
  });
  $('#reload').addEventListener('click', function () {
    if (Object.keys(S.dirty).length && !confirm('还有改动没保存，刷新会丢掉，继续？')) return;
    load(S.week);
  });

  /* 切回页面时补一次回执统计：员工确认后不用手工刷新也能看到 */
  window.addEventListener('focus', function () {
    if (S.published && !S.busy) loadAck();
  });

  $('#domSeg').addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    S.domain = b.getAttribute('data-dom') || '*';
    renderDomSeg();
    renderSheet();
  });

  $('#q').addEventListener('input', function () {
    S.q = this.value;
    renderSheet();
  });

  $('#logout').addEventListener('click', function () {
    flush().then(function () {
      SR.session.clear();
      location.replace('login.html');
    });
  });

  /* ---------------- 发布 ---------------- */
  $('#publishBtn').addEventListener('click', function () {
    if (S.readonly) return SR.ui.toast('只读账号不能发布', 'bad');
    flush().then(function (ok) {
      if (!ok) { SR.ui.toast('还有改动没同步成功，稍后再试', 'bad'); return; }
      openPublish();
    });
  });

  function counts() {
    var staff = {}, cells = 0, working = 0;
    Object.keys(S.grid).forEach(function (k) {
      var c = S.grid[k];
      if (!c || !c.slot) return;
      var name = k.split('|')[0];
      staff[name] = true;
      cells++;
      if (c.slot !== 'rest') working++;
    });
    return { staff: Object.keys(staff).length, cells: cells, working: working };
  }

  function openPublish() {
    var c = counts();
    if (!c.cells) return SR.ui.toast('这一周还是空的，先排几格', 'bad');
    $('#dlgKv').innerHTML =
      '<div><span>周次</span><b>' + esc(rangeText(S.week)) + '</b></div>' +
      '<div><span>涉及员工</span><b>' + c.staff + ' 人</b></div>' +
      '<div><span>班次格子</span><b>' + c.cells + ' 格（上班 ' + c.working + '）</b></div>' +
      '<div><span>版本</span><b>' + (S.published ? 'v' + (S.published.version + 1) + '（覆盖 v' + S.published.version + '）' : 'v1') + '</b></div>';
    $('#dlgNote').value = '';
    showDlgErr('');
    $('#overlay').classList.add('show');
    setTimeout(function () { $('#dlgNote').focus(); }, 60);
  }

  /* 弹层里的错误条：把服务端 HTTP 码和 code 摊开，出问题一眼能看出是哪一步 */
  function showDlgErr(msg) {
    var box = $('#dlgErr');
    if (!msg) { box.className = 'dlg-err'; box.textContent = ''; return; }
    box.className = 'dlg-err show';
    box.textContent = msg;
  }

  function closePublish() {
    $('#overlay').classList.remove('show');
    SR.ui.setLoading($('#dlgOk'), false);
    $('#dlgOk').querySelector('.txt').textContent = '确认发布';
    showDlgErr('');
  }

  $('#dlgCancel').addEventListener('click', function () { if (!S.busy) closePublish(); });
  $('#overlay').addEventListener('click', function (e) {
    if (e.target === this && !S.busy) closePublish();
  });

  $('#dlgOk').addEventListener('click', function () {
    if (S.busy) return;
    S.busy = true;
    SR.ui.setLoading($('#dlgOk'), true);
    $('#dlgOk').querySelector('.txt').textContent = '正在发布…';

    SR.api.call('publish', {
      method: 'POST',
      body: { token: TOKEN, week_key: S.week, note: $('#dlgNote').value.trim() }
    }).then(function (res) {
      var d = res.data || {};
      S.busy = false;
      if (!d.ok) {
        SR.ui.setLoading($('#dlgOk'), false);
        $('#dlgOk').querySelector('.txt').textContent = '确认发布';
        var c = d.code || '';
        if (c === 'BAD_TOKEN' || c === 'NO_TOKEN' || c === 'DISABLED' || c === 'NO_PROFILE') {
          closePublish();
          return reauth();
        }

        /* 把真实原因摊出来：HTTP 404 基本都是 publish 函数还没部署 */
        var why;
        if (res.http === 404 || c === 'NOT_FOUND') {
          why = '发布服务不存在（HTTP 404）：publish 函数还没部署到 Supabase';
        } else if (res.http === 0) {
          why = '网络中断，发布没有完成';
        } else if (!d.error) {
          why = '发布失败：HTTP ' + res.http + (d.message ? ' · ' + d.message : '');
        } else {
          why = d.error + (c ? '（' + c + '）' : '');
        }
        showDlgErr(why + ' · 你的草稿没有被改动，可以重试');
        return SR.ui.toast(why, 'bad');
      }
      closePublish();
      SR.ui.toast('已发布 v' + d.version + ' · ' + d.staff + ' 人可见', 'good');
      load(S.week);
    }).catch(function (e) {
      S.busy = false;
      SR.ui.setLoading($('#dlgOk'), false);
      $('#dlgOk').querySelector('.txt').textContent = '确认发布';
      showDlgErr('发布请求失败：' + String(e && e.message ? e.message : e) + ' · 草稿没有被改动');
      SR.ui.toast('网络异常，发布没有完成', 'bad');
    });
  });

  /* ---------------- 启动 ---------------- */
  (function init() {
    var rb = $('#roleBadge');
    rb.textContent = ME.role === 'manager' ? '排班经理' : '只读';
    rb.className = 'badge ' + (ME.role === 'manager' ? 'ok' : 'warn');

    $('#hint').innerHTML = S.readonly
      ? '只读账号：可以查看全部班表，但不能修改或发布。'
      : '改动会自动保存为草稿（员工看不到）；「生成本周」按算法排一周草稿，点「发布本周」后员工端才会显示。';

    setGenBusy(false);   /* 只读账号在这里被禁用 */

    load(ymd(mondayOf(new Date())));
  })();
})();
</script>
</body>
</html>
