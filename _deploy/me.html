<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="color-scheme" content="light dark">
<title>我的班表 · 智能排班</title>
<link rel="stylesheet" href="ui.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231d1d1f'/><text x='50' y='66' font-size='46' font-family='system-ui' font-weight='700' text-anchor='middle' fill='%23fff'>SR</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand-inline" href="me.html">
      <span class="logo sm">SR</span><b>我的班表</b>
    </a>
    <span class="sep"></span>
    <span class="badge info" id="meBadge">—</span>
    <button class="btn plain sm" id="logout" type="button">退出</button>
  </div>
</header>

<main class="wrap wb">

  <div class="wb-head">
    <div class="weeknav">
      <button class="btn ghost sm" id="prev" type="button" aria-label="上一周">‹</button>
      <span class="range" id="range">—</span>
      <button class="btn ghost sm" id="next" type="button" aria-label="下一周">›</button>
      <button class="btn plain sm" id="today" type="button">本周</button>
    </div>
    <span class="badge info" id="pubBadge">载入中…</span>
    <span class="sep"></span>
    <button class="btn ghost sm" id="reload" type="button">刷新</button>
  </div>

  <div id="body">
    <div class="skeleton">正在载入班表…</div>
  </div>

  <p class="hint" id="hint">
    这里只显示经理已经发布的班表。经理改草稿不会影响你看到的这一份。
  </p>
</main>

<script src="auth-core.js"></script>
<script>
(function () {
  'use strict';

  var $ = SR.$;
  var session = SR.session.get();
  if (!session || !session.access_token) {
    location.replace('login.html');
    return;
  }

  var TOKEN = session.access_token;
  var ME = {
    username: session.username || '',
    name: session.display_name || session.username || '',
    role: session.role || 'employee'
  };

  if (ME.role !== 'employee') {
    document.body.innerHTML =
      '<main class="page"><section class="card auth" style="max-width:420px">' +
      '<h2 class="h2">这是员工端</h2>' +
      '<p class="sub">你的账号是' + (ME.role === 'viewer' ? '只读账号' : '排班经理') +
      '，请到工作台查看全员班表。</p>' +
      '<div class="acts"><a class="btn primary block" href="manager.html">进入排班工作台</a>' +
      '<button class="btn ghost block" type="button" onclick="location.replace(\'login.html\')">切换账号</button></div>' +
      '</section></main>';
    return;
  }

  var DAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  var SLOT_LABEL = { early: '早班', mid: '中班', night: '晚班', rest: '休息' };
  var SLOT_CLASS = { early: 's-early', mid: 's-mid', night: 's-night', rest: 's-rest' };
  var ROLE_LABEL = { open: '开店', close: '闭店' };

  var S = {
    week: '',
    rows: [],          /* 该周自己那一份快照 */
    pubs: [],          /* 自己的投递记录，用来判断哪个 publish_id 最新 */
    rank: {},          /* publish_id -> 投递序号（越大越新） */
    meta: {},          /* publish_id -> {status, seen_at}（用来显示「已知晓」） */
    cur: '',           /* 当前正在展示的 publish_id */
    busy: false
  };

  /* ---------------- 日期 ---------------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseYmd(s) {
    var p = String(s).split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }
  function mondayOf(d) {
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var dow = t.getDay();
    t.setDate(t.getDate() + (dow === 0 ? -6 : 1 - dow));
    return t;
  }
  function addDays(d, n) {
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    t.setDate(t.getDate() + n);
    return t;
  }
  function rangeText(week) {
    var a = parseYmd(week), b = addDays(a, 6);
    return a.getFullYear() + '/' + pad(a.getMonth() + 1) + '/' + pad(a.getDate()) +
      ' – ' + pad(b.getMonth() + 1) + '/' + pad(b.getDate());
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function reauth() {
    SR.session.clear();
    SR.ui.toast('登录状态已失效，正在返回登录页…', 'bad');
    setTimeout(function () { location.replace('login.html'); }, 900);
  }

  function setBadge(text, kind) {
    var b = $('#pubBadge');
    b.className = 'badge ' + kind;
    b.textContent = text;
  }

  /* ---------------- 载入 ---------------- */
  /* 为什么分两次查：
       员工端只被 RLS 允许读「自己那一行」published_shifts 和「自己那条」publish_deliveries，
       publish_versions（版本号 / 发布时间）对员工不可见。
       投递表 id 是 identity 自增，天然按发布时间递增，
       所以用「投递 id 最大的 publish_id」来认定该周的最新一版。 */
  function load(week) {
    S.week = week;
    $('#range').textContent = rangeText(week);
    $('#body').innerHTML = '<div class="skeleton">正在载入 ' + esc(rangeText(week)) + ' 的班表…</div>';
    setBadge('载入中…', 'info');

    return Promise.all([
      SR.db.select('published_shifts',
        'week_key=eq.' + week + '&select=publish_id,day,slot,role'),
      SR.db.select('publish_deliveries',
        'select=id,publish_id,status,seen_at&order=id.desc&limit=500')
    ]).then(function (r) {
      var sh = r[0], dl = r[1];
      if (sh.http === 401 || dl.http === 401) { reauth(); return; }

      if (!sh.ok) { fail(sh.error || '班表读取失败'); return; }

      S.pubs = (dl.ok && dl.data) ? dl.data : [];
      S.rank = {};
      S.meta = {};
      S.pubs.forEach(function (p, i) {
        /* order=id.desc，越靠前越新；用「倒序名次」当排序权重 */
        S.rank[p.publish_id] = S.pubs.length - i;
        /* status / seen_at 顺便记住：seen = 我已经点过「已知晓」 */
        S.meta[p.publish_id] = { status: p.status || '', seen_at: p.seen_at || null };
      });

      /* 同一周若发布过多次，只保留最新一版 */
      var all = (sh.data || []).filter(function (x) { return x.publish_id; });
      var best = '';
      all.forEach(function (x) {
        var w = S.rank[x.publish_id] || 0;
        if (!best || w > (S.rank[best] || 0)) best = x.publish_id;
      });
      S.cur = best;
      S.rows = best ? all.filter(function (x) { return x.publish_id === best; }) : [];

      render();
    }).catch(function (e) {
      fail(String(e && e.message ? e.message : e));
    });
  }

  function fail(msg) {
    setBadge('读取失败', 'bad');
    $('#body').innerHTML =
      '<div class="emptyblock"><div class="empty"><b>班表没载入成功</b>' + esc(msg) +
      '<div class="acts" style="max-width:200px;margin:16px auto 0">' +
      '<button class="btn ghost block" type="button" onclick="location.reload()">重新加载</button></div></div></div>';
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    var byDay = {};
    S.rows.forEach(function (r) { byDay[r.day] = r; });

    if (!S.rows.length) {
      setBadge('未发布', 'info');
      $('#body').innerHTML =
        '<div class="emptyblock"><div class="empty"><b>这一周还没有发布班表</b>' +
        '如果经理说已经发了，可能是这个账号还没绑定员工档案，联系经理确认一下。' +
        '<div class="acts" style="max-width:220px;margin:16px auto 0">' +
        '<button class="btn ghost block" type="button" id="backWeek">回到本周</button></div></div></div>';
      var bw = $('#backWeek');
      if (bw) bw.addEventListener('click', function () { goWeek(0); });
      return;
    }

    setBadge('已发布', 'ok');

    var today = ymd(new Date());
    var working = 0, resting = 0;

    var h = '<div class="myweek">';
    for (var day = 0; day < 7; day++) {
      var d = addDays(parseYmd(S.week), day);
      var key = ymd(d);
      var cell = byDay[day] || null;
      var slot = cell && cell.slot ? cell.slot : '';
      if (slot && slot !== 'rest') working++;
      if (slot === 'rest') resting++;

      h += '<div class="dayrow' + (key === today ? ' today' : '') + '">' +
        '<div class="dw"><b>' + DAYS[day] + '</b><span>' + (d.getMonth() + 1) + '/' + d.getDate() +
        (key === today ? ' · 今天' : '') + '</span></div>' +
        '<div class="dshift">' +
        (slot
          ? '<span class="chip ' + SLOT_CLASS[slot] + '">' + SLOT_LABEL[slot] + '</span>'
          : '<span class="chip s-none">未排班</span>') +
        (cell && cell.role && ROLE_LABEL[cell.role]
          ? '<span class="role-tag">' + ROLE_LABEL[cell.role] + '</span>' : '') +
        '</div></div>';
    }

    h += '<div class="myweek-sum">' +
      '<span>本周上班 <b>' + working + '</b> 天</span>' +
      '<span>休息 <b>' + resting + '</b> 天</span>' +
      '<span>未排 <b>' + (7 - S.rows.length) + '</b> 天</span>' +
      '</div></div>';

    h += ackHtml();
    h += calCardHtml();

    $('#body').innerHTML = h;

    var ab = $('#ackBtn');
    if (ab) ab.addEventListener('click', ack);
    var cs = $('#calShare');
    if (cs) cs.addEventListener('click', exportCalendar);
    var cv = $('#calSave');
    if (cv) cv.addEventListener('click', saveCalendar);
    var cc = $('#calCopy');
    if (cc) cc.addEventListener('click', copyCalendar);
  }

  /* ============================================================
     导入到手机日历（.ics）
     ------------------------------------------------------------
     店里现行班次时间：
       早班 09:30–18:30 · 中班 12:00–21:00
       晚一 13:00–22:00 · 晚二 13:30–22:30
     周五、周六的晚班按「晚二」，其余日子按「晚一」（库里只有 night 一个值，
     所以这条规则放在导出时判，不改数据模型）。
     跨平台只靠一份 .ics：iOS / 鸿蒙 / 安卓都能「点开即导入」。
     ⚠ CAL-BLOCK 里必须是纯函数（不碰 DOM / 网络），
       tools/test_me_calendar.mjs 会原样抽出来跑单测。
     ============================================================ */
  /* ===== CAL-BLOCK-START ===== */
  var CAL_TIMES = {
    early:  { label: '早班',   start: '09:30', end: '18:30' },
    mid:    { label: '中班',   start: '12:00', end: '21:00' },
    night:  { label: '晚一班', start: '13:00', end: '22:00' },
    night2: { label: '晚二班', start: '13:30', end: '22:30' }
  };
  var CAL_DAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  var CAL_TZ_OFFSET = 8;   /* 深圳固定 UTC+8（无夏令时）：ics 里直接写 UTC，不依赖时区库 */

  function cal2(n) { return (n < 10 ? '0' : '') + n; }

  /* 周五(day 4)、周六(day 5) 的晚班 = 晚二，其余日子 = 晚一 */
  function calShift(slot, day) {
    if (!slot || slot === 'rest') return null;
    if (slot === 'night') {
      var d = Number(day);
      return (d === 4 || d === 5) ? CAL_TIMES.night2 : CAL_TIMES.night;
    }
    return CAL_TIMES[slot] || null;
  }

  /* 'YYYY-MM-DD' + 'HH:MM'（店里本地时间）→ ics 的 UTC 时刻 */
  function calStamp(dateStr, hhmm) {
    var p = String(dateStr).split('-').map(Number);
    var t = String(hhmm).split(':').map(Number);
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2], t[0] - CAL_TZ_OFFSET, t[1]));
    return '' + d.getUTCFullYear() + cal2(d.getUTCMonth() + 1) + cal2(d.getUTCDate()) +
      'T' + cal2(d.getUTCHours()) + cal2(d.getUTCMinutes()) + '00Z';
  }

  function calNow() {
    var d = new Date();
    return '' + d.getUTCFullYear() + cal2(d.getUTCMonth() + 1) + cal2(d.getUTCDate()) +
      'T' + cal2(d.getUTCHours()) + cal2(d.getUTCMinutes()) + cal2(d.getUTCSeconds()) + 'Z';
  }

  /* 周一日期 + 第几天 = 那天的 YYYY-MM-DD（用 UTC 算，躲开本机时区/夏令时） */
  function calDateOf(week, day) {
    var p = String(week).split('-').map(Number);
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + Number(day)));
    return d.getUTCFullYear() + '-' + cal2(d.getUTCMonth() + 1) + '-' + cal2(d.getUTCDate());
  }

  /* ics 规定每行 ≤75 字节；中文一字 3 字节，所以按字节折行（续行以空格开头） */
  function calBytes(s) {
    var n = 0;
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c < 0x80) n += 1;
      else if (c < 0x800) n += 2;
      else if (c < 0xd800 || c > 0xdfff) n += 3;
      else { n += 4; i++; }
    }
    return n;
  }

  function calFold(line) {
    if (calBytes(line) <= 73) return line;
    var out = [], cur = '', used = 0;
    for (var i = 0; i < line.length; i++) {
      var ch = line.charAt(i), w = calBytes(ch);
      if (used + w > 73) { out.push(cur); cur = ' '; used = 1; }
      cur += ch;
      used += w;
    }
    out.push(cur);
    return out.join('\r\n');
  }

  /* 这一周真正要进日历的班（休息 / 未排 / 未知班次都跳过） */
  function calItems(rows, week) {
    var list = [];
    (rows || []).forEach(function (r) {
      var day = Number(r && r.day);
      var t = calShift(r && r.slot, day);
      if (!t) return;
      var date = calDateOf(week, day);
      list.push({
        day: day, date: date, slot: r.slot,
        label: t.label, start: t.start, end: t.end,
        role: r.role || '',
        startAt: calStamp(date, t.start),
        endAt: calStamp(date, t.end)
      });
    });
    list.sort(function (a, b) { return a.day - b.day; });
    return list;
  }

  /* 一行预览文案：周一 10/26 早班 09:30–18:30 */
  function calLine(it) {
    return CAL_DAYS[it.day] + ' ' + it.date.slice(5).replace('-', '/') + ' ' +
      it.label + ' ' + it.start + '–' + it.end;
  }

  /* 复制用的纯文本（剪贴板 / 不支持导入时的兜底） */
  function plainCalendar(rows, week) {
    return calItems(rows, week).map(calLine).join('\n');
  }

  function icsName(week) { return 'roster-' + String(week) + '.ics'; }

  function buildIcs(rows, week, owner) {
    var items = calItems(rows, week);
    var who = String(owner || 'me').replace(/[^A-Za-z0-9_-]/g, '') || 'me';
    var stamp = calNow();
    var lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Smart Roster//Calendar Export//CN',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'X-WR-CALNAME:我的班表',
      'X-WR-TIMEZONE:Asia/Shanghai'
    ];
    items.forEach(function (it) {
      var desc = '我的班表 · ' + calLine(it) +
        (it.role === 'open' ? ' · 开店' : (it.role === 'close' ? ' · 闭店' : ''));
      lines.push('BEGIN:VEVENT');
      /* UID 稳定（同一个人 + 同一天 + 同一个班），重复导入不会变成两条 */
      lines.push('UID:' + who + '-' + it.date + '-' + it.day + '@smart-roster');
      lines.push('DTSTAMP:' + stamp);
      lines.push('DTSTART:' + it.startAt);
      lines.push('DTEND:' + it.endAt);
      lines.push('SUMMARY:' + it.label);
      lines.push('LOCATION:深圳卓悦中心');
      lines.push('DESCRIPTION:' + desc);
      lines.push('STATUS:CONFIRMED');
      lines.push('TRANSP:OPAQUE');
      lines.push('BEGIN:VALARM');
      lines.push('TRIGGER:-PT30M');
      lines.push('ACTION:DISPLAY');
      lines.push('DESCRIPTION:上班提醒');
      lines.push('END:VALARM');
      lines.push('END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    return lines.map(calFold).join('\r\n') + '\r\n';
  }
  /* ===== CAL-BLOCK-END ===== */

  function calCardHtml() {
    var items = calItems(S.rows, S.week);
    if (!items.length) return '';
    return '<div class="calbar" id="calBar">' +
      '<div class="cal-main"><b>导入到手机日历</b>' +
      '<span>iOS / 鸿蒙 / 安卓通用：点「导入到日历」，在系统面板里选「日历」；' +
      '面板里没有日历，就点「存成 .ics」再用文件/日历 App 打开。</span>' +
      '<div class="cal-list">' +
      items.map(function (it) { return '<span>' + esc(calLine(it)) + '</span>'; }).join('') +
      '</div></div>' +
      '<div class="cal-acts">' +
      '<button class="btn primary sm" id="calShare" type="button">导入到日历</button>' +
      '<button class="btn ghost sm" id="calSave" type="button">存成 .ics</button>' +
      '<button class="btn ghost sm" id="calCopy" type="button">复制日程</button>' +
      '</div></div>';
  }

  function calDownload(text, name) {
    try {
      var blob = new Blob([text], { type: 'text/calendar;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        try { URL.revokeObjectURL(url); a.remove(); } catch (e) {}
      }, 1500);
      return true;
    } catch (e) {
      return false;
    }
  }

  /* 直接把 .ics 存到手机（分享面板里没有「日历」时的稳妥路子） */
  function saveCalendar() {
    var items = calItems(S.rows, S.week);
    if (!items.length) { SR.ui.toast('这一周没有需要导入的班次', 'info'); return; }
    if (calDownload(buildIcs(S.rows, S.week, ME.username), icsName(S.week))) {
      SR.ui.toast('已存成 ' + icsName(S.week) + '：iPhone 到「文件」里点开，安卓/鸿蒙在下载里点开', 'info');
    } else {
      SR.ui.toast('这个浏览器不支持下载，试试「复制日程」手动加', 'bad');
    }
  }

  /* 主路径：系统分享面板（iOS / 鸿蒙 / 安卓都能把 .ics 交给「日历」App）
     分享不可用 → 下载 .ics → 再不行还有「复制日程」手动录入 */
  function exportCalendar() {
    var items = calItems(S.rows, S.week);
    if (!items.length) { SR.ui.toast('这一周没有需要导入的班次', 'info'); return; }

    var ics = buildIcs(S.rows, S.week, ME.username);
    var name = icsName(S.week);
    var file = null;
    try { file = new File([ics], name, { type: 'text/calendar' }); } catch (e) { file = null; }

    if (file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: '我的班表 ' + rangeText(S.week) })
        .then(function () {
          SR.ui.toast('已交给系统：在面板里选「日历」就加进去了', 'good');
        })
        .catch(function (err) {
          if (err && err.name === 'AbortError') return;
          if (calDownload(ics, name)) SR.ui.toast('已下载 .ics，点开它就能加入日历', 'info');
          else SR.ui.toast('这个浏览器不支持导入，试试「复制日程」', 'bad');
        });
      return;
    }

    if (calDownload(ics, name)) {
      SR.ui.toast('已下载 .ics：iPhone 到「文件」里点开，安卓/鸿蒙在下载通知里点开', 'info');
    } else {
      SR.ui.toast('这个浏览器不支持下载，试试「复制日程」手动加', 'bad');
    }
  }

  function legacyCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.setAttribute('readonly', '');
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      ta.remove();
      return !!ok;
    } catch (e) {
      return false;
    }
  }

  function copyCalendar() {
    var text = plainCalendar(S.rows, S.week);
    if (!text) { SR.ui.toast('这一周没有需要导入的班次', 'info'); return; }
    var done = function () { SR.ui.toast('已复制本周班次，粘贴到日历 App 的备注里即可', 'good'); };
    var bad = function () { SR.ui.toast('复制没成功，可以长按预览里的文字手动复制', 'bad'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () {
        if (legacyCopy(text)) done(); else bad();
      });
      return;
    }
    if (legacyCopy(text)) done(); else bad();
  }

  /* ---------------- 已知晓回执 ---------------- */
  function fmtSeen(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function ackHtml() {
    var m = S.meta[S.cur] || {};
    if (m.status === 'seen') {
      return '<div class="ackbar done">' +
        '<span class="ack-text"><b>✓ 已确认知晓</b> · ' + esc(fmtSeen(m.seen_at)) +
        '，经理端能看到这条记录</span></div>';
    }
    return '<div class="ackbar">' +
      '<span class="ack-text">看完点右边确认一下，经理那边就能看到你已知晓。</span>' +
      '<button class="btn primary sm" id="ackBtn" type="button">我已看过，确认知晓</button></div>';
  }

  function ack() {
    if (S.busy || !S.cur) return;
    var btn = $('#ackBtn');
    S.busy = true;
    SR.ui.setLoading(btn, true);

    /* auth: 让请求带上 Authorization —— ack 函数在 Supabase 侧保留了「Verify JWT」，
       不带这个头网关会先返回 401，函数体（含 whoami）根本不会执行。 */
    SR.api.call('ack', {
      method: 'POST',
      auth: TOKEN,
      body: { token: TOKEN, publish_id: S.cur }
    })
      .then(function (res) {
        S.busy = false;
        SR.ui.setLoading(btn, false);
        if (res.http === 401) { reauth(); return; }

        var d = res.data || {};
        if (!d.ok) {
          SR.ui.toast(d.error || '确认没记上，请稍后再试', 'bad');
          return;
        }
        S.meta[S.cur] = { status: 'seen', seen_at: d.seen_at || new Date().toISOString() };
        SR.ui.toast(d.already ? '这一版你已经确认过了' : '已记下你的确认', 'good');
        render();
      })
      .catch(function () {
        S.busy = false;
        SR.ui.setLoading(btn, false);
        SR.ui.toast('网络不太顺，请再点一次', 'bad');
      });
  }

  /* ---------------- 周切换 ---------------- */
  function goWeek(delta) {
    var base = mondayOf(new Date());
    var target = delta === 0 ? base : addDays(parseYmd(S.week), delta * 7);
    if (ymd(target) === S.week) return;
    load(ymd(target));
  }

  $('#prev').addEventListener('click', function () { goWeek(-1); });
  $('#next').addEventListener('click', function () { goWeek(1); });
  $('#today').addEventListener('click', function () { goWeek(0); });
  $('#reload').addEventListener('click', function () { load(S.week); });

  $('#logout').addEventListener('click', function () {
    SR.session.clear();
    location.replace('login.html');
  });

  /* ---------------- 启动 ---------------- */
  (function init() {
    var b = $('#meBadge');
    b.className = 'badge ok';
    b.textContent = ME.name;
    load(ymd(mondayOf(new Date())));
  })();
})();
</script>
</body>
</html>
