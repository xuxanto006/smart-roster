<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="color-scheme" content="light dark">
<title>账号中心 · 智能排班</title>
<link rel="stylesheet" href="ui.css">
<style>
  /* 人员页专用：弹层放宽一点、字段两列排（.sheet 默认 400px 装不下六个字段）*/
  #stDlg .sheet, #bdDlg .sheet { max-width: 520px; max-height: 88vh; overflow: auto; }
  .form2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231d1d1f'/><text x='50' y='66' font-size='46' font-family='system-ui' font-weight='700' text-anchor='middle' fill='%23fff'>SR</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="logo" style="width:28px;height:28px;border-radius:8px;font-size:11px">SR</div>
    <b style="font-size:14px">账号中心</b>
    <span class="sep"></span>
    <span class="badge info" id="meBadge">…</span>
    <a class="btn plain sm" href="manager.html">工作台</a>
    <button class="btn plain sm" id="logout" type="button">退出</button>
  </div>
</header>

<main class="wrap" style="padding-top:26px;padding-bottom:60px">

  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px">
    <h2 class="h2" style="flex:1 1 auto">账号与权限</h2>
    <div class="seg" id="tabs">
      <button type="button" data-tab="review" class="on">待审核 <span id="nReview"></span></button>
      <button type="button" data-tab="staff">人员 <span id="nStaff"></span></button>
      <button type="button" data-tab="invites">邀请码</button>
      <button type="button" data-tab="accounts">账号</button>
      <button type="button" data-tab="devices">设备</button>
    </div>
  </div>

  <!-- ================= 审核 ================= -->
  <section class="tabpane show" id="tab-review">
    <div class="stats" id="rvStats"></div>
    <p class="hint" style="margin:18px 0 0">
      通过时请把账号绑到员工名单里的姓名上，否则该员工登录后看不到自己的班表。
    </p>
    <div id="rvList" style="margin-top:12px"><div class="skeleton">载入中…</div></div>
  </section>

  <!-- ================= 人员 ================= -->
  <section class="tabpane" id="tab-staff">
    <div class="stats" id="stStats"></div>
    <div class="filters">
      <input class="search" id="stSearch" placeholder="搜索姓名 / 模块 / 岗位">
      <select class="select" id="stDomain"></select>
      <select class="select" id="stActive">
        <option value="">在职 + 离职</option>
        <option value="1">只看在职</option>
        <option value="0">只看离职</option>
      </select>
      <button class="btn primary sm" id="stNew" type="button">新增员工</button>
    </div>
    <p class="hint" style="margin:0 0 12px">
      姓名是账号绑定的键，<b>建好之后不能改</b>——班表、请假申请、已发布记录都按姓名挂靠。要改名请新增一条，再把账号换绑过去。
    </p>
    <div id="stList"><div class="skeleton">载入中…</div></div>
  </section>

  <!-- ================= 邀请码 ================= -->
  <section class="tabpane" id="tab-invites">
    <div class="card pad" style="margin-bottom:16px">
      <h3 style="margin:0 0 14px;font-size:15px;font-weight:600">新建邀请码</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px">
        <div class="field">
          <label for="ivMax">可用次数</label>
          <input class="input" id="ivMax" type="number" min="1" max="500" value="1">
        </div>
        <div class="field">
          <label for="ivStart">生效时间（空=立即）</label>
          <input class="input" id="ivStart" type="datetime-local">
        </div>
        <div class="field">
          <label for="ivEnd">失效时间（空=永久）</label>
          <input class="input" id="ivEnd" type="datetime-local">
        </div>
        <div class="field">
          <label for="ivNote">备注</label>
          <input class="input" id="ivNote" maxlength="100" placeholder="例如 10 月新员工">
        </div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap">
        <button class="btn primary" id="ivCreate" type="button">
          <span class="spin"></span><span class="txt">生成邀请码</span>
        </button>
        <span class="hint" id="ivResult" style="margin:0"></span>
      </div>
    </div>
    <div id="ivStats" class="stats" style="margin-bottom:16px"></div>
    <div id="ivList"><div class="skeleton">载入中…</div></div>
  </section>

  <!-- ================= 账号 ================= -->
  <section class="tabpane" id="tab-accounts">
    <div class="stats" id="acStats"></div>
    <div class="filters">
      <input class="search" id="acSearch" placeholder="搜索账号名 / 姓名">
      <select class="select" id="acStatus">
        <option value="">全部状态</option>
        <option value="active">在用</option>
        <option value="disabled">已停用</option>
        <option value="pending">待审核</option>
        <option value="rejected">已拒绝</option>
      </select>
    </div>
    <div id="acList"><div class="skeleton">载入中…</div></div>
  </section>

  <!-- ================= 设备 ================= -->
  <section class="tabpane" id="tab-devices">
    <p class="hint" style="margin:0 0 14px">
      设备标识来自浏览器本机存储，<b>不是硬件指纹</b>；清缓存会变成一台「新设备」。它的用途是封掉已确认的设备并留痕。
    </p>
    <div class="stats" id="dvStats"></div>
    <div class="filters">
      <input class="search" id="dvSearch" placeholder="搜索设备标识 / 账号名">
    </div>
    <div id="dvList" style="margin-bottom:20px"><div class="skeleton">载入中…</div></div>
    <h3 class="section-title" style="margin:0 0 10px">黑名单</h3>
    <div id="dvBans"><div class="skeleton">载入中…</div></div>
  </section>

</main>

<!-- 确认弹层 -->
<div class="overlay" id="ov">
  <div class="sheet">
    <h3 id="ovTitle">确认操作</h3>
    <p class="sub" id="ovDesc"></p>
    <div class="field" id="ovField" style="display:none">
      <label id="ovLabel" for="ovInput">原因</label>
      <input class="input" id="ovInput" maxlength="100" placeholder="选填">
    </div>
    <div class="acts">
      <div class="row-btns">
        <button class="btn ghost block" id="ovNo" type="button">取消</button>
        <button class="btn primary block" id="ovYes" type="button">确定</button>
      </div>
    </div>
  </div>
</div>

<!-- 人员编辑弹层 -->
<div class="overlay" id="stDlg">
  <div class="sheet">
    <h3 id="stTitle">新增员工</h3>
    <p class="sub" id="stSub">姓名要和员工名单里的写法一致，建好后不可修改。</p>
    <div class="form2">
      <div class="field">
        <label for="stName">姓名</label>
        <input class="input" id="stName" maxlength="40" placeholder="例如 谢佳委">
      </div>
      <div class="field">
        <label for="stDomainSel">部门</label>
        <select class="select" id="stDomainSel"></select>
      </div>
      <div class="field">
        <label for="stModule">模块</label>
        <input class="input" id="stModule" maxlength="40" placeholder="例如 前台">
      </div>
      <div class="field">
        <label for="stPos">岗位</label>
        <input class="input" id="stPos" maxlength="40" placeholder="例如 销售顾问">
      </div>
      <div class="field">
        <label for="stLevel">职级</label>
        <input class="input" id="stLevel" maxlength="20" placeholder="员工">
      </div>
      <div class="field">
        <label for="stJoined">入职日期</label>
        <input class="input" id="stJoined" type="date">
      </div>
    </div>
    <div class="field" style="margin-top:12px">
      <label for="stNote">备注</label>
      <input class="input" id="stNote" maxlength="200" placeholder="选填">
    </div>
    <div class="dlg-err" id="stErr"></div>
    <div class="acts">
      <div class="row-btns">
        <button class="btn ghost block" id="stCancel" type="button">取消</button>
        <button class="btn primary block" id="stSave" type="button">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- 绑定账号弹层 -->
<div class="overlay" id="bdDlg">
  <div class="sheet">
    <h3 id="bdTitle">绑定账号</h3>
    <p class="sub" id="bdSub"></p>
    <div class="field">
      <label for="bdAcct">选一个账号</label>
      <select class="select" id="bdAcct"></select>
    </div>
    <div class="field" style="margin-top:12px">
      <label for="bdRole">角色</label>
      <select class="select" id="bdRole">
        <option value="employee">员工（能看自己的班表）</option>
        <option value="viewer">只读（只能进工作台看）</option>
        <option value="manager">排班经理</option>
      </select>
    </div>
    <p class="hint" id="bdHint" style="margin:12px 0 0"></p>
    <div class="dlg-err" id="bdErr"></div>
    <div class="acts">
      <div class="row-btns">
        <button class="btn ghost block" id="bdCancel" type="button">取消</button>
        <button class="btn primary block" id="bdSave" type="button">确定</button>
      </div>
    </div>
  </div>
</div>

<script src="auth-core.js"></script>
<script>
(function () {
  'use strict';
  var $ = SR.$;

  /* ================= 身份校验 ================= */
  var session = SR.session.get();
  if (!session || !session.access_token) {
    location.replace('login.html');
    return;
  }
  if (session.role !== 'manager') {
    document.querySelector('main').innerHTML =
      '<div class="card pad" style="max-width:460px;margin:40px auto;text-align:center">' +
      '<h2 class="h2">没有访问权限</h2>' +
      '<p class="sub" style="margin:8px 0 20px">账号中心只对排班经理开放。</p>' +
      '<a class="btn primary block" href="manager.html">返回工作台</a></div>';
    return;
  }

  var TOKEN = session.access_token;
  $('#meBadge').textContent = (session.display_name || session.username) + ' · 排班经理';

  /* ================= 工具 ================= */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtTime(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    var now = Date.now();
    var diff = now - d.getTime();
    if (diff >= 0 && diff < 86400000) {
      var h = Math.floor(diff / 3600000);
      if (h < 1) return Math.max(1, Math.floor(diff / 60000)) + ' 分钟前';
      return h + ' 小时前';
    }
    return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  function shortHash(h) {
    if (!h) return '—';
    return h.length > 16 ? h.slice(0, 6) + '…' + h.slice(-6) : h;
  }

  function roleText(r) {
    return r === 'manager' ? '排班经理' : (r === 'viewer' ? '只读' : '员工');
  }

  function statusBadge(s) {
    if (s === 'active') return '<span class="badge ok">在用</span>';
    if (s === 'pending') return '<span class="badge warn">待审核</span>';
    if (s === 'disabled') return '<span class="badge bad">已停用</span>';
    if (s === 'rejected') return '<span class="badge">已拒绝</span>';
    return '<span class="badge">' + esc(s) + '</span>';
  }

  function inviteBadge(s) {
    if (s === 'active') return '<span class="badge ok">可用</span>';
    if (s === 'not_started') return '<span class="badge info">未生效</span>';
    if (s === 'expired') return '<span class="badge">已过期</span>';
    if (s === 'exhausted') return '<span class="badge warn">已用完</span>';
    if (s === 'disabled') return '<span class="badge bad">已停用</span>';
    return '<span class="badge">' + esc(s) + '</span>';
  }

  /* ================= 网络 ================= */
  function api(fn, body) {
    var payload = { token: TOKEN };
    for (var k in body) if (Object.prototype.hasOwnProperty.call(body, k)) payload[k] = body[k];
    return SR.api.call(fn, { method: 'POST', body: payload }).then(function (res) {
      var d = res.data || {};
      if (!d.ok) {
        var c = d.code || '';
        if (c === 'BAD_TOKEN' || c === 'NO_TOKEN' || c === 'DISABLED' || c === 'NO_PROFILE') {
          SR.ui.toast(d.error || '登录已失效，请重新登录', 'bad');
          SR.session.clear();
          setTimeout(function () { location.replace('login.html'); }, 1200);
        }
        throw d;
      }
      return d;
    });
  }

  function failToast(e) {
    SR.ui.toast((e && (e.error || e.code)) || '操作失败，请重试', 'bad');
  }

  /* ================= 弹层 ================= */
  var ov = $('#ov'), ovResolve = null;

  function ask(opt) {
    $('#ovTitle').textContent = opt.title || '确认操作';
    $('#ovDesc').textContent = opt.desc || '';
    $('#ovYes').textContent = opt.okText || '确定';
    $('#ovYes').className = 'btn block ' + (opt.danger ? 'danger' : 'primary');
    var field = $('#ovField');
    if (opt.label) {
      field.style.display = '';
      $('#ovLabel').textContent = opt.label;
      $('#ovInput').value = opt.value || '';
      $('#ovInput').placeholder = opt.placeholder || '选填';
    } else {
      field.style.display = 'none';
    }
    ov.classList.add('show');
    return new Promise(function (resolve) {
      ovResolve = resolve;
      setTimeout(function () {
        if (opt.label) $('#ovInput').focus();
        else $('#ovYes').focus();
      }, 60);
    });
  }

  function closeAsk(val) {
    ov.classList.remove('show');
    var r = ovResolve;
    ovResolve = null;
    if (r) r(val);
  }

  $('#ovNo').addEventListener('click', function () { closeAsk(null); });
  $('#ovYes').addEventListener('click', function () {
    var field = $('#ovField');
    var val = field.style.display === 'none' ? '' : $('#ovInput').value.trim();
    closeAsk({ ok: true, value: val });
  });
  ov.addEventListener('click', function (e) { if (e.target === ov) closeAsk(null); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && ov.classList.contains('show')) closeAsk(null);
    if (e.key === 'Enter' && ov.classList.contains('show') && $('#ovField').style.display !== 'none') {
      e.preventDefault();
      $('#ovYes').click();
    }
  });

  /* ================= 页签 ================= */
  var current = 'review';
  var loaded = {};

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (!b) return;
    var tab = b.getAttribute('data-tab');
    if (tab === current) return;
    current = tab;
    SR.$$('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    ['review', 'staff', 'invites', 'accounts', 'devices'].forEach(function (t) {
      $('#tab-' + t).classList.toggle('show', t === tab);
    });
    reload(tab);
  });

  function reload(tab) {
    if (tab === 'review') return loadReview();
    if (tab === 'staff') return loadStaff();
    if (tab === 'invites') return loadInvites();
    if (tab === 'accounts') return loadAccounts();
    if (tab === 'devices') return loadDevices();
  }

  /* ================= 审核 ================= */
  var RV = { pending: [], staff: [], counts: {} };

  function loadReview(silent) {
    if (!silent) $('#rvList').innerHTML = '<div class="skeleton">载入中…</div>';
    return api('review', { action: 'list' }).then(function (d) {
      RV = d;
      loaded.review = true;
      $('#nReview').textContent = d.counts.pending ? String(d.counts.pending) : '';
      $('#rvStats').innerHTML = [
        ['待审核', d.counts.pending, d.counts.pending ? 'warn' : ''],
        ['在用账号', d.counts.active, ''],
        ['已停用', d.counts.disabled, ''],
        ['已拒绝', d.counts.rejected, '']
      ].map(function (x) {
        return '<div class="stat"><div class="n">' + x[1] + '</div><div class="k">' + esc(x[0]) + '</div></div>';
      }).join('');
      renderReview();
    }).catch(function (e) {
      $('#rvList').innerHTML = '<div class="empty"><b>载入失败</b>' + esc(e.error || '请稍后重试') + '</div>';
    });
  }

  function staffOptions(cur) {
    var opts = ['<option value="">— 不绑定员工 —</option>'];
    var taken = {};
    (RV.staff || []).forEach(function (s) { if (s.taken_by) taken[s.name] = s.taken_by; });
    (RV.staff || []).forEach(function (s) {
      var by = taken[s.name];
      var label = s.name + (s.position ? ' · ' + s.position : '') + (by ? '（已绑定 ' + by + '）' : '');
      opts.push('<option value="' + esc(s.name) + '"' + (s.name === cur ? ' selected' : '') + (by && s.name !== cur ? ' disabled' : '') + '>' + esc(label) + '</option>');
    });
    return opts.join('');
  }

  function renderReview() {
    var list = RV.pending || [];
    if (!list.length) {
      $('#rvList').innerHTML = '<div class="list"><div class="empty"><b>没有待审核的申请</b>有人注册后会出现在这里</div></div>';
      return;
    }
    var html = '<div class="list">';
    list.forEach(function (p) {
      var warn = p.staff_taken_by
        ? '<span class="badge bad">姓名已被 ' + esc(p.staff_taken_by) + ' 占用</span>'
        : '';
      html += '<div class="row" data-id="' + esc(p.id) + '">' +
        '<div class="grow">' +
          '<div class="name">' + esc(p.display_name || p.username) + ' ' +
            '<span class="badge">' + esc(p.username) + '</span> ' + warn + '</div>' +
          '<div class="meta">' +
            '<span>提交 ' + esc(fmtTime(p.created_at)) + '</span>' +
            '<span>申请姓名 ' + esc(p.staff_name || '未填') + '</span>' +
            (p.apply_note ? '<span>备注 ' + esc(p.apply_note) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="actions">' +
          '<select class="select" data-role>' +
            '<option value="employee">员工</option>' +
            '<option value="viewer">只读</option>' +
            '<option value="manager">排班经理</option>' +
          '</select>' +
          '<select class="select" data-staff>' + staffOptions(p.staff_name || '') + '</select>' +
          '<button class="btn primary sm" type="button" data-act="approve">通过</button>' +
          '<button class="btn ghost sm" type="button" data-act="reject">拒绝</button>' +
          '<button class="btn danger sm" type="button" data-act="purge">删除</button>' +
        '</div>' +
      '</div>';
    });
    html += '</div>';
    $('#rvList').innerHTML = html;
  }

  $('#rvList').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-act]');
    if (!b) return;
    var row = b.closest('.row');
    var id = row.getAttribute('data-id');
    var act = b.getAttribute('data-act');
    var role = row.querySelector('[data-role]').value;
    var staff = row.querySelector('[data-staff]').value;

    if (act === 'approve') {
      if (role === 'employee' && !staff) {
        SR.ui.toast('员工账号必须绑定员工姓名', 'bad');
        row.querySelector('[data-staff]').focus();
        return;
      }
      b.disabled = true;
      api('review', { action: 'approve', id: id, role: role, staff_name: staff || undefined })
        .then(function (d) {
          SR.ui.toast('已通过：' + d.username, 'good');
          loadReview(true);
        })
        .catch(function (err) { b.disabled = false; failToast(err); });
      return;
    }

    if (act === 'reject') {
      ask({ title: '拒绝这个申请？', desc: '对方登录时会看到「注册申请未通过」，之后仍可被删除。', label: '理由（会显示给对方）', danger: true, okText: '确认拒绝' })
        .then(function (r) {
          if (!r) return;
          return api('review', { action: 'reject', id: id, reason: r.value }).then(function () {
            SR.ui.toast('已拒绝', 'good');
            loadReview(true);
          }).catch(failToast);
        });
      return;
    }

    if (act === 'purge') {
      ask({ title: '彻底删除这个账号？', desc: '会同时删除登录账号，账号名随即释放，可被重新注册。此操作不可撤销。', danger: true, okText: '删除' })
        .then(function (r) {
          if (!r) return;
          return api('review', { action: 'purge', id: id }).then(function () {
            SR.ui.toast('已删除', 'good');
            loadReview(true);
          }).catch(failToast);
        });
    }
  });

  /* ================= 邀请码 ================= */
  function localToIso(v) {
    if (!v) return undefined;
    var d = new Date(v);
    return isNaN(d.getTime()) ? undefined : d.toISOString();
  }

  $('#ivCreate').addEventListener('click', function () {
    var btn = this;
    var body = {
      action: 'create',
      max_uses: Number($('#ivMax').value || 1),
      note: $('#ivNote').value.trim() || undefined,
      starts_at: localToIso($('#ivStart').value),
      ends_at: localToIso($('#ivEnd').value)
    };
    SR.ui.setLoading(btn, true);
    btn.querySelector('.txt').textContent = '生成中…';
    api('invites', body).then(function (d) {
      SR.ui.setLoading(btn, false);
      btn.querySelector('.txt').textContent = '生成邀请码';

  $('#ivList').addEventListener('click', function (e) {

        .then(function (r) {

  /* ================= 账号 ================= */
  var AC = { accounts: [], counts: {} };

  function loadAccounts(silent) {
    if (!silent) $('#acList').innerHTML = '<div class="skeleton">载入中…</div>';
    return api('offboard', { action: 'list' }).then(function (d) {
      AC = d;
      loaded.accounts = true;
      $('#acStats').innerHTML = [
        ['在用', d.counts.active],
        ['已停用', d.counts.disabled],
        ['待审核', d.counts.pending],
        ['封禁设备', d.banned_devices]
      ].map(function (x) {

      }).join('');
      renderAccounts();
    }).catch(function (e) {
      $('#acList').innerHTML = '<div class="empty"><b>载入失败</b>' + esc(e.error || '请稍后重试') + '</div>';

  function renderAccounts() {
    var q = $('#acSearch').value.trim().toLowerCase();
    var st = $('#acStatus').value;
    var list = (AC.accounts || []).filter(function (a) {
      if (st && a.status !== st) return false;
      if (!q) return true;
      return String(a.username).toLowerCase().indexOf(q) >= 0 ||
        String(a.display_name || '').toLowerCase().indexOf(q) >= 0 ||
        String(a.staff_name || '').indexOf(q) >= 0;
    });

    if (!list.length) {
      $('#acList').innerHTML = '<div class="list"><div class="empty"><b>没有匹配的账号</b>试试换个关键词或状态</div></div>';
      return;
    }

    var html = '<div class="list">';
    list.forEach(function (a) {
      var acts = '';
      if (a.status === 'disabled') {
        acts += '<button class="btn tint sm" type="button" data-act="reactivate">重新启用</button>';
      } else if (a.status === 'active' || a.status === 'rejected') {
        acts += '<button class="btn danger sm" type="button" data-act="offboard">停用</button>';
      }
      if (a.status !== 'active' && a.role !== 'manager') {
        acts += '<button class="btn ghost sm" type="button" data-act="purge">删除</button>';
      }
      html += '<div class="row" data-id="' + esc(a.id) + '">' +
        '<div class="grow">' +
          '<div class="name">' + esc(a.display_name || a.username) + ' ' +
            '<span class="badge">' + esc(a.username) + '</span> ' +
            statusBadge(a.status) +
            (a.is_self ? ' <span class="badge info">你自己</span>' : '') +
          '</div>' +
          '<div class="meta">' +
            '<span>' + esc(roleText(a.role)) + '</span>' +
            '<span>员工 ' + esc(a.staff_name || '未绑定') + '</span>' +
            '<span>设备 ' + a.device_total + '（在线 ' + a.device_live + '）</span>' +
            '<span>最后登录 ' + esc(fmtTime(a.last_login_at)) + '</span>' +
            (a.disabled_reason ? '<span>停用原因 ' + esc(a.disabled_reason) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="actions">' + acts + '</div>' +
      '</div>';
    });
    html += '</div>';
    $('#acList').innerHTML = html;

  $('#acSearch').addEventListener('input', renderAccounts);
  $('#acStatus').addEventListener('change', renderAccounts);

  $('#acList').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-act]');
    if (!b) return;
    var row = b.closest('.row');
    var id = row.getAttribute('data-id');
    var act = b.getAttribute('data-act');

    if (act === 'offboard') {
      ask({ title: '停用并封禁这个账号？', desc: '会立即吊销数据库访问权限、封禁其当前全部设备，并禁止再次登录。账号数据保留，可随时重新启用。', label: '停用原因', value: '离职', danger: true, okText: '停用并封禁' })
        .then(function (r) {
          if (!r) return;
          b.disabled = true;
          return api('offboard', { action: 'offboard', id: id, reason: r.value }).then(function (d) {
            SR.ui.toast('已停用，封禁设备 ' + (d.devices_banned || 0) + ' 台' + (d.auth_banned ? '' : '（Auth 封禁失败，请重试）'), d.auth_banned ? 'good' : 'bad');
            loadAccounts(true);
          }).catch(function (err) { b.disabled = false; failToast(err); });
        });
      return;
    }

    if (act === 'reactivate') {
      ask({ title: '重新启用这个账号？', desc: '会解除登录封禁；设备黑名单默认保留（永久封禁），需要时可到「设备」页手动解封。', okText: '启用', danger: false })
        .then(function (r) {
          if (!r) return;
          b.disabled = true;
          return api('offboard', { action: 'reactivate', id: id }).then(function (d) {
            SR.ui.toast('已启用' + (d.warning ? '：' + d.warning : ''), d.auth_unbanned ? 'good' : 'bad');
            loadAccounts(true);
          }).catch(function (err) { b.disabled = false; failToast(err); });
        });
      return;
    }

    if (act === 'purge') {
      ask({ title: '彻底删除这个账号？', desc: '登录账号一并删除，账号名随即释放。此操作不可撤销。', danger: true, okText: '删除' })
        .then(function (r) {
          if (!r) return;
          b.disabled = true;
          return api('review', { action: 'purge', id: id }).then(function () {
            SR.ui.toast('已删除', 'good');
            loadAccounts(true);
          }).catch(function (err) { b.disabled = false; failToast(err); });
        });
    }
  });

  /* ================= 人员 =================
     为什么读 staff 走 REST、绑账号走 review 函数：
       · staff 表的 RLS 已经给经理开了写权限（pol_staff_write → is_editor），
         加人/改资料/离职直接写表最省事；
       · profiles 前端一律不可写，绑定/换绑/解绑必须走 review（service_role）。
     姓名是绑定键且有唯一索引，所以编辑时姓名只读，不提供改名。 */
  /* ===== STAFFADMIN-BLOCK-START ===== */
  var DOMAINS = [
    ['3c', '3C'], ['hongmeng', '鸿蒙'], ['zunjie', '尊界'],
    ['aftersales', '售后'], ['kufang', '库房'], ['admin', '管理'], ['manager', '经理']
  ];

  function domainText(v) {
    for (var i = 0; i < DOMAINS.length; i++) if (DOMAINS[i][0] === v) return DOMAINS[i][1];
    return v || '未分部门';
  }

  /** 表单值 → 入库值：去空格、截长度、部门白名单、日期非法就置空 */
  function cleanStaffDraft(raw) {
    var r = raw || {};
    function t(v, max) { return String(v == null ? '' : v).trim().slice(0, max); }
    var domain = t(r.domain, 20);
    var hit = false;
    for (var i = 0; i < DOMAINS.length; i++) if (DOMAINS[i][0] === domain) hit = true;
    var joined = t(r.joined_at, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(joined)) joined = '';
    return {
      name: t(r.name, 40),
      module: t(r.module, 40),
      position: t(r.position, 40),
      level: t(r.level, 20) || '员工',
      domain: hit ? domain : '3c',
      joined_at: joined,
      note: t(r.note, 200)
    };
  }

  /** 新增前拦一下：空名 / 重名（重名是唯一索引报错，提前说人话） */
  function staffDraftError(d, opts) {
    var o = opts || {};
    if (!d.name) return '请填写姓名';
    if (o.isNew && (o.names || []).indexOf(d.name) >= 0) {
      return '员工名单里已经有「' + d.name + '」了，直接编辑那一条就行';
    }
    return '';
  }

  /** 解绑后角色怎么落：员工账号没有员工名就看不到自己的班表，一律降为只读 */
  function roleAfterUnbind(role) {
    return role === 'employee' ? 'viewer' : (role || 'employee');
  }

  /** 绑定计划：换账号要「先解绑旧的、再绑新的」；同一个人只改角色时一步就够。
      选「先不绑定」而原本绑着人时，就是解绑（等同于行内的解绑按钮）。 */
  function bindSteps(cur, acctId, role) {
    var c = cur || {};
    var steps = [];
    if (c.id && c.id !== acctId) {
      steps.push({ op: 'unbind', id: c.id, username: c.username || '' });
    }
    if (acctId) {
      steps.push({ op: 'bind', id: acctId, staff_name: c.staff_name || '', role: role || 'employee' });
    }
    return steps;
  }
  /* ===== STAFFADMIN-BLOCK-END ===== */

  var ST = { staff: [], accounts: [], editing: null, binding: null };

  function showErr(sel, msg) {
    var el = $(sel);
    el.textContent = msg || '';
    el.classList.toggle('show', !!msg);
  }

  function closeDlg(sel) {
    $(sel).classList.remove('show');
  }

  function dbErrText(res) {
    var t = String((res && (res.error || res.code)) || '');
    if (/duplicate|unique/i.test(t)) return '员工名单里已经有这个名字了';
    if (/does not exist|schema cache/i.test(t)) return '数据库里还没有 staff 表，请先执行 supabase/migrations/001_init.sql';
    if (/permission|policy|row-level/i.test(t)) return '没有写员工名单的权限（需要排班经理账号）';
    return t || '保存失败，请稍后重试';
  }

  function fillOptions(el, pairs, cur, first) {
    var html = first ? '<option value="">' + esc(first) + '</option>' : '';
    for (var i = 0; i < pairs.length; i++) {
      html += '<option value="' + esc(pairs[i][0]) + '"' + (pairs[i][0] === cur ? ' selected' : '') + '>' +
        esc(pairs[i][1]) + '</option>';
    }
    el.innerHTML = html;
  }

  function bindOf(name) {
    for (var i = 0; i < ST.accounts.length; i++) {
      if (ST.accounts[i].staff_name === name) return ST.accounts[i];
    }
    return null;
  }

  function findStaff(name) {
    for (var i = 0; i < ST.staff.length; i++) if (ST.staff[i].name === name) return ST.staff[i];
    return null;
  }

  function loadStaff(silent) {
    if (!silent) $('#stList').innerHTML = '<div class="skeleton">载入中…</div>';
    return Promise.all([
      SR.db.select('staff', 'select=name,module,position,level,domain,active,joined_at,left_at,note&order=active.desc,name.asc'),
      SR.db.select('profiles', 'select=id,username,display_name,role,status,staff_name&status=eq.active&order=username.asc')
    ]).then(function (res) {
      var sr = res[0], pr = res[1];
      if (!sr || !sr.ok) throw { error: (sr && sr.error) || '读不到员工名单（可能还没执行 001_init.sql）' };
      if (!pr || !pr.ok) throw { error: (pr && pr.error) || '读不到账号列表' };
      ST.staff = sr.data || [];
      ST.accounts = pr.data || [];
      loaded.staff = true;
      renderStaff();
    }).catch(function (e) {
      $('#stList').innerHTML = '<div class="empty"><b>载入失败</b>' + esc((e && e.error) || '请稍后重试') + '</div>';
    });
  }

  function renderStaff() {
    var q = $('#stSearch').value.trim().toLowerCase();
    var dom = $('#stDomain').value;
    var act = $('#stActive').value;

    var onDuty = 0, gone = 0, bound = 0, unbound = 0;
    (ST.staff || []).forEach(function (s) {
      if (s.active) {
        onDuty++;
        if (bindOf(s.name)) bound++; else unbound++;
      } else {
        gone++;
      }
    });
    $('#nStaff').textContent = unbound ? String(unbound) : '';
    $('#stStats').innerHTML = [
      ['在职', onDuty, ''],
      ['已离职', gone, ''],
      ['已绑账号', bound, 'ok'],
      ['在职未绑账号', unbound, unbound ? 'warn' : '']
    ].map(function (x) {
      return '<div class="stat"><div class="n">' + x[1] + '</div><div class="k">' + esc(x[0]) + '</div></div>';
    }).join('');

    var list = (ST.staff || []).filter(function (s) {
      if (dom && s.domain !== dom) return false;
      if (act === '1' && !s.active) return false;
      if (act === '0' && s.active) return false;
      if (!q) return true;
      return [s.name, s.module, s.position, s.level, s.note].join(' ').toLowerCase().indexOf(q) >= 0;
    });

    if (!list.length) {
      $('#stList').innerHTML = '<div class="list"><div class="empty"><b>没有匹配的员工</b>换个关键词，或点「新增员工」加一条</div></div>';
      return;
    }

    var html = '<div class="list">';
    list.forEach(function (s) {
      var acct = bindOf(s.name);
      var badges = '<span class="badge">' + esc(domainText(s.domain)) + '</span>';
      badges += s.active ? ' <span class="badge ok">在职</span>' : ' <span class="badge bad">已离职</span>';
      if (acct) badges += ' <span class="badge info">账号 ' + esc(acct.username) + '</span>';
      else if (s.active) badges += ' <span class="badge warn">未绑账号</span>';

      var meta = [];
      if (s.module) meta.push('<span>模块 ' + esc(s.module) + '</span>');
      if (s.position) meta.push('<span>岗位 ' + esc(s.position) + '</span>');
      if (s.level) meta.push('<span>职级 ' + esc(s.level) + '</span>');
      if (s.joined_at) meta.push('<span>入职 ' + esc(s.joined_at) + '</span>');
      if (s.left_at) meta.push('<span>离职 ' + esc(s.left_at) + '</span>');
      if (acct) meta.push('<span>角色 ' + esc(roleText(acct.role)) + '</span>');
      if (s.note) meta.push('<span>备注 ' + esc(s.note) + '</span>');

      var acts = '<button class="btn ghost sm" type="button" data-act="edit">编辑</button>';
      if (s.active) {
        acts += '<button class="btn tint sm" type="button" data-act="bind">' + (acct ? '换绑 / 改角色' : '绑定账号') + '</button>';
        if (acct) acts += '<button class="btn plain sm" type="button" data-act="unbind">解绑</button>';
        acts += '<button class="btn danger sm" type="button" data-act="leave">离职</button>';
      } else {
        acts += '<button class="btn tint sm" type="button" data-act="back">复职</button>';
      }

      html += '<div class="row" data-name="' + esc(s.name) + '">' +
        '<div class="grow">' +
          '<div class="name">' + esc(s.name) + ' ' + badges + '</div>' +
          '<div class="meta">' + meta.join('') + '</div>' +
        '</div>' +
        '<div class="actions">' + acts + '</div>' +
      '</div>';
    });
    html += '</div>';
    $('#stList').innerHTML = html;
  }

  $('#stSearch').addEventListener('input', renderStaff);
  $('#stDomain').addEventListener('change', renderStaff);
  $('#stActive').addEventListener('change', renderStaff);
  $('#stNew').addEventListener('click', function () { openStaffDlg(null); });

  $('#stList').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-act]');
    if (!b) return;
    var row = b.closest('.row');
    var s = findStaff(row.getAttribute('data-name'));
    if (!s) return;
    var act = b.getAttribute('data-act');
    if (act === 'edit') return openStaffDlg(s);
    if (act === 'bind') return openBindDlg(s, bindOf(s.name));
    if (act === 'unbind') return unbindStaff(s, bindOf(s.name), b);
    if (act === 'leave') return setStaffActive(s, false, b);
    if (act === 'back') return setStaffActive(s, true, b);
  });

  /* ---------------- 员工资料弹层 ---------------- */
  function openStaffDlg(s) {
    ST.editing = s || null;
    $('#stTitle').textContent = s ? '编辑 ' + s.name : '新增员工';
    $('#stSub').textContent = s
      ? '姓名是账号绑定的键，不能改；要改名请新增一条，再把账号换绑过去。'
      : '姓名要和员工名单里的写法一致，建好后不可修改。';
    $('#stName').value = s ? s.name : '';
    $('#stName').readOnly = !!s;
    $('#stModule').value = s ? (s.module || '') : '';
    $('#stPos').value = s ? (s.position || '') : '';
    $('#stLevel').value = s ? (s.level || '员工') : '员工';
    $('#stJoined').value = s && s.joined_at ? String(s.joined_at).slice(0, 10) : '';
    $('#stNote').value = s ? (s.note || '') : '';
    fillOptions($('#stDomainSel'), DOMAINS, s ? s.domain : '3c', '');
    showErr('#stErr', '');
    $('#stDlg').classList.add('show');
    setTimeout(function () { (s ? $('#stModule') : $('#stName')).focus(); }, 60);
  }

  $('#stCancel').addEventListener('click', function () { closeDlg('#stDlg'); });

  $('#stSave').addEventListener('click', function () {
    var btn = this;
    var s = ST.editing;
    var d = cleanStaffDraft({
      name: s ? s.name : $('#stName').value,
      domain: $('#stDomainSel').value,
      module: $('#stModule').value,
      position: $('#stPos').value,
      level: $('#stLevel').value,
      joined_at: $('#stJoined').value,
      note: $('#stNote').value
    });
    var err = staffDraftError(d, {
      isNew: !s,
      names: (ST.staff || []).map(function (x) { return x.name; })
    });
    if (err) { showErr('#stErr', err); return; }
    showErr('#stErr', '');
    SR.ui.setLoading(btn, true);

    var task;
    if (!s) {
      task = SR.db.insert('staff', {
        name: d.name,
        module: d.module,
        position: d.position,
        level: d.level,
        domain: d.domain,
        active: true,
        joined_at: d.joined_at || null,
        note: d.note || null
      });
    } else {
      // 注意：patch 里刻意不含 name —— 改名会级联改掉班表/申请/已发布记录，这里不给口子
      task = SR.db.patch('staff', 'name=eq.' + encodeURIComponent(s.name), {
        module: d.module,
        position: d.position,
        level: d.level,
        domain: d.domain,
        joined_at: d.joined_at || null,
        note: d.note || null
      });
    }

    task.then(function (res) {
      SR.ui.setLoading(btn, false);
      if (!res || !res.ok) { showErr('#stErr', dbErrText(res)); return; }
      closeDlg('#stDlg');
      SR.ui.toast(s ? '已保存' : '已新增 ' + d.name, 'good');
      loadStaff(true);
    }).catch(function (e) {
      SR.ui.setLoading(btn, false);
      showErr('#stErr', (e && (e.error || e.message)) || '保存失败');
    });
  });

  /* ---------------- 离职 / 复职 ---------------- */
  function setStaffActive(s, back, btn) {
    var acct = bindOf(s.name);
    var desc = back
      ? '把「' + s.name + '」恢复为在职（只改员工名单，不动账号登录状态）。'
      : '把「' + s.name + '」标记为离职（只改员工名单，不动账号登录）。' +
        (acct ? '账号 ' + acct.username + ' 还能登录，要断登录请到「账号」页停用。' : '');
    ask({
      title: back ? '恢复在职？' : '标记离职？',
      desc: desc,
      okText: back ? '恢复在职' : '标记离职',
      danger: !back
    }).then(function (r) {
      if (!r) return;
      var now = new Date();
      var ymd = now.getFullYear() + '-' +
        String(now.getMonth() + 1).padStart(2, '0') + '-' +
        String(now.getDate()).padStart(2, '0');
      btn.disabled = true;
      SR.db.patch('staff', 'name=eq.' + encodeURIComponent(s.name),
        back ? { active: true, left_at: null } : { active: false, left_at: s.left_at || ymd }
      ).then(function (res) {
        btn.disabled = false;
        if (!res || !res.ok) { SR.ui.toast(dbErrText(res), 'bad'); return; }
        SR.ui.toast(back ? '已恢复在职' : '已标记离职', 'good');
        loadStaff(true);
      }).catch(function (e) {
        btn.disabled = false;
        SR.ui.toast((e && (e.error || e.message)) || '操作失败', 'bad');
      });
    });
  }

  /* ---------------- 绑定 / 换绑 / 解绑 ---------------- */
  function openBindDlg(s, acct) {
    ST.binding = { staff: s, cur: acct };
    $('#bdTitle').textContent = acct ? '换绑 / 改角色' : '绑定账号';
    $('#bdSub').textContent = acct
      ? '「' + s.name + '」现在绑的是 ' + acct.username + '（' + roleText(acct.role) + '）。换到别的账号会先解绑它。'
      : '给「' + s.name + '」选一个账号，绑定后这个人登录就能看到自己的班表。';

    var html = '<option value="">— 先不绑定 —</option>';
    (ST.accounts || []).forEach(function (a) {
      var busy = a.staff_name && a.staff_name !== s.name;
      var label = a.username + (a.display_name ? '（' + a.display_name + '）' : '') +
        (busy ? ' · 已绑 ' + a.staff_name : '');
      html += '<option value="' + esc(a.id) + '"' +
        (acct && acct.id === a.id ? ' selected' : '') +
        (busy ? ' disabled' : '') + '>' + esc(label) + '</option>';
    });
    $('#bdAcct').innerHTML = html;
    $('#bdRole').value = acct ? acct.role : 'employee';
    $('#bdHint').textContent = acct
      ? '换成「只读 / 经理」不需要员工姓名；换成员工必须绑定。'
      : '员工角色必须先绑定姓名，否则他登录后看不到自己的班表。';
    showErr('#bdErr', '');
    $('#bdDlg').classList.add('show');
  }

  $('#bdCancel').addEventListener('click', function () { closeDlg('#bdDlg'); });

  function bindErrText(e) {
    var code = e && e.code;
    var msg = (e && (e.error || e.code)) || '';
    if (code === 'BAD_ACTION' && /unbind/i.test(String(msg))) {
      return '换绑要先解绑旧账号，但线上的 review 函数还没有 unbind 动作：请先部署 supabase/functions/review（或到「账号」页手动处理）。';
    }
    return msg || '操作失败，请重试';
  }

  $('#bdSave').addEventListener('click', function () {
    var btn = this;
    var st = ST.binding;
    if (!st) return;
    var acctId = $('#bdAcct').value;
    var role = $('#bdRole').value;
    var steps = bindSteps(
      { id: st.cur ? st.cur.id : '', username: st.cur ? st.cur.username : '', staff_name: st.staff.name },
      acctId,
      role
    );
    if (!steps.length) {
      showErr('#bdErr', '先选一个账号；不想绑可以点取消');
      return;
    }
    var next = null;
    (ST.accounts || []).forEach(function (a) { if (a.id === acctId) next = a; });
    if (role === 'employee' && !acctId) {
      showErr('#bdErr', '员工角色必须绑定一个账号');
      return;
    }
    showErr('#bdErr', '');
    SR.ui.setLoading(btn, true);

    (function run(i) {
      if (i >= steps.length) {
        SR.ui.setLoading(btn, false);
        closeDlg('#bdDlg');
        SR.ui.toast(next ? '已绑定 ' + next.username : '已解绑', 'good');
        loadStaff(true);
        loadAccounts(true);
        loadReview(true);
        return;
      }
      var step = steps[i];
      var req = step.op === 'unbind'
        ? api('review', { action: 'unbind', id: step.id })
        : api('review', {
            action: 'approve',
            id: step.id,
            staff_name: step.staff_name,
            role: step.role,
            display_name: next ? (next.display_name || next.username) : undefined
          });
      req.then(function () { run(i + 1); }).catch(function (e) {
        SR.ui.setLoading(btn, false);
        showErr('#bdErr', bindErrText(e));
      });
    })(0);
  });

  function unbindStaff(s, acct, btn) {
    if (!acct) return;
    var after = roleAfterUnbind(acct.role);
    var downgrade = after !== acct.role
      ? '角色会从「' + roleText(acct.role) + '」降为「' + roleText(after) + '」，'
      : '';
    ask({
      title: '解绑 ' + acct.username + '？',
      desc: '解绑后这个账号不再对应「' + s.name + '」，' + downgrade + '他就看不到自己的班表了。需要时再绑回来即可。',
      danger: true,
      okText: '解绑'
    }).then(function (r) {
      if (!r) return;
      btn.disabled = true;
      api('review', { action: 'unbind', id: acct.id }).then(function () {
        SR.ui.toast('已解绑 ' + acct.username, 'good');
        loadStaff(true);
        loadAccounts(true);
        loadReview(true);
      }).catch(function (e) {
        btn.disabled = false;
        SR.ui.toast(bindErrText(e), 'bad');
      });
    });
  }

  /* 两个弹层的关闭：点背景 / Esc */
  ['stDlg', 'bdDlg'].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener('click', function (e) { if (e.target === el) el.classList.remove('show'); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if ($('#bdDlg').classList.contains('show')) return closeDlg('#bdDlg');
    if ($('#stDlg').classList.contains('show')) return closeDlg('#stDlg');
  });

  /* ================= 设备 ================= */
  var DV = { devices: [], bans: [], stats: {} };

  function loadDevices(silent) {
    if (!silent) $('#dvList').innerHTML = '<div class="skeleton">载入中…</div>';
    return api('devices', { action: 'list' }).then(function (d) {
      DV = d;
      loaded.devices = true;
      $('#dvStats').innerHTML = [
        ['设备总数', d.stats.devices],
        ['在线会话', d.stats.live],
        ['当前封禁', d.stats.banned_live],
        ['历史解封', d.stats.bans_lifted]
      ].map(function (x) {
        return '<div class="stat"><div class="n">' + x[1] + '</div><div class="k">' + esc(x[0]) + '</div></div>';
      }).join('');
      renderDevices();
      renderBans();
    }).catch(function (e) {
      $('#dvList').innerHTML = '<div class="empty"><b>载入失败</b>' + esc(e.error || '请稍后重试') + '</div>';
    });
  }

  function renderDevices() {
    var q = $('#dvSearch').value.trim().toLowerCase();
    var list = (DV.devices || []).filter(function (d) {
      if (!q) return true;
      return String(d.device_hash).toLowerCase().indexOf(q) >= 0 ||
        String(d.username || '').toLowerCase().indexOf(q) >= 0 ||
        String(d.display_name || '').toLowerCase().indexOf(q) >= 0;
    });

    if (!list.length) {
      $('#dvList').innerHTML = '<div class="list"><div class="empty"><b>没有匹配的设备</b></div></div>';
      return;
    }

    var html = '<div class="list">';
    list.forEach(function (d) {
      var badge = d.banned ? ' <span class="badge bad">已封禁</span>' : '';
      badge += d.revoked_at ? ' <span class="badge">会话已吊销</span>' : ' <span class="badge ok">在线</span>';
      html += '<div class="row" data-hash="' + esc(d.device_hash) + '">' +
        '<div class="grow">' +
          '<div class="name" style="font-family:var(--mono);font-size:13px">' + esc(shortHash(d.device_hash)) + badge + '</div>' +
          '<div class="meta">' +
            '<span>' + esc(d.display_name || d.username || '未知账号') + (d.username ? '（' + esc(d.username) + '）' : '') + '</span>' +
            '<span>' + esc((d.ua || '未知设备').slice(0, 44)) + '</span>' +
            '<span>最后活跃 ' + esc(fmtTime(d.last_seen)) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="actions">' +
          (d.banned
            ? '<button class="btn tint sm" type="button" data-act="unban">解封</button>'
            : '<button class="btn danger sm" type="button" data-act="ban">拉黑</button>') +
          (d.revoked_at ? '' : '<button class="btn ghost sm" type="button" data-act="revoke">踢下线</button>') +
        '</div>' +
      '</div>';
    });
    html += '</div>';
    $('#dvList').innerHTML = html;
  }

  function renderBans() {
    var bans = DV.bans || [];
    if (!bans.length) {
      $('#dvBans').innerHTML = '<div class="list"><div class="empty"><b>黑名单是空的</b>没有设备被封禁</div></div>';
      return;
    }
    var html = '<div class="list">';
    bans.forEach(function (b) {
      html += '<div class="row" data-hash="' + esc(b.device_hash) + '">' +
        '<div class="grow">' +
          '<div class="name" style="font-family:var(--mono);font-size:13px">' + esc(shortHash(b.device_hash)) +
            (b.active ? ' <span class="badge bad">封禁中</span>' : ' <span class="badge ok">已解封</span>') + '</div>' +
          '<div class="meta">' +
            '<span>' + esc(b.username || '未知账号') + '</span>' +
            '<span>' + esc(b.reason || '—') + '</span>' +
            '<span>' + esc(fmtTime(b.banned_at)) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="actions">' +
          (b.active ? '<button class="btn tint sm" type="button" data-act="unban">解封</button>' : '') +
        '</div>' +
      '</div>';
    });
    html += '</div>';
    $('#dvBans').innerHTML = html;
  }

  $('#dvSearch').addEventListener('input', renderDevices);

  function deviceAction(e) {
    var b = e.target.closest('button[data-act]');
    if (!b) return;
    var row = b.closest('.row');
    var hash = row.getAttribute('data-hash');
    var act = b.getAttribute('data-act');

    if (act === 'ban') {
      ask({ title: '拉黑这台设备？', desc: '该设备上所有账号都会被立即踢下线，且永久禁止登录，只能在这里手动解封。', label: '原因', value: '违规使用', danger: true, okText: '拉黑' })
        .then(function (r) {
          if (!r) return;
          b.disabled = true;
          return api('devices', { action: 'ban', device_hash: hash, reason: r.value }).then(function () {
            SR.ui.toast('设备已拉黑', 'good');
            loadDevices(true);
          }).catch(function (err) { b.disabled = false; failToast(err); });
        });
      return;
    }

    if (act === 'unban') {
      b.disabled = true;
      api('devices', { action: 'unban', device_hash: hash }).then(function (d) {
        SR.ui.toast(d.lifted ? '已解封，对方可重新登录' : d.note, d.lifted ? 'good' : undefined);
        loadDevices(true);
      }).catch(function (err) { b.disabled = false; failToast(err); });
      return;
    }

    if (act === 'revoke') {
      b.disabled = true;
      api('devices', { action: 'revoke', device_hash: hash }).then(function () {
        SR.ui.toast('已踢下线（未拉黑）', 'good');
        loadDevices(true);
      }).catch(function (err) { b.disabled = false; failToast(err); });
    }
  }

  $('#dvList').addEventListener('click', deviceAction);
  $('#dvBans').addEventListener('click', deviceAction);

  /* ================= 退出 ================= */
  $('#logout').addEventListener('click', function () {
    ask({ title: '退出登录？', desc: '会清除本机保存的登录状态。', okText: '退出', danger: false })
      .then(function (r) {
        if (!r) return;
        SR.session.clear();
        location.replace('login.html');
      });
  });

  /* ================= 启动 ================= */
  fillOptions($('#stDomain'), DOMAINS, '', '全部部门');
  fillOptions($('#stDomainSel'), DOMAINS, '3c', '');
  loadReview();
  loadInvites();
  loadStaff(true);   // 不切到「人员」页也要有「在职未绑账号」的数字

  /* 每 60 秒静默刷新当前页，方便多人协作时看到新申请 */
  setInterval(function () {
    if (document.hidden) return;
    if (current === 'review') loadReview(true);
    else if (current === 'staff') loadStaff(true);
    else if (current === 'devices') loadDevices(true);
  }, 60000);
})();
</script>
</body>
</html>
